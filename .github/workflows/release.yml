name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
            # Two-stage PGO everywhere; BOLT additionally on Linux only.
            perf_flags: ""
            args: ""
          - platform: ubuntu-26.04
            target: ""
            # `--bolt` adds -Wl,--emit-relocs and turns strip off, i.e. the input
            # LLVM BOLT needs. It is a GNU ld flag, so it stays out of the other
            # legs — and so does `src-tauri/tauri.perf.conf.json` below, whose
            # `beforeBundleCommand` hook is what actually runs BOLT.
            perf_flags: "--bolt"
            args: "--config src-tauri/tauri.perf.conf.json"
          # The macOS artifact targets Apple Silicon, matching current macOS
          # software support and the runner architecture.
          - platform: macos-latest
            target: aarch64-apple-darwin
            perf_flags: ""
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # `bun run build` shells out to `tsc`, and the version check below uses
      # `node -p`, so pin Node rather than trusting the runner image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Pushed tag ${GITHUB_REF_NAME} but tauri.conf.json declares v$version."
            echo "::error::Bump the version in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and package.json, then re-tag."
            exit 1
          fi
          # The MSIX version follows package.json (scripts/sync-msix-version.mjs),
          # so a drifted package.json would ship an installer whose version lies.
          if [ "$pkg" != "$version" ]; then
            echo "::error::package.json declares v$pkg but tauri.conf.json declares v$version."
            exit 1
          fi
          # The Qt shell compares the feed against its own CARGO_PKG_VERSION
          # (read inside dae-qt), and the zip name is built from package.json.
          # A crate that lags behind would make every launch offer the update
          # it just installed, so keep the whole workspace on the release tag.
          for crate in apps/dae crates/dae-qt crates/dae-core; do
            crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$crate/Cargo.toml" | head -n 1)
            if [ "$crate_version" != "$version" ]; then
              echo "::error::$crate/Cargo.toml declares v$crate_version but the tag is ${GITHUB_REF_NAME}."
              echo "::error::Bump apps/dae, crates/dae-qt and crates/dae-core to v$version, then re-tag."
              exit 1
            fi
          done

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config cmake \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev zlib1g-dev rpm \
            xvfb

      # BOLT is optional by design: the post-link step skips it (loudly, in the
      # log) on any runner where the package is missing, rather than failing a
      # release over a post-link optimisation.
      - name: Install LLVM BOLT (Linux, optional)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get install -y llvm-bolt || \
            echo "::warning title=BOLT unavailable::llvm-bolt is not packaged for this runner; the release will ship a PGO-only binary"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Windows leg only: the MSIX steps below need winapp on PATH. Nothing
      # else to run after it — there is no winapp.yaml to `winapp restore`
      # because Tauri brings its own Rust bindings (see the winapp Tauri guide).
      - name: Install winapp CLI
        if: matrix.platform == 'windows-latest'
        uses: microsoft/setup-WinAppCli@v0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # llvm-profdata et al. come from the toolchain rustc itself uses; the
          # distro LLVM is a different version and would refuse the profraw.
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --- LLVM IR PGO -----------------------------------------------------
      # Two builds on every platform: an instrumented one that is only ever run,
      # and the real one compiled from the profile it left behind. The training
      # run is scripted because nobody is here to use the app; on a tagged
      # release it replays startup plus a corpus listing (scripts/opt/pgo.mjs
      # train). BOLT is the Linux-only extra, see the matrix above.
      #
      # `continue-on-error` is deliberate: with no profile the flags step below
      # exports no `-Cprofile-use` (and, on Linux, the BOLT link flags), so the
      # release is simply a normal release build. A release must not be blocked
      # by its optimiser — a runner without a usable GUI session is the expected
      # way this step fails.
      #
      # The signing key is here because the script builds with the release
      # overlay (same embedded config as the shipped binary), which is the only
      # shape of this app that starts: without `plugins.updater` the updater
      # plugin panics during init.
      - name: PGO — instrument and train
        continue-on-error: true
        # bash on all three runners: the Windows default shell is pwsh, and a
        # `--target ""` expansion means something different there.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `--target` is empty on Windows and Linux, and the Apple Silicon triple
        # on macOS: the script forwards it to `tauri build` and also looks for
        # the binary in `target/<triple>/release/`.
        run: bun scripts/opt/pgo.mjs train --seconds 45 --target ${{ matrix.target }}

      # Writes CARGO_ENCODED_RUSTFLAGS (and, with --bolt, the strip override)
      # into the job environment, so the build tauri-action performs below is the
      # PGO build.
      - name: PGO/BOLT — export compile flags
        # bash, not the runner default: `$GITHUB_ENV` is a shell variable on
        # bash/macOS/Linux but needs `$env:` in pwsh.
        shell: bash
        run: bun scripts/opt/pgo.mjs flags ${{ matrix.perf_flags }} >> "$GITHUB_ENV"


      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by the `beforeBundleCommand` hook: how long to run the
          # BOLT-instrumented binary before rewriting it. Unused elsewhere.
          DAE_PERF_TRAIN_SECONDS: "45"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "dae v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          # The updater config and signing requirement live in an overlay so
          # that local `bun tauri build` keeps working without a signing key.
          args: "--config src-tauri/tauri.release.conf.json ${{ matrix.args }}"
          tauriScript: bun tauri
          # Point latest.json at the NSIS installer rather than the MSI, which
          # cannot silently replace a running install.
          updaterJsonPreferNsis: true

      # The MSIX ships the release exe tauri-action just built: its
      # beforeBuildCommand already left the frontend in dist/, so only the exe
      # is copied in. The committed Package.appxmanifest + Assets/ at the repo
      # root are what `winapp pack` picks up (it auto-detects the manifest from
      # the working directory). No `winapp run` registration happens in CI.
      - name: Package MSIX
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          # Optional real code-signing certificate as a base64-encoded .pfx:
          #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx"))
          # Whichever cert is used, its subject must match the manifest's
          # Publisher (CN=Mt342) or installs fail. Without the secret the
          # package falls back to a throwaway development certificate — fine
          # for a draft release, but every user then has to trust a
          # self-signed publisher.
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          node scripts/sync-msix-version.mjs --release
          Copy-Item src-tauri\target\release\dae.exe dist\ -Force
          if ($env:MSIX_CERTIFICATE) {
            [IO.File]::WriteAllBytes("release.pfx", [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            winapp pack .\dist --cert .\release.pfx --cert-password "$env:MSIX_CERTIFICATE_PASSWORD"
          } else {
            winapp cert generate --if-exists skip
            winapp pack .\dist --cert .\devcert.pfx
          }

      # tauri-action created the release as a draft; append the MSIX to that
      # same draft so one manual publish ships every installer. `draft: true`
      # is load-bearing: without it this action PUBLISHES the draft after
      # uploading. Release name/body/notes set by tauri-action are retained.
      - name: Attach MSIX to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: "*.msix"
          draft: true

  # ---------------------------------------------------------------------------
  # Qt shell update artifacts.
  #
  # These jobs are deliberately separate from the Tauri matrix: the Qt shell
  # ships a portable directory (Windows/Linux) or a .app (macOS), not an MSI,
  # NSIS installer or DMG. They also run without PGO/BOLT so a packaging
  # problem cannot hide behind the Tauri optimiser.
  #
  # The archives are signed with the same Tauri updater private key, and the
  # feed is published as `latest-qt.json` on the same (draft) release. Once the
  # release is published, `releases/latest/download/latest-qt.json` is the URL
  # baked into dae-core (`DEFAULT_FEED_URL`).
  # ---------------------------------------------------------------------------
  qt:
    name: Qt shell (${{ matrix.platform_key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            platform_key: windows-x86_64
            qt_arch: win64_msvc2022_64
            target: ""
            binary: target/release/dae.exe
          - platform: ubuntu-26.04
            platform_key: linux-x86_64
            qt_arch: linux_gcc_64
            target: ""
            binary: target/release/dae
          # Matches the Tauri leg above: Apple Silicon only.
          - platform: macos-latest
            platform_key: darwin-aarch64
            qt_arch: clang_64
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/dae

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Qt's Linux binaries need both the runtime XCB/Wayland packages and the
      # development headers used by cxx-qt. `patchelf` is for the portable
      # layout below, and zip/unzip are only for packaging checks.
      - name: Install Linux Qt build dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-xcb-dev libxrender-dev libxext-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libgtk-3-dev libgdk-pixbuf-2.0-dev librsvg2-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libsecret-1-dev patchelf zip unzip

      # The same Qt minor as the local development instructions. cxx-qt picks
      # qmake up from PATH; QT_ROOT_DIR is used by the deployment steps.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qt-6.12-${{ matrix.platform_key }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: qt-${{ matrix.platform_key }}
          cache-on-failure: true

      - name: Install winapp CLI
        if: matrix.platform == 'windows-latest'
        uses: microsoft/setup-WinAppCli@v0.2

      - name: Build Qt shell
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --package dae-app --target ${{ matrix.target }}
          else
            cargo build --release --package dae-app
          fi

      # ---- Windows: windeployqt -> optional Authenticode -> root-level zip ----
      - name: Deploy Qt runtime and package (Windows)
        if: matrix.platform == 'windows-latest'
        # PowerShell 7 is load-bearing: Windows PowerShell 5.1 writes backslash
        # separators into the archive, which violates the zip layout §4.10 and
        # the forward-slash checks below.
        shell: pwsh
        env:
          # Optional real certificate, same secret the MSIX uses. The updater
          # itself trusts minisign, not Authenticode; this only suppresses the
          # unsigned-publisher prompt when a certificate is configured.
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $staging = Join-Path $PWD 'dist\qt'
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item '${{ matrix.binary }}' (Join-Path $staging 'dae.exe') -Force

          & (Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe') `
            --release --no-translations --compiler-runtime --qmldir qml `
            (Join-Path $staging 'dae.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          foreach ($required in @('dae.exe', 'platforms\qwindows.dll', 'qml\QtQuick')) {
            if (-not (Test-Path (Join-Path $staging $required))) {
              throw "windeployqt did not produce $required"
            }
          }

          if ($env:MSIX_CERTIFICATE) {
            [IO.File]::WriteAllBytes('release.pfx', [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            winapp sign (Join-Path $staging 'dae.exe') release.pfx `
              --password "$env:MSIX_CERTIFICATE_PASSWORD" `
              --timestamp https://timestamp.digicert.com
            if ($LASTEXITCODE -ne 0) {
              throw "winapp sign failed with exit code $LASTEXITCODE"
            }
            Remove-Item release.pfx -Force -ErrorAction SilentlyContinue
          }

          $out = Join-Path $PWD 'dist\qt-release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $zip = Join-Path $out "dae-$version-${{ matrix.platform_key }}.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('dae.exe', 'platforms/qwindows.dll', 'qml/QtQuick')) {
              if (-not ($names | Where-Object { $_ -eq $required -or $_.StartsWith("$required/") })) {
                throw "$zip is missing $required"
              }
            }
          } finally {
            $archive.Dispose()
          }

      # ---- Linux: linuxdeploy + Qt plugin -> portable root layout -> zip ----
      - name: Deploy Qt runtime and package (Linux)
        if: matrix.platform == 'ubuntu-26.04'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          staging="$PWD/dist/qt"
          appdir="$PWD/dist/qt-appdir"
          rm -rf "$staging" "$appdir"
          mkdir -p "$appdir/usr/bin"
          cp target/release/dae "$appdir/usr/bin/dae"
          cp packaging/qt/dae.desktop "$appdir/dae.desktop"
          cp src-tauri/icons/128x128.png "$appdir/dae.png"

          tools="$PWD/dist/qt-tools"
          mkdir -p "$tools"
          wget -q --tries=3 --timeout=30 -O "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q --tries=3 --timeout=30 -O "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools/"*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          if [ -x "$QT_ROOT_DIR/bin/qmake6" ]; then
            export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          else
            export QMAKE="$QT_ROOT_DIR/bin/qmake"
          fi
          # QML is compiled into the binary; the scanner still needs the source
          # tree to know which Qt Quick modules to deploy.
          export QML_SOURCES_PATHS="$PWD/qml"

          "$tools/linuxdeploy-x86_64.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/dae" \
            --desktop-file "$appdir/dae.desktop" \
            --icon-file "$appdir/dae.png" \
            --plugin qt

          test -f "$appdir/usr/plugins/platforms/libqxcb.so"
          test -d "$appdir/usr/qml/QtQuick"

          # Start from linuxdeploy's AppDir, then fold `usr/` into the
          # install-directory shape §4.10 requires: executable at the root,
          # Qt libraries beside it in lib/, and every plugin directory
          # (including platforms/) at the root.
          mkdir -p "$staging"
          cp "$appdir/usr/bin/dae" "$staging/dae"
          cp -a "$appdir/usr/lib" "$staging/lib"
          for plugin in "$appdir"/usr/plugins/*; do
            cp -a "$plugin" "$staging/"
          done
          cp -a "$appdir/usr/qml" "$staging/qml"
          if [ -d "$appdir/usr/translations" ]; then
            cp -a "$appdir/usr/translations" "$staging/translations"
          fi
          cp packaging/qt/dae.desktop "$staging/dae.desktop"
          cp src-tauri/icons/128x128.png "$staging/dae.png"
          cat > "$staging/qt.conf" <<'EOF'
          [Paths]
          Prefix = .
          Libraries = lib
          Plugins = .
          Imports = qml
          Qml2Imports = qml
          Translations = translations
          EOF

          chmod +x "$staging/dae"
          patchelf --set-rpath '$ORIGIN/lib' "$staging/dae"
          find "$staging/lib" -maxdepth 1 -type f -name '*.so*' \
            -exec patchelf --set-rpath '$ORIGIN' {} +
          # Plugin directories moved from usr/plugins/<name> to <name>.
          for plugin_dir in "$staging"/*/; do
            case "$(basename "$plugin_dir")" in
              lib|qml|translations) continue ;;
            esac
            find "$plugin_dir" -maxdepth 1 -type f -name '*.so*' \
              -exec patchelf --set-rpath '$ORIGIN/../lib' {} +
          done
          # QML plugins keep their depth, but recompute anyway so a different
          # module layout cannot silently lose the path to lib/.
          while IFS= read -r -d '' module; do
            relative=$(realpath --relative-to="$(dirname "$module")" "$staging/lib")
            patchelf --set-rpath "\$ORIGIN/$relative" "$module"
          done < <(find "$staging/qml" -type f -name '*.so*' -print0)

          if env -u LD_LIBRARY_PATH ldd "$staging/dae" | grep -q 'not found'; then
            env -u LD_LIBRARY_PATH ldd "$staging/dae" | grep 'not found'
            echo "::error::the portable Qt tree is missing a shared library"
            exit 1
          fi

          out="$PWD/dist/qt-release"
          mkdir -p "$out"
          zip="$out/dae-$version-${{ matrix.platform_key }}.zip"
          rm -f "$zip"
          shopt -s dotglob nullglob
          (cd "$staging" && zip -r -y -X -q "$zip" *)
          unzip -Z1 "$zip" | grep -qx 'platforms/libqxcb.so'
          unzip -Z1 "$zip" | grep -qx 'dae'

      # ---- macOS: .app + macdeployqt -> ad-hoc sign -> zip the bundle ----
      - name: Deploy Qt runtime and package (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          staging="$PWD/dist/qt"
          app="$staging/dae.app"
          rm -rf "$staging"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/aarch64-apple-darwin/release/dae "$app/Contents/MacOS/dae"
          cp packaging/qt/Info.plist "$app/Contents/Info.plist"
          cp src-tauri/icons/icon.icns "$app/Contents/Resources/icon.icns"
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          macdeployqt "$app" -qmldir="$PWD/qml" -always-overwrite
          test -d "$app/Contents/Frameworks"
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          test -d "$app/Contents/Resources/qml/QtQuick"

          # Ad-hoc signing keeps the bundle internally consistent. A Developer
          # ID signature and notarization would need Apple credentials this
          # workflow does not have; updates downloaded by the app do not carry
          # the quarantine attribute.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"

          out="$PWD/dist/qt-release"
          mkdir -p "$out"
          zip="$out/dae-$version-${{ matrix.platform_key }}.zip"
          rm -f "$zip"
          (cd "$staging" && COPYFILE_DISABLE=1 zip -r -y -X -q "$zip" dae.app)
          unzip -Z1 "$zip" | grep -qx 'dae.app/Contents/MacOS/dae'
          tops=$(unzip -Z1 "$zip" | awk -F/ '{print $1}' | sort -u | tr -d '\r')
          if [ "$tops" != "dae.app" ]; then
            echo "::error::the macOS archive must contain only dae.app, got: $tops"
            exit 1
          fi

      # Reuses the release minisign key. The public half is the
      # `UPDATE_PUBLIC_KEY` constant in dae-core/src/update/mod.rs, so a
      # signature produced here is exactly what the installed app verifies.
      - name: Install frontend dependencies for the Tauri signer
        run: bun install --frozen-lockfile

      - name: Sign the Qt update archive
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="dist/qt-release/dae-$version-${{ matrix.platform_key }}.zip"
          test -s "$zip"

          # Tauri accepts either the key text or a path in this variable.
          # `signer sign` only accepts the text, so normalize a path secret.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            TAURI_SIGNING_PRIVATE_KEY="$(cat "$TAURI_SIGNING_PRIVATE_KEY")"
            export TAURI_SIGNING_PRIVATE_KEY
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured; refusing to publish an unsigned Qt update."
            exit 1
          fi

          bun tauri signer sign "$zip" --app-version "$version"
          test -s "$zip.sig"

      - name: Upload Qt update artifact
        uses: actions/upload-artifact@v7
        with:
          name: qt-${{ matrix.platform_key }}
          path: dist/qt-release/*
          if-no-files-found: error
          retention-days: 7

  # Merge the matrix results into the single feed the app fetches. This runs
  # after the Tauri matrix too, because tauri-action is what creates the draft
  # release these assets are appended to.
  qt-feed:
    name: Qt update feed
    needs: [build, qt]
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download Qt artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: qt-*
          path: dist-qt
          merge-multiple: true

      - name: Generate latest-qt.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/qt-update-feed.mjs \
            --dir dist-qt \
            --version "$version" \
            --notes-file "docs/release-notes/v$version.md"
          cat dist-qt/latest-qt.json

      # Upload the archives first and the feed last: a feed at
      # `releases/latest/download/latest-qt.json` must never advertise a zip
      # that is not on the same release yet.
      - name: Attach Qt assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist-qt/*.zip --clobber
          gh release upload "${GITHUB_REF_NAME}" dist-qt/latest-qt.json --clobber
          gh release view "${GITHUB_REF_NAME}" --json isDraft,tagName,assets \
            --jq '"release " + .tagName + " draft=" + (.isDraft|tostring) + " assets=" + ([.assets[].name]|join(","))'
