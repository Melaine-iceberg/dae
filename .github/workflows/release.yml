name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs exist to smoke-test one platform before a tag is worth cutting:
  # they build that leg and leave the results as Actions artifacts, and nothing
  # else. Everything that publishes — tauri-action's draft, the MSIX attach, the
  # update feed — is gated on `github.event_name == 'push'`, so a manual run
  # cannot create, modify or publish a release even by accident.
  #
  # `linux-x86_64` and `windows-x86_64` need no secrets. `darwin-aarch64` still
  # does: its packaging step notarizes, and refuses to continue without the
  # Apple credentials.
  workflow_dispatch:
    inputs:
      platform_key:
        description: "Which leg to build; a manual run builds only this one"
        type: choice
        options:
          - linux-x86_64
          - windows-x86_64
          - darwin-aarch64
        default: linux-x86_64
      perf:
        description: "Run the PGO/BOLT training pass (recommended off for a smoke test)"
        type: boolean
        default: false

permissions:
  contents: write

# A tag build must never cancel another tag build: two runs racing over the same
# release would interleave their uploads. Manual runs have no release to protect,
# and the second attempt at a smoke test is usually the one that matters, so they
# supersede each other instead of queueing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    # This job is the one tauri-action turns into a draft release, and it builds
    # three installer sets nobody needs for a smoke test.
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
            # Two-stage PGO everywhere; BOLT additionally on Linux only.
            perf_flags: ""
            args: ""
          - platform: ubuntu-26.04
            target: ""
            # `--bolt` adds -Wl,--emit-relocs and turns strip off, i.e. the input
            # LLVM BOLT needs. It is a GNU ld flag, so it stays out of the other
            # legs — and so does `src-tauri/tauri.perf.conf.json` below, whose
            # `beforeBundleCommand` hook is what actually runs BOLT.
            perf_flags: "--bolt"
            args: "--config src-tauri/tauri.perf.conf.json"
          # The macOS artifact targets Apple Silicon, matching current macOS
          # software support and the runner architecture.
          - platform: macos-latest
            target: aarch64-apple-darwin
            perf_flags: ""
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # `bun run build` shells out to `tsc`, and the version check below uses
      # `node -p`, so pin Node rather than trusting the runner image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Pushed tag ${GITHUB_REF_NAME} but tauri.conf.json declares v$version."
            echo "::error::Bump the version in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and package.json, then re-tag."
            exit 1
          fi
          # The MSIX version follows package.json (scripts/sync-msix-version.mjs),
          # so a drifted package.json would ship an installer whose version lies.
          if [ "$pkg" != "$version" ]; then
            echo "::error::package.json declares v$pkg but tauri.conf.json declares v$version."
            exit 1
          fi
          # The Qt shell compares the feed against its own CARGO_PKG_VERSION
          # (read inside dae-qt), and the zip name is built from package.json.
          # A crate that lags behind would make every launch offer the update
          # it just installed, so keep the whole workspace on the release tag.
          for crate in apps/dae crates/dae-qt crates/dae-core; do
            crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$crate/Cargo.toml" | head -n 1)
            if [ "$crate_version" != "$version" ]; then
              echo "::error::$crate/Cargo.toml declares v$crate_version but the tag is ${GITHUB_REF_NAME}."
              echo "::error::Bump apps/dae, crates/dae-qt and crates/dae-core to v$version, then re-tag."
              exit 1
            fi
          done

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config cmake \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev zlib1g-dev rpm \
            xvfb

      # BOLT is optional by design: the post-link step skips it (loudly, in the
      # log) on any runner where the package is missing, rather than failing a
      # release over a post-link optimisation.
      - name: Install LLVM BOLT (Linux, optional)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get install -y llvm-bolt || \
            echo "::warning title=BOLT unavailable::llvm-bolt is not packaged for this runner; the release will ship a PGO-only binary"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # llvm-profdata et al. come from the toolchain rustc itself uses; the
          # distro LLVM is a different version and would refuse the profraw.
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --- LLVM IR PGO -----------------------------------------------------
      # Two builds on every platform: an instrumented one that is only ever run,
      # and the real one compiled from the profile it left behind. The training
      # run is scripted because nobody is here to use the app; on a tagged
      # release it replays startup plus a corpus listing (scripts/opt/pgo.mjs
      # train). BOLT is the Linux-only extra, see the matrix above.
      #
      # `continue-on-error` is deliberate: with no profile the flags step below
      # exports no `-Cprofile-use` (and, on Linux, the BOLT link flags), so the
      # release is simply a normal release build. A release must not be blocked
      # by its optimiser — a runner without a usable GUI session is the expected
      # way this step fails.
      #
      # The signing key is here because the script builds with the release
      # overlay (same embedded config as the shipped binary), which is the only
      # shape of this app that starts: without `plugins.updater` the updater
      # plugin panics during init.
      - name: PGO — instrument and train
        continue-on-error: true
        # bash on all three runners: the Windows default shell is pwsh, and a
        # `--target ""` expansion means something different there.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `--target` is empty on Windows and Linux, and the Apple Silicon triple
        # on macOS: the script forwards it to `tauri build` and also looks for
        # the binary in `target/<triple>/release/`.
        run: bun scripts/opt/pgo.mjs train --seconds 45 --target ${{ matrix.target }}

      # Writes CARGO_ENCODED_RUSTFLAGS (and, with --bolt, the strip override)
      # into the job environment, so the build tauri-action performs below is the
      # PGO build.
      - name: PGO/BOLT — export compile flags
        # bash, not the runner default: `$GITHUB_ENV` is a shell variable on
        # bash/macOS/Linux but needs `$env:` in pwsh.
        shell: bash
        run: bun scripts/opt/pgo.mjs flags ${{ matrix.perf_flags }} >> "$GITHUB_ENV"


      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by the `beforeBundleCommand` hook: how long to run the
          # BOLT-instrumented binary before rewriting it. Unused elsewhere.
          DAE_PERF_TRAIN_SECONDS: "45"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "dae v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          # The updater config and signing requirement live in an overlay so
          # that local `bun tauri build` keeps working without a signing key.
          args: "--config src-tauri/tauri.release.conf.json ${{ matrix.args }}"
          tauriScript: bun tauri
          # Point latest.json at the NSIS installer rather than the MSI, which
          # cannot silently replace a running install.
          updaterJsonPreferNsis: true

  # ---------------------------------------------------------------------------
  # Windows MSIX.
  #
  # The package used to carry `src-tauri\target\release\dae.exe` — the Tauri
  # shell — which is the one artifact this migration is retiring. It now ships
  # the Qt shell's deployed tree: the same bytes as the portable zip, Qt runtime
  # and QML modules included, so an installed copy has `platforms\qwindows.dll`
  # and `qml\QtQuick` beside the executable exactly as the zip does.
  #
  # That is why it is its own job instead of a step in `build`: it needs the
  # archive the `qt` job produces, and `build` is what creates the draft release
  # both artifacts are attached to.
  #
  # Two consequences of a packaged install, both handled in the engine rather
  # than here: the tree under `C:\Program Files\WindowsApps` is read-only and
  # re-versioned on every update, so `dae-core` turns the portable self-updater
  # off when it detects package identity, and `dae://` comes from the manifest's
  # protocol extension instead of the per-user registry write.
  # ---------------------------------------------------------------------------
  msix:
    name: Windows MSIX
    needs: [build, qt]
    runs-on: windows-latest
    # Attaches its package to the draft release, which a manual run has none of.
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install winapp CLI
        uses: microsoft/setup-WinAppCli@v0.2

      - name: Download the Qt shell archive
        uses: actions/download-artifact@v8
        with:
          name: qt-windows-x86_64
          path: staging

      # `dist/` is what the committed Package.appxmanifest describes: the
      # manifest and Assets/ stay at the repo root, where `winapp pack` looks
      # for them (it auto-detects the manifest from the working directory), and
      # only the payload is staged here.
      - name: Stage the package payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem staging -Filter 'dae-*-windows-x86_64.zip' |
            Select-Object -First 1
          if (-not $zip) {
            throw "the qt job uploaded no Windows archive"
          }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Force dist | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath dist

          # These are the files that prove the payload is the deployed Qt shell
          # and not a bare executable: the old MSIX contained dae.exe alone and
          # would still start, so a missing runtime has to fail the release
          # rather than ship a package that cannot open a window.
          foreach ($required in @(
              'dae.exe',
              'platforms\qwindows.dll',
              'qml\QtQuick',
              'qml\QtMultimedia',
              'multimedia')) {
            if (-not (Test-Path (Join-Path dist $required))) {
              throw "the MSIX payload is missing $required"
            }
          }
          "payload: {0:N1} MB, {1} top-level entries" -f `
            ((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), `
            (Get-ChildItem dist | Measure-Object).Count

      - name: Package MSIX
        shell: pwsh
        env:
          # Optional real code-signing certificate as a base64-encoded .pfx:
          #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx"))
          # Whichever cert is used, its subject must match the manifest's
          # Publisher (CN=Mt342) or installs fail. Without the secret the
          # package falls back to a throwaway development certificate — fine
          # for a draft release, but every user then has to trust a
          # self-signed publisher.
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/sync-msix-version.mjs --release
          if ($env:MSIX_CERTIFICATE) {
            [IO.File]::WriteAllBytes("release.pfx", [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            winapp pack .\dist --cert .\release.pfx --cert-password "$env:MSIX_CERTIFICATE_PASSWORD"
          } else {
            winapp cert generate --if-exists skip
            winapp pack .\dist --cert .\devcert.pfx
          }
          if ($LASTEXITCODE -ne 0) { throw "winapp pack failed with exit code $LASTEXITCODE" }

      # The draft was created by tauri-action; append the MSIX to that same
      # draft so one manual publish ships every installer. `draft: true` is
      # load-bearing: without it this action PUBLISHES the draft after
      # uploading. Release name/body/notes set by tauri-action are retained.
      - name: Attach MSIX to release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.msix"
          draft: true

  # ---------------------------------------------------------------------------
  # Qt shell update artifacts.
  #
  # These jobs are deliberately separate from the Tauri matrix: the Qt shell
  # ships a portable directory (Windows/Linux) or a .app (macOS), not an MSI,
  # NSIS installer or DMG. They now get the same two-stage PGO (and BOLT on
  # Linux) as the Tauri legs; every optimisation step degrades to a plain
  # release build, so a missing profile cannot block packaging.
  #
  # The archives are signed with the same Tauri updater private key, and the
  # feed is published as `latest-qt.json` on the same (draft) release. Once the
  # release is published, `releases/latest/download/latest-qt.json` is the URL
  # baked into dae-core (`DEFAULT_FEED_URL`).
  # ---------------------------------------------------------------------------

  # The leg list is data here rather than an inline `matrix.include` because
  # `matrix` is unavailable to `jobs.<id>.if`: for a manual run to build one
  # leg, the filtering has to happen before the matrix exists. On a tag push
  # this job returns all three legs verbatim.
  plan:
    name: Plan Qt legs
    runs-on: ubuntu-26.04
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - name: Select legs
        id: legs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.platform_key }}
        run: |
          set -euo pipefail
          # `perf_flags` is only meaningful where the toolchain consumes it:
          # `--bolt` is ELF-only, so it stays on the Linux leg.
          all='[
            {"platform":"windows-latest","platform_key":"windows-x86_64","qt_arch":"win64_msvc2022_64","target":"","perf_flags":"","binary":"target/release/dae.exe"},
            {"platform":"ubuntu-26.04","platform_key":"linux-x86_64","qt_arch":"linux_gcc_64","target":"","perf_flags":"--bolt","binary":"target/release/dae"},
            {"platform":"macos-latest","platform_key":"darwin-aarch64","qt_arch":"clang_64","target":"aarch64-apple-darwin","perf_flags":"","binary":"target/aarch64-apple-darwin/release/dae"}
          ]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            legs=$(printf '%s' "$all" | jq -c --arg k "$ONLY" '[.[] | select(.platform_key == $k)]')
            if [ "$(printf '%s' "$legs" | jq length)" -eq 0 ]; then
              echo "::error::unknown platform_key '$ONLY'"
              exit 1
            fi
          else
            legs=$(printf '%s' "$all" | jq -c .)
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          printf 'qt legs: %s\n' "$(printf '%s' "$legs" | jq -r '.[].platform_key' | tr '\n' ' ')"

  qt:
    name: Qt shell (${{ matrix.platform_key }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Qt's Linux binaries need both the runtime XCB/Wayland packages and the
      # development headers used by cxx-qt. `patchelf` is for the portable
      # layout below, and zip/unzip are only for packaging checks.
      - name: Install Linux Qt build dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-xcb-dev libxrender-dev libxext-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libgtk-3-dev libgdk-pixbuf-2.0-dev librsvg2-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libsecret-1-dev patchelf zip unzip xvfb \
            rpm cpio

      # BOLT is optional by design: `post-link` skips it loudly on a runner
      # without the package, rather than failing a release over an
      # optimisation.
      - name: Install LLVM BOLT (Linux, optional)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get install -y llvm-bolt || \
            echo "::warning title=BOLT unavailable::llvm-bolt is not packaged for this runner; the Qt release will ship a PGO-only binary"

      # The same Qt minor as the local development instructions. cxx-qt picks
      # qmake up from PATH; QT_ROOT_DIR is used by the deployment steps.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qt-6.12-${{ matrix.platform_key }}
          # The preview pane's in-place player imports QtMultimedia.
          modules: qtmultimedia

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # llvm-profdata must be the one rustc ships, or it refuses the
          # profraw files rustc wrote. See docs/pgo-bolt.md §2.
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: qt-${{ matrix.platform_key }}
          cache-on-failure: true

      - name: Install winapp CLI
        if: matrix.platform == 'windows-latest'
        uses: microsoft/setup-WinAppCli@v0.2

      # --- LLVM IR PGO ---------------------------------------------------
      # The Qt shell gets the same two-stage flow as the Tauri legs: an
      # instrumented build is trained on a generated corpus, merged, and the
      # resulting flags drive the real build below. `continue-on-error` is
      # deliberate — the flags step then exports no `-Cprofile-use` and the
      # release is a plain release build, never blocked by its optimiser.
      - name: PGO — instrument and train (Qt shell)
        # A smoke test wants a runnable binary, not a benchmark: with `perf`
        # off the profile steps are skipped and the build below is a plain
        # release build, exactly as it degrades when a profile is missing.
        if: github.event_name != 'workflow_dispatch' || inputs.perf
        continue-on-error: true
        shell: bash
        env:
          DAE_QML_AOT: "1"
        run: bun scripts/opt/pgo.mjs train --seconds 45 --qt --target ${{ matrix.target }}

      # Writes CARGO_ENCODED_RUSTFLAGS and — for the Qt shell — the C++ bridge
      # profile into the job environment. `--bolt` on Linux additionally sets
      # the emit-relocs link flag and keeps symbols for the post-link step.
      - name: PGO/BOLT — export compile flags
        if: github.event_name != 'workflow_dispatch' || inputs.perf
        shell: bash
        run: bun scripts/opt/pgo.mjs flags --qt ${{ matrix.perf_flags }} >> "$GITHUB_ENV"

      - name: Build Qt shell
        shell: bash
        # `DAE_QML_AOT=1` makes the ahead-of-time QML compilation fatal rather
        # than a warning: a release that silently shipped without the units
        # would boot like the pre-AOT build and nobody would notice. See
        # docs/qml-aot.md.
        env:
          DAE_QML_AOT: "1"
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --package dae-app --target ${{ matrix.target }}
          else
            cargo build --release --package dae-app
          fi

      # BOLT runs on the linked binary, after `cargo build` and before the
      # deployment steps copy it. Best-effort: a missing profile or tool strips
      # the binary and continues.
      - name: LLVM BOLT (Linux)
        # BOLT consumes the relocations that `--bolt` above only emits when the
        # flags step ran, so it follows the same switch.
        if: matrix.platform == 'ubuntu-26.04' && (github.event_name != 'workflow_dispatch' || inputs.perf)
        shell: bash
        env:
          DAE_PERF_TRAIN_SECONDS: "45"
        run: bun scripts/opt/post-link.mjs --qt

      # ---- Windows: windeployqt -> optional Authenticode -> root-level zip ----
      - name: Deploy Qt runtime and package (Windows)
        if: matrix.platform == 'windows-latest'
        # PowerShell 7 is load-bearing: Windows PowerShell 5.1 writes backslash
        # separators into the archive, which violates the zip layout §4.10 and
        # the forward-slash checks below.
        shell: pwsh
        env:
          # Optional real certificate, same secret the MSIX uses. The updater
          # itself trusts minisign, not Authenticode; this only suppresses the
          # unsigned-publisher prompt when a certificate is configured.
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $staging = Join-Path $PWD 'dist\qt'
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item '${{ matrix.binary }}' (Join-Path $staging 'dae.exe') -Force

          & (Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe') `
            --release --no-translations --compiler-runtime --qmldir qml `
            (Join-Path $staging 'dae.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          foreach ($required in @('dae.exe', 'platforms\qwindows.dll', 'qml\QtQuick', 'qml\QtMultimedia', 'multimedia')) {
            if (-not (Test-Path (Join-Path $staging $required))) {
              throw "windeployqt did not produce $required"
            }
          }

          if ($env:MSIX_CERTIFICATE) {
            [IO.File]::WriteAllBytes('release.pfx', [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            winapp sign (Join-Path $staging 'dae.exe') release.pfx `
              --password "$env:MSIX_CERTIFICATE_PASSWORD" `
              --timestamp https://timestamp.digicert.com
            if ($LASTEXITCODE -ne 0) {
              throw "winapp sign failed with exit code $LASTEXITCODE"
            }
            Remove-Item release.pfx -Force -ErrorAction SilentlyContinue
          }

          $out = Join-Path $PWD 'dist\qt-release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $zip = Join-Path $out "dae-$version-${{ matrix.platform_key }}.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('dae.exe', 'platforms/qwindows.dll', 'qml/QtQuick')) {
              if (-not ($names | Where-Object { $_ -eq $required -or $_.StartsWith("$required/") })) {
                throw "$zip is missing $required"
              }
            }
          } finally {
            $archive.Dispose()
          }

      # ---- Linux: linuxdeploy + Qt plugin -> portable root layout -> zip ----
      - name: Deploy Qt runtime and package (Linux)
        if: matrix.platform == 'ubuntu-26.04'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          staging="$PWD/dist/qt"
          appdir="$PWD/dist/qt-appdir"
          rm -rf "$staging" "$appdir"
          mkdir -p "$appdir/usr/bin"
          cp target/release/dae "$appdir/usr/bin/dae"
          cp packaging/qt/dae.desktop "$appdir/dae.desktop"
          cp src-tauri/icons/128x128.png "$appdir/dae.png"

          tools="$PWD/dist/qt-tools"
          mkdir -p "$tools"
          wget -q --tries=3 --timeout=30 -O "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q --tries=3 --timeout=30 -O "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools/"*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          if [ -x "$QT_ROOT_DIR/bin/qmake6" ]; then
            export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          else
            export QMAKE="$QT_ROOT_DIR/bin/qmake"
          fi
          # QML is compiled into the binary; the scanner still needs the source
          # tree to know which Qt Quick modules to deploy.
          export QML_SOURCES_PATHS="$PWD/qml"
          # linuxdeploy-plugin-qt deploys `libqxcb.so` and nothing else from
          # `platforms/` unless the others are named. Which Wayland plugins a Qt
          # ships is version dependent — 6.12 has a single `libqwayland.so`,
          # older builds split it into `libqwayland-generic.so` and
          # `libqwayland-egl.so` — so name what this install actually has
          # rather than a list that only holds for one release.
          platforms="$QT_ROOT_DIR/plugins/platforms"
          wayland_plugins=$(cd "$platforms" 2>/dev/null && ls -1 libqwayland*.so 2>/dev/null | paste -sd';' -) || true
          if [ -z "$wayland_plugins" ]; then
            echo "::group::$platforms"
            ls -1 "$platforms" 2>/dev/null || echo "(no platforms directory at all)"
            echo "::endgroup::"
            echo "::error::this Qt ships no Wayland platform plugin, so the shell would fall back to XWayland"
            exit 1
          fi
          echo "wayland platform plugins: $wayland_plugins"
          export EXTRA_PLATFORM_PLUGINS="$wayland_plugins"
          # Multimedia is reached from QML (`MediaPreview.qml` imports
          # QtMultimedia), never from a symbol in the executable, so the plugin
          # does not detect the module on its own and deploys no media backend.
          # `EXTRA_QT_MODULES` is the documented way to force it.
          export EXTRA_QT_MODULES='multimedia'

          "$tools/linuxdeploy-x86_64.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/dae" \
            --desktop-file "$appdir/dae.desktop" \
            --icon-file "$appdir/dae.png" \
            --plugin qt

          test -f "$appdir/usr/plugins/platforms/libqxcb.so"
          # The Wayland backend is what makes ext-background-effect-v1 blur
          # reachable; without it the app silently runs through XWayland and
          # the shell stays solid. Fail the build rather than ship that.
          if ! compgen -G "$appdir/usr/plugins/platforms/libqwayland*.so" >/dev/null; then
            echo "::error::the Qt Wayland platform plugin was not deployed"
            exit 1
          fi
          # One message per missing piece. A bare `test` fails the step with an
          # exit code and no name, which is how the missing media backend took
          # a whole debugging round to identify.
          #
          # QtMultimedia on Linux is a GStreamer client. Its plugin is deployed
          # here; the codec plugins themselves come from the target desktop and
          # are documented as a runtime dependency.
          for required in \
            usr/qml/QtQuick \
            usr/qml/QtMultimedia \
            usr/plugins/multimedia; do
            if [ -e "$appdir/$required" ]; then continue; fi
            echo "::error::linuxdeploy did not deploy $required"
            echo "::group::$appdir/usr/plugins"
            ls -1 "$appdir/usr/plugins" 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          done

          # Start from linuxdeploy's AppDir, then fold `usr/` into the
          # install-directory shape §4.10 requires: executable at the root,
          # Qt libraries beside it in lib/, and every plugin directory
          # (including platforms/) at the root.
          mkdir -p "$staging"
          cp "$appdir/usr/bin/dae" "$staging/dae"
          cp -a "$appdir/usr/lib" "$staging/lib"
          for plugin in "$appdir"/usr/plugins/*; do
            cp -a "$plugin" "$staging/"
          done
          cp -a "$appdir/usr/qml" "$staging/qml"
          if [ -d "$appdir/usr/translations" ]; then
            cp -a "$appdir/usr/translations" "$staging/translations"
          fi
          cp packaging/qt/dae.desktop "$staging/dae.desktop"
          cp src-tauri/icons/128x128.png "$staging/dae.png"
          cat > "$staging/qt.conf" <<'EOF'
          [Paths]
          Prefix = .
          Libraries = lib
          Plugins = .
          Imports = qml
          Qml2Imports = qml
          Translations = translations
          EOF

          chmod +x "$staging/dae"
          patchelf --set-rpath '$ORIGIN/lib' "$staging/dae"
          find "$staging/lib" -maxdepth 1 -type f -name '*.so*' \
            -exec patchelf --set-rpath '$ORIGIN' {} +
          # Plugin directories moved from usr/plugins/<name> to <name>.
          for plugin_dir in "$staging"/*/; do
            case "$(basename "$plugin_dir")" in
              lib|qml|translations) continue ;;
            esac
            find "$plugin_dir" -maxdepth 1 -type f -name '*.so*' \
              -exec patchelf --set-rpath '$ORIGIN/../lib' {} +
          done
          # QML plugins keep their depth, but recompute anyway so a different
          # module layout cannot silently lose the path to lib/.
          while IFS= read -r -d '' module; do
            relative=$(realpath --relative-to="$(dirname "$module")" "$staging/lib")
            patchelf --set-rpath "\$ORIGIN/$relative" "$module"
          done < <(find "$staging/qml" -type f -name '*.so*' -print0)

          if env -u LD_LIBRARY_PATH ldd "$staging/dae" > "$RUNNER_TEMP/dae-ldd.txt" &&
            grep -q 'not found' "$RUNNER_TEMP/dae-ldd.txt"; then
            cat "$RUNNER_TEMP/dae-ldd.txt"
            echo "::error::the portable Qt tree is missing a shared library"
            exit 1
          fi

          out="$PWD/dist/qt-release"
          mkdir -p "$out"
          zip="$out/dae-$version-${{ matrix.platform_key }}.zip"
          rm -f "$zip"
          shopt -s dotglob nullglob
          (cd "$staging" && zip -r -y -X -q "$zip" *)
          # One listing, three assertions. Piping `unzip` into `grep -q` reads
          # the same, but under `set -o pipefail` grep's early exit kills unzip
          # with SIGPIPE and the pipeline reports 141 instead of "found".
          names=$(unzip -Z1 "$zip")
          for required in 'platforms/libqxcb.so' 'dae'; do
            grep -qxF "$required" <<< "$names"
          done
          if ! grep -q '^platforms/libqwayland.*\.so$' <<< "$names"; then
            echo "::error::the archive has no Wayland platform plugin"
            exit 1
          fi

          # ---- Debian package ---------------------------------------------
          # The zip is a folder to unpack by hand; a system package is what puts
          # dae on PATH with a menu entry, a themed icon, and a dependency list
          # apt can act on. The payload is the same staged tree: installed under
          # /usr/lib/dae it keeps its `$ORIGIN/lib` rpaths and the qt.conf that
          # sits beside the executable.
          out="$PWD/dist/qt-release"
          pkg="$PWD/dist/qt-deb/dae_${version}_amd64"
          rm -rf "$PWD/dist/qt-deb"
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/lib/dae" \
                   "$pkg/usr/share/applications" \
                   "$pkg/usr/share/icons/hicolor/128x128/apps" \
                   "$pkg/usr/share/icons/hicolor/256x256/apps"
          cp -a "$staging/." "$pkg/usr/lib/dae/"
          # The portable entry files belong to the zip. An installed copy inside
          # /usr/lib would be a duplicate no desktop reads: the installed entry
          # is the one under /usr/share/applications.
          rm -f "$pkg/usr/lib/dae/dae.desktop" "$pkg/usr/lib/dae/dae.png"
          # A symlink is enough: Qt resolves /proc/self/exe, so it finds qt.conf
          # and the plugins next to the real binary, not next to the symlink.
          ln -s ../lib/dae/dae "$pkg/usr/bin/dae"
          install -m 0644 packaging/qt/dae-installed.desktop \
            "$pkg/usr/share/applications/dae.desktop"
          install -m 0644 src-tauri/icons/128x128.png \
            "$pkg/usr/share/icons/hicolor/128x128/apps/dae.png"
          install -m 0644 src-tauri/icons/128x128@2x.png \
            "$pkg/usr/share/icons/hicolor/256x256/apps/dae.png"

          # Runtime dependencies are derived, never hand-written: every shared
          # library that still resolves outside the tree (the bundled copies are
          # reached through the rpaths, so `ldd` reports them under $staging) is
          # mapped back to the package that provides it. A guessed Depends list
          # is how a package installs and then fails to start elsewhere.
          ldd_output=""
          while IFS= read -r -d '' file; do
            ldd_output+=$(ldd "$file" 2>/dev/null || true)$'\n'
          done < <(find "$staging" -type f \( -name dae -o -name '*.so*' \) -print0)
          depends=$(printf '%s\n' "$ldd_output" \
            | awk '/=> \//{print $3} /^\t\//{print $1}' \
            | sort -u \
            | grep -v "^$staging/" \
            | while read -r lib; do
                resolved=$(readlink -f "$lib" 2>/dev/null) && [ -n "$resolved" ] || continue
                # `dpkg -S` writes diversion bookkeeping on the same channel as
                # package names, and a path can belong to several packages
                # (`liba, libb: /path`). Keep only lines that end in a package
                # list followed by an absolute path, then keep the list.
                dpkg -S "$resolved" 2>/dev/null \
                  | grep -vE '^(local )?diversion by |^diverted by ' \
                  | grep -E ': /' \
                  | sed 's/: *\/.*$//'
              done \
            | tr ',' '\n' | tr -d ' ' | cut -d: -f1 | grep -v '^$' \
            | sort -u | paste -sd, - | sed 's/,/, /g')
          if [ -z "$depends" ]; then
            echo "::error::no runtime dependency could be derived from the payload; refusing to ship a .deb with an empty Depends"
            exit 1
          fi
          echo "deb Depends: $depends"

          installed_kb=$(du -sk "$pkg/usr" | cut -f1)
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: dae
          Version: $version
          Architecture: amd64
          Installed-Size: $installed_kb
          Depends: $depends
          Recommends: gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav
          Section: utils
          Priority: optional
          Maintainer: Melaine-iceberg <Melaine-iceberg@users.noreply.github.com>
          Homepage: https://github.com/Melaine-iceberg/dae
          Description: Aesthetic file manager
           dae browses local, network and cloud storage in one window, with
           tabs, split panes, previews, a terminal and a transfer queue.
           .
           Playing audio and video in the preview pane needs GStreamer: the
           runtime belongs to the Qt Multimedia backend, and the decoders come
           from the packages listed in Recommends. Without them the pane says
           which packages are missing instead of staying silent.
          EOF

          mkdir -p "$out"
          # dpkg-deb refuses a control directory that is group- or world-
          # writable; a runner with an unusual umask would otherwise fail here
          # after the whole payload has been copied.
          chmod 0755 "$pkg" "$pkg/DEBIAN"
          deb="$out/dae_${version}_amd64.deb"
          dpkg-deb --root-owner-group --build "$pkg" "$deb"
          dpkg-deb --info "$deb"
          # A .deb whose executable is not on PATH, or whose Qt platform plugin
          # is not in the installed tree, installs cleanly and then does nothing.
          contents=$(dpkg-deb --contents "$deb")
          for required in './usr/bin/dae -> ../lib/dae/dae' \
                          './usr/lib/dae/platforms/libqxcb.so' \
                          './usr/lib/dae/qml/QtQuick' \
                          './usr/share/applications/dae.desktop' \
                          './usr/share/icons/hicolor/128x128/apps/dae.png'; do
            # `printf | grep -q` is the obvious spelling and it is wrong here:
            # under `set -o pipefail`, grep exits on the first match, printf
            # takes SIGPIPE, the pipeline reports 141, and a file that IS in the
            # package is reported missing. A here-string hands the text over
            # with no pipe to break.
            if ! grep -qF "$required" <<< "$contents"; then
              echo "::error::$deb is missing $required"
              exit 1
            fi
          done
          echo "deb: $(stat -c '%s' "$deb") bytes"

          # ---- RPM package -------------------------------------------------
          # Same payload, same layout, different metadata. `Requires` are left
          # to rpm's own ELF generator, which asks for sonames
          # (`libxcb.so.1()(64bit)`) rather than Debian-style package names,
          # so one package follows the payload to Fedora, RHEL or openSUSE
          # without a second hand-written list. The bundled Qt libraries
          # provide the sonames their own binaries ask for, so the generator
          # does not request Qt from the distribution.
          rpm_top="$PWD/dist/qt-rpm"
          rm -rf "$rpm_top"
          mkdir -p "$rpm_top/SPECS"
          spec="$rpm_top/SPECS/dae.spec"
          cat > "$spec" <<EOF
          Name:           dae
          Version:        $version
          Release:        1
          Summary:        Aesthetic file manager
          License:        GPL-3.0-or-later
          URL:            https://github.com/Melaine-iceberg/dae
          BuildArch:      x86_64
          # Every file is prebuilt (cargo produced them, PGO and BOLT already
          # ran). The distribution's post-install hooks would strip the binary
          # and rebuild a debuginfo set from code that no longer has a
          # compile-time story, so they are switched off wholesale.
          %global debug_package %{nil}
          %global __os_install_post %{nil}

          # GStreamer is a weak dependency: preview playback needs it, nothing
          # else does, and a server install should not fail over it. The
          # package names differ by distribution, hence the branch.
          %if 0%{?suse_version}
          Recommends:     gstreamer-plugins-base
          Recommends:     gstreamer-plugins-good
          Recommends:     gstreamer-plugins-libav
          %else
          Recommends:     gstreamer1-plugins-base
          Recommends:     gstreamer1-plugins-good
          Recommends:     gstreamer1-plugin-libav
          %endif

          %description
          dae browses local, network and cloud storage in one window, with tabs,
          split panes, previews, a terminal and a transfer queue.

          Playing audio and video in the preview pane needs GStreamer: the runtime
          belongs to the Qt Multimedia backend and the decoders come from the
          packages this package recommends. Without them the pane names the
          missing packages instead of staying silent.

          %prep

          %build

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/usr/lib/dae %{buildroot}/usr/bin
          cp -a $staging/. %{buildroot}/usr/lib/dae/
          rm -f %{buildroot}/usr/lib/dae/dae.desktop %{buildroot}/usr/lib/dae/dae.png
          # A symlink is enough: Qt resolves /proc/self/exe, so qt.conf and the
          # plugins are found next to the real binary.
          ln -s ../lib/dae/dae %{buildroot}/usr/bin/dae
          install -D -m 0644 $PWD/packaging/qt/dae-installed.desktop \
            %{buildroot}/usr/share/applications/dae.desktop
          install -D -m 0644 $PWD/src-tauri/icons/128x128.png \
            %{buildroot}/usr/share/icons/hicolor/128x128/apps/dae.png
          install -D -m 0644 $PWD/src-tauri/icons/128x128@2x.png \
            %{buildroot}/usr/share/icons/hicolor/256x256/apps/dae.png

          %files
          /usr/bin/dae
          /usr/lib/dae
          /usr/share/applications/dae.desktop
          /usr/share/icons/hicolor/128x128/apps/dae.png
          /usr/share/icons/hicolor/256x256/apps/dae.png

          %changelog
          * $(LC_ALL=C date '+%a %b %d %Y') Melaine-iceberg <Melaine-iceberg@users.noreply.github.com> - $version-1
          - Release $version
          EOF

          rpmbuild --define "_topdir $rpm_top" -bb "$spec"
          rpmfile=$(ls "$rpm_top"/RPMS/x86_64/dae-"$version"-1.x86_64.rpm)
          cp "$rpmfile" "$out/"
          rpm -qip "$rpmfile"
          # The same three things the .deb checks: the executable is on PATH,
          # the Qt platform plugin travelled with it, and the desktop entry and
          # icon are installed where a desktop looks for them.
          rpmfiles=$(rpm -qlp "$rpmfile")
          for required in '/usr/bin/dae' '/usr/lib/dae/platforms/libqxcb.so' \
                          '/usr/lib/dae/qml/QtQuick' \
                          '/usr/share/applications/dae.desktop' \
                          '/usr/share/icons/hicolor/128x128/apps/dae.png'; do
            # Same pipe/SIGPIPE trap as the .deb loop above.
            if ! grep -qF "$required" <<< "$rpmfiles"; then
              echo "::error::$rpmfile is missing $required"
              exit 1
            fi
          done
          # A regular file here would put a second copy of the binary on PATH
          # that cannot find qt.conf; the .deb gets the same assertion through
          # `dpkg-deb --contents`.
          dump=$(rpm -qp --dump "$rpmfile")
          if ! grep -qE '^/usr/bin/dae .* \.\./lib/dae/dae$' <<< "$dump"; then
            grep '^/usr/bin/dae' <<< "$dump" || true
            echo "::error::$rpmfile does not install /usr/bin/dae as a symlink to ../lib/dae/dae"
            exit 1
          fi
          # Qt is bundled, so rpm's generator writes the Qt sonames into both
          # `Provides` and `Requires`; the package satisfies its own requires,
          # which is how a bundled runtime is supposed to look. What must never
          # happen is a Qt require that the package does not also provide — that
          # would make dnf look for a distribution Qt on the user's machine.
          provides=$(rpm -qp --provides "$rpmfile" | awk '{print $1}')
          unbundled=""
          for soname in $(rpm -qp --requires "$rpmfile" | awk '/^libQt6/{print $1}'); do
            if ! grep -qxF "$soname" <<< "$provides"; then
              unbundled="$unbundled $soname"
            fi
          done
          if [ -n "$unbundled" ]; then
            echo "::error::$rpmfile requires Qt sonames it does not ship:$unbundled"
            exit 1
          fi
          echo "bundled Qt sonames: $(rpm -qp --provides "$rpmfile" | awk '/^libQt6/{print $1}' | tr '\n' ' ')"
          echo "rpm: $(stat -c '%s' "$rpmfile") bytes"

      # ---- macOS: .app -> macdeployqt -> Developer ID -> notarize -> zip ----
      #
      # Gatekeeper refuses to open an ad-hoc signed app that carries the
      # quarantine bit with a "damaged" dialog rather than a prompt, so a tag
      # release without the Apple secrets is a failed release, not a warning.
      - name: Deploy Qt runtime and package (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          # base64-encoded Developer ID Application .p12 plus its password.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Full identity string, e.g.
          # `Developer ID Application: Your Name (TEAMID1234)`.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # notarytool credentials: the Apple ID triple, or nothing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY APPLE_ID \
                        APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret is not configured; refusing to publish a macOS build that is not Developer ID signed and notarized."
              exit 1
            fi
          done

          version=$(node -p "require('./package.json').version")
          staging="$PWD/dist/qt"
          app="$staging/dae.app"
          rm -rf "$staging"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/aarch64-apple-darwin/release/dae "$app/Contents/MacOS/dae"
          cp packaging/qt/Info.plist "$app/Contents/Info.plist"
          cp src-tauri/icons/icon.icns "$app/Contents/Resources/icon.icns"
          # macdeployqt signs with the first .entitlements file it finds in
          # Contents/Resources; that file is what grants the hardened runtime
          # its JIT and plugin-loading exceptions.
          cp packaging/qt/dae.entitlements "$app/Contents/Resources/dae.entitlements"
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          # A throwaway keychain: the runner's login keychain is not unlocked
          # for codesign, and `set-key-partition-list` is what lets codesign use
          # the imported key without a GUI prompt.
          keychain="$RUNNER_TEMP/dae-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dae.p12"
          security import "$RUNNER_TEMP/dae.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/dae.p12"

          # macdeployqt's own switch applies the hardened runtime, a secure
          # timestamp and this identity to every framework and plugin it copies.
          macdeployqt "$app" -qmldir="$PWD/qml" -always-overwrite \
            -sign-for-notarization="$APPLE_SIGNING_IDENTITY"
          test -d "$app/Contents/Frameworks"
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          test -d "$app/Contents/Resources/qml/QtQuick"
          test -d "$app/Contents/Resources/qml/QtMultimedia"
          test -d "$app/Contents/PlugIns/multimedia"

          # Signing the bundle again is not redundant: it applies the
          # entitlements to the main executable and seals the bundle's resource
          # envelope last, which is the order notarization checks.
          codesign --force --timestamp --options runtime \
            --entitlements packaging/qt/dae.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! codesign --display --entitlements :- "$app" 2>/dev/null \
              | grep -q 'com.apple.security.cs.allow-jit'; then
            echo "::error::the signed bundle is missing the allow-jit entitlement; QML's JIT will abort under the hardened runtime"
            exit 1
          fi

          # Notarization takes a zip; the ticket is stapled to the bundle
          # afterwards, so the archive below ships a notarized app.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/dae-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/dae-notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          # The same verdict Gatekeeper reaches on the user's Mac. A bundle
          # without a stapled ticket is reported as damaged there, not as
          # blocked, so this has to pass before anything is uploaded.
          spctl --assess --type execute --verbose=2 "$app"

          security delete-keychain "$keychain"

          out="$PWD/dist/qt-release"
          mkdir -p "$out"
          zip="$out/dae-$version-${{ matrix.platform_key }}.zip"
          rm -f "$zip"
          (cd "$staging" && COPYFILE_DISABLE=1 zip -r -y -X -q "$zip" dae.app)
          unzip -Z1 "$zip" | grep -qx 'dae.app/Contents/MacOS/dae'
          tops=$(unzip -Z1 "$zip" | awk -F/ '{print $1}' | sort -u | tr -d '\r')
          if [ "$tops" != "dae.app" ]; then
            echo "::error::the macOS archive must contain only dae.app, got: $tops"
            exit 1
          fi

      # Reuses the release minisign key. The public half is the
      # `UPDATE_PUBLIC_KEY` constant in dae-core/src/update/mod.rs, so a
      # signature produced here is exactly what the installed app verifies.
      # The signature exists to authenticate an update the installed app will
      # download, and a manual run publishes no feed for it to belong to. It is
      # also the one step that refuses to continue without
      # `TAURI_SIGNING_PRIVATE_KEY`, so skipping it on a smoke test is what
      # makes the run possible on a fork or a machine without the secret.
      - name: Install frontend dependencies for the Tauri signer
        if: github.event_name == 'push'
        run: bun install --frozen-lockfile

      - name: Sign the Qt update archive
        if: github.event_name == 'push'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="dist/qt-release/dae-$version-${{ matrix.platform_key }}.zip"
          test -s "$zip"

          # Tauri accepts either the key text or a path in this variable.
          # `signer sign` only accepts the text, so normalize a path secret.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            TAURI_SIGNING_PRIVATE_KEY="$(cat "$TAURI_SIGNING_PRIVATE_KEY")"
            export TAURI_SIGNING_PRIVATE_KEY
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured; refusing to publish an unsigned Qt update."
            exit 1
          fi

          bun tauri signer sign "$zip" --app-version "$version"
          test -s "$zip.sig"

      - name: Upload Qt update artifact
        uses: actions/upload-artifact@v7
        with:
          name: qt-${{ matrix.platform_key }}
          path: dist/qt-release/*
          if-no-files-found: error
          retention-days: 7

  # Merge the matrix results into the single feed the app fetches. This runs
  # after the Tauri matrix too, because tauri-action is what creates the draft
  # release these assets are appended to.
  qt-feed:
    name: Qt update feed
    needs: [build, qt]
    runs-on: ubuntu-26.04
    # Every step here writes to the release by tag; a manual run has no tag.
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download Qt artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: qt-*
          path: dist-qt
          merge-multiple: true

      - name: Generate latest-qt.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/qt-update-feed.mjs \
            --dir dist-qt \
            --version "$version" \
            --notes-file "docs/release-notes/v$version.md"
          cat dist-qt/latest-qt.json

      # Upload the archives first and the feed last: a feed at
      # `releases/latest/download/latest-qt.json` must never advertise a zip
      # that is not on the same release yet.
      - name: Attach Qt assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist-qt/*.zip --clobber
          # The .deb and .rpm are not part of the update feed — a system package
          # is replaced by the system installer, not by the app — but they
          # belong on the same release as everything else.
          if compgen -G 'dist-qt/*.deb' >/dev/null; then
            gh release upload "${GITHUB_REF_NAME}" dist-qt/*.deb --clobber
          else
            echo "::warning title=No .deb::the Linux leg produced no system package"
          fi
          if compgen -G 'dist-qt/*.rpm' >/dev/null; then
            gh release upload "${GITHUB_REF_NAME}" dist-qt/*.rpm --clobber
          else
            echo "::warning title=No .rpm::the Linux leg produced no RPM package"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist-qt/latest-qt.json --clobber
          gh release view "${GITHUB_REF_NAME}" --json isDraft,tagName,assets \
            --jq '"release " + .tagName + " draft=" + (.isDraft|tostring) + " assets=" + ([.assets[].name]|join(","))'
