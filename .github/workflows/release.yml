name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One empty draft per tag: the matrix jobs below attach their own installers
  # and updater metadata to it, and publishing the draft is the single manual
  # step that makes the release (and the update feed) live.
  create-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: dae ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --win
          - platform: ubuntu-26.04
            args: --linux
          # The macOS artifact targets Apple Silicon, matching current macOS
          # software support and the runner architecture.
          - platform: macos-latest
            args: --mac

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # `bun run build` shells out to `tsc`, and the version check below uses
      # `node -p`, so pin Node rather than trusting the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Pushed tag ${GITHUB_REF_NAME} but package.json declares v$version."
            echo "::error::Bump package.json (optionally the legacy Tauri manifests), then re-tag."
            exit 1
          fi

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake zlib1g-dev libssl-dev \
            libglib2.0-dev libgtk-3-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Windows leg only: the MSIX step below needs winapp on PATH.
      - name: Install winapp CLI
        if: matrix.platform == 'windows-latest'
        uses: microsoft/setup-WinAppCli@v0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # electronDist points electron-builder at node_modules/electron/dist; the
      # installer script is idempotent and makes a skipped postinstall visible
      # before the packaging step fails on a missing Electron tree.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build native addon
        run: node scripts/native-build.mjs

      - name: Build renderer
        run: bun run build

      # Notarization needs a signing identity and all three Apple credentials;
      # without them the dmg is built unsigned and only the first install is
      # possible (Squirrel.Mac cannot apply an update to an unsigned bundle).
      - name: Resolve notarization flags
        if: matrix.platform == 'macos-latest'
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] \
             && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "notarize=-c.mac.notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=" >> "$GITHUB_OUTPUT"
          fi

      # --publish never: the draft job above owns the release, and every asset
      # (including latest.yml / latest-mac.yml / latest-linux.yml) is attached
      # below. Empty signing secrets are unset so electron-builder skips
      # signing instead of treating an empty CSC_LINK as a certificate path.
      - name: Package installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
                      APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npx electron-builder ${{ matrix.args }} --publish never ${{ steps.signing.outputs.notarize }}

      # The MSIX is a separate package format with its own identity and signer.
      # The committed Package.appxmanifest + Assets/ describe it; the script
      # stages win-unpacked, copies the assets and calls winapp. Without a
      # certificate secret it falls back to a throwaway development cert.
      - name: Package MSIX
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          node scripts/sync-msix-version.mjs --release
          if ($env:MSIX_CERTIFICATE) {
            [IO.File]::WriteAllBytes("release.pfx", [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            $env:MSIX_CERT = "release.pfx"
            $env:MSIX_CERT_PASSWORD = $env:MSIX_CERTIFICATE_PASSWORD
          }
          node scripts/pack-msix.mjs

      - name: Attach Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml
            dist-electron/*.msix

      - name: Attach macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.zip.blockmap
            dist-electron/latest-mac.yml

      - name: Attach Linux artifacts
        if: matrix.platform == 'ubuntu-26.04'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-electron/*.AppImage
            dist-electron/*.AppImage.blockmap
            dist-electron/*.deb
            dist-electron/latest-linux.yml
