# Compiles the Linux-only code on every push to main.
#
# Why this exists: the `#[cfg(target_os = "linux")]` modules — the GTK tab drop
# target, GIO app/volume lookups, the D-Bus settings portal and the Wayland
# syncobj probe — are invisible to the Windows dev machine, and the release
# workflow only compiles them once a tag is pushed. A break in them is therefore
# silent until release day, the same failure mode macos-check.yml exists to
# prevent. It also gives Linux dependency bumps (gtk/gio/zbus) a place to be
# verified before adoption.
#
# `cargo check` is deliberate rather than a full `tauri build`: it needs no
# display server and links nothing, while still surfacing every type and borrow
# error in the Linux code. Bundling stays the release workflow's job.
#
# ubuntu-26.04 matches the Linux release leg, so both compile against the same
# WebKitGTK/GTK system libraries.
name: Linux check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev zlib1g-dev

      # The tauri build script reads the frontend manifest, and the bindings
      # binary is built against the same feature set the release uses.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Type-check the dae crate for Linux
        run: |
          cargo check \
            --manifest-path src-tauri/Cargo.toml \
            --features export-bindings \
            --all-targets
