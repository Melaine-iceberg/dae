name: Perf — PGO training

# Answers one question without tagging a release to find out: does the Linux
# training run leave a usable `.profdata` behind?
#
# The release legs run this same step with `continue-on-error`, because a
# release must not be blocked by its optimiser — but that also means a silently
# empty profile looks exactly like a successful release. This workflow is the
# place where it is allowed to be red: manual only, no release, artifacts kept.
#
# Linux only on purpose. Windows and macOS have produced a profile since the
# hook was added; Linux is the leg where the teardown does not finish under
# xvfb, so it is the one worth watching. This builds the shipped Qt shell
# (`--qt`), not the retiring Tauri binary.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Training run length in seconds"
        required: false
        default: "45"

permissions:
  contents: read

concurrency:
  group: perf-pgo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgo:
    runs-on: ubuntu-26.04
    # Qt shell: two fat-LTO links (instrumented + final) plus the QML AOT step.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-xcb-dev libxrender-dev libxext-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libgtk-3-dev libgdk-pixbuf-2.0-dev librsvg2-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libsecret-1-dev xvfb

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: qt-perf-6.12
          modules: qtmultimedia

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `llvm-profdata` has to be the one rustc ships, or it refuses the
          # profraw files that rustc wrote.
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: qt-perf-check
          cache-on-failure: true

      # Not `continue-on-error`: here a missing profile is the thing under test,
      # so it fails the job. The training log and whatever counters did reach
      # the disk are uploaded either way.
      - name: Instrument, train, merge (Qt shell)
        env:
          # Not `SECONDS`: that is a bash builtin, and shadowing it silently
          # resets the shell's own timer.
          TRAIN_SECONDS: ${{ inputs.seconds }}
        run: bun scripts/opt/pgo.mjs train --seconds "${TRAIN_SECONDS:-45}" --qt

      # Separates the two ways this can fail, which the training log alone cannot
      # tell apart: with the feature compiled in, a missing `flushed` line means
      # the exit never finished; without it, the flush is a no-op and the log
      # looks exactly the same.
      - name: Confirm perf-train reached the build
        if: always()
        run: |
          exe=target/release/dae
          if [ ! -f "$exe" ]; then
            echo "::error::no binary at $exe — the instrumented build did not finish"
            exit 1
          fi
          if grep -aq "profile counters flushed" "$exe"; then
            echo "perf-train is compiled in: the flush path is present"
          else
            echo "::error title=perf-train missing::--features perf-train did not reach cargo, so the flush is a no-op and the counters depend on an exit that never completes"
            exit 1
          fi

      - name: Show what the profile covers
        if: always()
        run: |
          log=.perf/training.log
          if [ -f "$log" ]; then
            echo "### training.log"
            echo '```'
            tail -40 "$log"
            echo '```'
          else
            echo "### training.log"
            echo "missing — the app never wrote anything to stderr"
          fi
          {
            echo "### counters"
            echo '```'
            find .perf/pgo -name '*.profraw' 2>/dev/null | wc -l | sed 's/^/profraw files: /'
            if [ -f .perf/pgo/dae.profdata ]; then
              ls -l .perf/pgo/dae.profdata
              # Same location `findLlvmTool` uses. Best effort: the summary must
              # not be the thing that fails, the step above already decided.
              llvm_profdata="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
              [ -x "$llvm_profdata" ] && "$llvm_profdata" show .perf/pgo/dae.profdata \
                | grep -E '^(Total functions|Total count):' || true
            else
              echo "no merged profile"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pgo-profile
          path: |
            .perf/training.log
            .perf/pgo/
          if-no-files-found: warn
          retention-days: 7
