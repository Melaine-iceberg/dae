[package]
name = "qt-window-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gates 3 and 4 of docs/decisions/engine-qt-quick.md §5: frameless QQuickWindow with Mica, and tear-off cost"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
dae-core = { path = "../../crates/dae-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[build-dependencies]
cxx-qt-build = "0.10"

[workspace]
