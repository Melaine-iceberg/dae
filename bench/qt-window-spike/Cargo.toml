[package]
name = "qt-window-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gate 3 of docs/decisions/engine-qt-quick.md §5: frameless QQuickWindow with Mica and a custom title bar"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }

[build-dependencies]
cxx-qt-build = "0.10"

[workspace]
