[package]
name = "qt-list-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gate 1 of docs/decisions/engine-qt-quick.md §5: 120k-row QML ListView from real dae-core listing batches"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
dae-core = { path = "../../crates/dae-core" }
# The real icon provider is part of the workload: the gate has to be measured
# with the rows the product actually draws, not a coloured square.
dae-qt = { path = "../../crates/dae-qt" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[build-dependencies]
cxx-qt-build = "0.10"

[workspace]
