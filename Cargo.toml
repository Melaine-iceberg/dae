[workspace]
resolver = "3"
members = ["apps/dae", "crates/dae-core", "crates/dae-qt"]

# The Qt Quick shell is the only frontend. The Tauri package that used to be
# excluded here was deleted on 2026-11-01, together with the React tree it
# served; see docs/decisions/engine-qt-quick.md §9.13.

# The release profile every shipped binary is built with. `panic = "abort"` is
# load-bearing rather than a size trick: the panic logger's last act is to write
# the message, and unwinding would turn every panic into a recoverable error the
# shell's error handling was never written for. `codegen-units = 1` and fat LTO
# are what the size and startup numbers in docs/ were measured on.
#
# `strip = true` is why the PGO/BOLT build cannot reuse this profile as-is: BOLT
# needs the symbol table and the relocations emitted with `-Wl,--emit-relocs`.
# Those builds override the field from the environment
# (`CARGO_PROFILE_RELEASE_STRIP=false`, set by scripts/opt/pgo.mjs). See
# docs/pgo-bolt.md.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
