[workspace]
resolver = "3"
members = ["apps/dae", "crates/dae-core", "crates/dae-qt"]

# `src-tauri` is still the shipped Tauri shell. It keeps its own target dir and
# `.cargo/config.toml` (the Windows 8 MB stack flag) until the Qt shell
# replaces it; see docs/decisions/engine-qt-quick.md §4.
exclude = ["src-tauri"]

# Mirrors the `[profile.release]` in `src-tauri/Cargo.toml` field for field.
# The Tauri package is excluded from this workspace, so its profile does not
# reach `apps/dae` — without this block the Qt shell would build with unwinding
# (OOM and every panic becomes a recoverable unwind instead of the abort the
# panic logger assumes), 16 codegen units and no LTO, which is a different
# binary from the one the size and startup numbers were measured on.
#
# Keep the two in sync until `src-tauri` retires.
#
# `strip = true` is why the PGO/BOLT build cannot reuse this profile as-is: BOLT
# needs the symbol table and the relocations emitted with `-Wl,--emit-relocs`.
# Those builds override the field from the environment
# (`CARGO_PROFILE_RELEASE_STRIP=false`, set by scripts/opt/pgo.mjs). See
# docs/pgo-bolt.md.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
