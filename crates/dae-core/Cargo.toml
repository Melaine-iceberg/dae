[package]
name = "dae-core"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Engine-agnostic core of dae: the data contract, the file system services and the seam both shells link"
publish = false

# Nothing in this crate may name an engine. If a dependency here forces a
# renderer, a window system or an IPC format on the two shells, it belongs in a
# shell crate instead. `specta` is the one deliberate exception: it is a plain
# introspection derive, not a UI framework, and the Tauri shell still generates
# its TypeScript bindings from these types while both shells coexist.
[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
async-trait = "0.1"
base64 = "0.23.1"
dirs = "7"
dunce = "1.0.5"
flate2 = "1"
git2 = "0.21.0"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
# The icon backends: macOS re-encodes AppKit's TIFF as PNG, Windows encodes the
# shell's DIB. Thumbnail decoding stays in the shells' renderers.
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
keyring = "4.1.6"
log = "0.4"
md-5 = "0.11.0"
minisign-verify = "0.3"
notify = "8.2.0"
portable-pty = "0.9"
rand = "0.10.2"
rayon = "1.12.0"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "form",
  "query",
  "stream",
] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.24.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
smb2 = "0.34.0"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
tar = "0.4"
tempfile = "3"
thiserror = "2.0.20"
toml = "0.8"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "net",
  "io-util",
  "sync",
  "fs",
] }
trash = "5"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The icon theme's SVG answers are rasterized out of process-free gdk-pixbuf
# (no display, no main-thread hop). The windowing toolkit itself stays out of
# this crate.
gdk-pixbuf = "0.18"
gio = "0.18"
# The theme lookup names mimetype icons; the Linux module is also compiled
# under `cfg(test)` on other hosts so its rules can be tested there.
mime_guess = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
trash-core = { version = "0.3", default-features = false, features = ["macos"] }
# `file_icons::macos` reads the Finder's icon: `iconForFile:` hands back an
# `NSImage`, whose representations are downcast to `NSBitmapImageRep` for a
# lossless TIFF that the `image` crate re-encodes as PNG.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSEnumerator",
  "NSString",
  "NSData",
] }

[dev-dependencies]
# The in-memory mock credential store for the cloud account tests, keeping them
# away from the real OS keychain.
keyring-core = "1"
# `icons::linux` is type-checked and tested on every host.
mime_guess = "2"
