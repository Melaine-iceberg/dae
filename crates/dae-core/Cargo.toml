[package]
name = "dae-core"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Engine-agnostic core of dae: the data contract, the file system services and the seam both shells link"
publish = false

# Nothing in this crate may name an engine. If a dependency here forces a
# renderer, a window system or an IPC format, it belongs in a shell crate
# instead. `specta` used to be the one exception — an introspection derive that
# fed the retired Tauri shell's TypeScript bindings — and it went with that
# shell on 2026-11-01 (`docs/decisions/engine-qt-quick.md` §9.13).
[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
# `fs::preview` classifies a file by its bytes and decodes the legacy encodings
# (GBK, Shift-JIS, CP1252) a `.txt` or a source file can arrive in.
chardetng = "1"
dirs = "7"
dunce = "1.0.5"
encoding_rs = "0.8"
flate2 = "1"
git2 = "0.21.0"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
# The icon backends: macOS re-encodes AppKit's TIFF as PNG, Windows encodes the
# shell's DIB. Thumbnail decoding stays in the shells' renderers.
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
# `fs::media_meta`: image EXIF for the preview pane's metadata block.
kamadak-exif = "0.6"
keyring = "4.1.6"
log = "0.4"
md-5 = "0.11.0"
# `fs::discovery` browses `_smb._tcp` / `_sftp-ssh._tcp` / `_webdav._tcp` for
# the sidebar's network section; results fill host and port only.
mdns-sd = "0.21"
minisign-verify = "0.3"
notify = "8.2.0"
portable-pty = "0.9"
# `fs::shell_commands::windows` reads the packaged verbs out of each Appx
# manifest's XML.
quick-xml = "0.42"
rand = "0.10.2"
rayon = "1.12.0"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "form",
  "query",
  "stream",
  # `fs::webdav` streams an upload through `blocking::Body::new(reader)`;
  # the async body can only wrap a `futures_core::Stream`, which no enabled
  # dependency provides.
  "blocking",
] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.24.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
smb2 = "0.34.0"
# `fs::ftp`: FTP and FTPS. `rustls-ring` matches the provider the rest of the
# crate installs; `deprecated` is the only way suppaftp 12 exposes implicit
# FTPS (`connect_secure_implicit`), which port 990 needs.
suppaftp = { version = "12", default-features = false, features = ["rustls-ring", "deprecated"] }
# The FTPS trust anchors: the OS store, the same one reqwest uses.
rustls-native-certs = "0.8"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
tar = "0.4"
tempfile = "3"
thiserror = "2.0.20"
toml = "0.8"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "net",
  "io-util",
  "sync",
  "fs",
] }
trash = "5"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  # `package::is_packaged` asks the app model whether this process belongs to an
  # MSIX package, which decides whether the portable updater may run at all.
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  # `fs::security` reads an Authenticode signature (`WinTrust`) and a
  # discretionary ACL (`Win32_Security_Authorization`), naming SIDs and
  # certificates through `Win32_Security_Cryptography`.
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  # `fs::search_index` queries the Windows Search catalog through the
  # `Search.CollatorDSO` OLE DB provider.
  "Win32_System_Search",
  "Win32_System_Variant",
  # `fs::drives` ejects a volume through `DeviceIoControl` and hands the
  # format dialog to `SHFormatDrive`; neither is a shell string round trip.
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Ole",
  # `fs::shell_commands::windows` activates the packaged `IExplorerCommand`
  # servers behind Windows 11's right-click menu: it builds `IShellItemArray`s
  # from ID lists (`Win32_UI_Shell_Common`), reads the Appx manifests under
  # `HKEY_LOCAL_MACHINE` (`Win32_System_Registry`) and pumps the STA message
  # queue while it waits on a provider (`Win32_System_Threading`).
  "Win32_System_Registry",
  # `fs::occupancy` asks the Restart Manager which processes hold a file, the
  # same list the "file is in use" dialog shows.
  "Win32_System_RestartManager",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The icon theme's SVG answers are rasterized out of process-free gdk-pixbuf
# (no display, no main-thread hop). The windowing toolkit itself stays out of
# this crate.
gdk-pixbuf = "0.18"
gio = "0.18"
# The theme lookup names mimetype icons; the Linux module is also compiled
# under `cfg(test)` on other hosts so its rules can be tested there.
mime_guess = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
trash-core = { version = "0.3", default-features = false, features = ["macos"] }
# `file_icons::macos` reads the Finder's icon: `iconForFile:` hands back an
# `NSImage`, whose representations are downcast to `NSBitmapImageRep` for a
# lossless TIFF that the `image` crate re-encodes as PNG.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  # `fs::shell_commands::macos` hands a selection to an app's service through
  # an `NSPasteboard` of file URLs; `NSApplication` is the feature that gates
  # `NSPerformService` itself.
  "NSPasteboard",
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSEnumerator",
  "NSLocale",
  "NSString",
  "NSURL",
  "NSData",
] }
# The macOS service matcher asks `UTType` which services apply to a file.
objc2-uniform-type-identifiers = "0.3"

[dev-dependencies]
# The in-memory mock credential store for the cloud account tests, keeping them
# away from the real OS keychain.
keyring-core = "1"
# `icons::linux` is type-checked and tested on every host.
mime_guess = "2"
