[package]
name = "dae-qt"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Qt Quick shell bridge for dae: directory model, native window state (Win32, with portable fallbacks) and the IME focus guard"
publish = false
# `dae-app`'s build script reads the QML module this crate's build script
# exports (`plugin.qmltypes`). Cargo only orders a package's build script after
# its *build-dependencies*, not after its normal dependencies, so without this
# the two scripts can run in either order — and on a cold `target/` the shell's
# script wins the race and panics with "did dae-qt build?". `links` is the
# documented way to get that ordering: `dae-app` lists this crate under
# `[build-dependencies]`, and cargo then runs this script first.
links = "dae_qt_qml"

# This crate is the only place allowed to know Qt. Domain code stays in
# `dae-core`; a `QObject`, `QQuickWindow` or `cxx_qt::` import must not appear
# there. See docs/decisions/engine-qt-quick.md §4.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
dae-core = { path = "../dae-core" }
# The sink for `dae-core`'s own `log` calls. Same crate version, so one logger
# installed here covers the domain layer too — see `src/logging.rs`. `std` is
# explicit because feature unification across the workspace leaves it off, and
# `set_boxed_logger` is gated behind it.
log = { version = "0.4", features = ["std"] }
# The per-directory layout document is TOML; its tables are derived, the same
# way dae-core derives its own documents.
serde = { version = "1", features = ["derive"] }
# The tag definitions reach QML as one JSON array; QML already parses JSON for
# the palette, so a second model type would be a second representation.
serde_json = "1"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }
toml = "0.8"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

# The freedesktop settings portal is the only accent source that is correct on
# every Linux desktop. The blocking API keeps the poll thread free of a second
# async runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The share handler hands `DataPackage` a custom `IIterable<IStorageItem>`;
# those interfaces live in the collection crate the `windows` facade builds on.
windows-collections = "0.3"
# `#[windows::core::implement]` expands to items that name the `windows_core`
# crate directly, so it has to be a dependency of this crate, not only of the
# `windows` facade.
windows-core = "0.62"
# `StorageFile::GetFileFromPathAsync` returns a `windows_future` operation;
# its blocking `join` is the only wait this build needs.
windows-future = "0.3"

[build-dependencies]
cc = "1"
cxx-qt-build = "0.10"
