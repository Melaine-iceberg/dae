[package]
name = "dae-qt"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Qt Quick shell bridge for dae: directory model, HWND-keyed window state and the IME focus guard"
publish = false

# This crate is the only place allowed to know Qt. Domain code stays in
# `dae-core`; a `QObject`, `QQuickWindow` or `cxx_qt::` import must not appear
# there. See docs/decisions/engine-qt-quick.md §4.
[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
dae-core = { path = "../dae-core" }
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }
toml = "0.8"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cxx-qt-build = "0.10"
