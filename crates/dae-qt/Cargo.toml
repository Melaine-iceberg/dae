[package]
name = "dae-qt"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Qt Quick shell bridge for dae: directory model, native window state (Win32, with portable fallbacks) and the IME focus guard"
publish = false
# `dae-app`'s build script reads the QML module this crate's build script
# exports (`plugin.qmltypes`). Cargo only orders a package's build script after
# its *build-dependencies*, not after its normal dependencies, so without this
# the two scripts can run in either order — and on a cold `target/` the shell's
# script wins the race and panics with "did dae-qt build?". `links` is the
# documented way to get that ordering: `dae-app` lists this crate under
# `[build-dependencies]`, and cargo then runs this script first.
links = "dae_qt_qml"

# This crate is the only place allowed to know Qt. Domain code stays in
# `dae-core`; a `QObject`, `QQuickWindow` or `cxx_qt::` import must not appear
# there. See docs/decisions/engine-qt-quick.md §4.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
# The migration target. Types move here one module at a time; the QML module
# name is kept by a manual `QmlElement` impl per type (see `src/startup.rs`),
# so no `.qml` file changes while both bridges are live.
qtbridge = "0.4.1"
dae-core = { path = "../dae-core" }
# The sink for `dae-core`'s own `log` calls. Same crate version, so one logger
# installed here covers the domain layer too — see `src/logging.rs`. `std` is
# explicit because feature unification across the workspace leaves it off, and
# `set_boxed_logger` is gated behind it.
log = { version = "0.4", features = ["std"] }
# The per-directory layout document is TOML; its tables are derived, the same
# way dae-core derives its own documents.
serde = { version = "1", features = ["derive"] }
# The tag definitions reach QML as one JSON array; QML already parses JSON for
# the palette, so a second model type would be a second representation.
serde_json = "1"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# Code preview highlighting is tree-sitter: one parser + highlight-query engine
# (see src/preview_highlight.rs) and a grammar per language. The grammars built
# on `tree-sitter-language` share the single runtime `tree-sitter` links; eight
# (Dockerfile, Gitignore, Groovy, JSON5, Kotlin, LaTeX, Less, SCSS) are vendored
# as C under assets/grammars and compiled by build.rs against that same runtime.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.3"
tree-sitter-fsharp = "0.3"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.3"
tree-sitter-html = "0.23"
tree-sitter-ini = "1"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-make = "1"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3"
tree-sitter-php = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-proto = "0.6"
tree-sitter-python = "0.25"
tree-sitter-qmljs = "0.3"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }
toml = "0.8"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

# The freedesktop settings portal is the only accent source that is correct on
# every Linux desktop. The blocking API keeps the poll thread free of a second
# async runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# The share handler hands `DataPackage` a custom `IIterable<IStorageItem>`;
# those interfaces live in the collection crate the `windows` facade builds on.
windows-collections = "0.3"
# `#[windows::core::implement]` expands to items that name the `windows_core`
# crate directly, so it has to be a dependency of this crate, not only of the
# `windows` facade.
windows-core = "0.62"
# `StorageFile::GetFileFromPathAsync` returns a `windows_future` operation;
# its blocking `join` is the only wait this build needs.
windows-future = "0.3"

[build-dependencies]
cc = "1"
cxx-qt-build = "0.10"

[dev-dependencies]
# The tag bridge tests build a store over a throwaway config directory.
tempfile = "3"
