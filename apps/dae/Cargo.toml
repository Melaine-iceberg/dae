[package]
name = "dae-app"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The Qt Quick shell binary for dae"
publish = false

[[bin]]
name = "dae"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
dae-qt = { path = "../../crates/dae-qt" }

[build-dependencies]
cxx-qt-build = "0.10"
qt-build-utils = "0.10"
