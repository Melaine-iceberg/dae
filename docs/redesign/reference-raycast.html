<!doctype html>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>dae · 文件管理器</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* ─────────────────────────────────────────────────────────────────────────
 * design-systems/raycast/tokens.css — pasted verbatim, do not redefine.
 * ─────────────────────────────────────────────────────────────────── */
:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #07080a;              /* near-black blue tint — the void */
  --surface:      #101111;              /* Surface 100 — elevated cards */
  --surface-warm: var(--surface);       /* no warm tier in cold dark system */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:    #f9f9f9;                     /* near-white primary text */
  --fg-2:  #cecece;                     /* light gray secondary body */
  --muted: #9c9c9d;                     /* medium gray tertiary / nav links */
  --meta:  #6a6b6c;                     /* dim gray placeholders / metadata */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      rgba(255, 255, 255, 0.06);   /* card containment — barely visible */
  --border-soft: rgba(255, 255, 255, 0.04);   /* inner row separator */

  /* ─── Accent ───────────────────────────────────────────────────── */
  --accent:        #FF6363;             /* Raycast Red — hero stripes, error states */
  --accent-on:     #ffffff;
  --accent-hover:  #ff7777;             /* lighter tone for hover */
  --accent-active: #e85757;             /* darker tone for pressed */

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: hsl(151, 59%, 59%);        /* Raycast Green */
  --warn:    hsl(43, 100%, 60%);        /* Raycast Yellow */
  --danger:  hsl(0, 100%, 69%);         /* Error Red (≈ #FF6363) */

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Inter", "Inter Fallback", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter", "Inter Fallback", "SF Pro Text", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "GeistMono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale — DESIGN.md §3 Typography Hierarchy.
   * Display Hero (64px) → text-4xl; Section Display (≈40–56px) → text-3xl;
   * Section Heading (24px) → text-2xl; Sub-heading (20px) → text-xl;
   * Body Large (18px) → text-lg; Body (16px) → text-base;
   * Caption (14px) → text-sm; Small (12px) → text-xs. */
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   20px;
  --text-2xl:  24px;
  --text-3xl:  40px;
  --text-4xl:  64px;

  /* Leading + tracking.
   * --leading-body 1.6: DESIGN.md "Body 16/500/1.60" — relaxed dark rhythm.
   * --leading-tight 1.1: hero hugs its baseline.
   * --tracking-display 0px: hero is zero-tracked; body inline adds +0.2px
   * (the signature Raycast move noted in DESIGN.md §3 Principles). */
  --leading-body:     1.6;
  --leading-tight:    1.1;
  --tracking-display: 0px;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — DESIGN.md §5 "80–120px vertical between sections".
   * The dramatic negative space is the cinematic pacing of the system. */
  --section-y-desktop: 96px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  /* 6px is the workhorse (buttons, badges); 12px standard cards;
   * 16px large feature containers; pill (9999px) for primary CTAs
   * — DESIGN.md uses 86px+ which is functionally pill at all sizes. */
  --radius-sm:   6px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* macOS-native shadow philosophy: outer rings replace borders, inset
   * highlights simulate light from above, inset darks simulate shadow
   * underneath. --elev-ring is the signature double-ring: outer card-
   * surface tone + inset deep-bg tone, creating physical containment. */
  --elev-flat:   none;
  --elev-ring:   rgb(27, 28, 30) 0px 0px 0px 1px, rgb(7, 8, 10) 0px 0px 0px 1px inset;
  --elev-raised:
    rgba(255, 255, 255, 0.05) 0px 1px 0px 0px inset,
    rgba(0, 0, 0, 0.28) 0px 1.189px 2.377px,
    0 0 0 1px rgba(255, 255, 255, 0.06);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Raycast Blue, not accent red — DESIGN.md §2 reserves red for hero
   * stripes / danger and blue for interactive / focus / links. Keeping
   * focus blue protects the scarcity of the red. */
  --focus-ring: 0 0 0 3px hsla(202, 100%, 67%, 0.35);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* ─── structure: derived only, never new colours ───────────────────── */
.app{
  --h-strip: 44px;
  --h-tool: 54px;
  --h-status: 26px;
  --w-rail: 232px;
  --w-insp: 300px;
  --row-h: 34px;
  --cols: minmax(0,1fr) 92px 104px 134px 60px;

  --ink-hover: color-mix(in oklab, var(--fg) 6%, transparent);
  --ink-press: color-mix(in oklab, var(--fg) 9%, transparent);
  --sel:       color-mix(in oklab, hsl(202 100% 67%) 15%, transparent);
  --sel-edge:  color-mix(in oklab, hsl(202 100% 67%) 45%, transparent);
  --blue:      hsl(202 100% 67%);
  --key: linear-gradient(180deg,
    color-mix(in oklab, var(--surface) 88%, var(--fg)),
    color-mix(in oklab, var(--bg) 82%, var(--surface)));
}
*, *::before, *::after{ box-sizing: border-box; }
html, body{ height:100%; }
html{ color-scheme: dark; }
body{
  margin:0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  letter-spacing: 0.2px;
  line-height: 1.45;
  font-feature-settings: "calt" 1, "kern" 1, "liga" 1, "ss03" 1;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button{ font:inherit; letter-spacing:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input{ font:inherit; letter-spacing:inherit; color:inherit; }
svg{ display:block; }
:focus-visible{ outline: 2px solid var(--blue); outline-offset: 1px; border-radius: var(--radius-sm); }
.pathfield input:focus-visible{ outline: none; }
.num{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing:0.1px; }
.kbd{
  display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 4px;
  font-family: var(--font-mono); font-size:11px; font-weight:500; color: var(--fg-2);
  background: var(--key); border-radius: 4px;
  box-shadow: rgba(255,255,255,0.09) 0 1px 0 0 inset, rgba(0,0,0,0.5) 0 1px 1.5px,
              0 0 0 1px rgba(255,255,255,0.07);
}

/* ─── shell ────────────────────────────────────────────────────────── */
.app{ display:grid; grid-template-rows: var(--h-strip) minmax(0,1fr); height:100vh; height:100dvh; }

.strip{
  display:flex; align-items:center; gap: var(--space-3);
  padding: 0 var(--space-3) 0 var(--space-4);
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  -webkit-app-region: drag;
}
.strip button{ -webkit-app-region: no-drag; }
.mark{ display:flex; align-items:center; gap:9px; padding-right: var(--space-3); }
.stripes{ display:flex; align-items:flex-end; gap:3px; height:15px; }
.stripes i{ display:block; width:3px; height:15px; background: var(--accent); border-radius:1px; transform: skewX(-13deg); }
.wordmark{ font-size: 13px; font-weight:600; letter-spacing:0.04em; color: var(--fg-2); }

.tabs{ display:flex; align-items:center; gap:4px; min-width:0; overflow:hidden; flex:1 1 auto; }
.tab{
  display:flex; align-items:center; gap:7px; height:30px; padding:0 8px 0 10px;
  min-width:0; max-width:230px; border-radius: var(--radius-sm);
  color: var(--muted); transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.tab .tl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size: 13px; }
.tab:hover{ background: var(--ink-hover); color: var(--fg-2); }
.tab.is-active{
  background: var(--surface); color: var(--fg);
  box-shadow: inset 0 1px 0 0 color-mix(in oklab, var(--fg) 8%, transparent), 0 0 0 1px color-mix(in oklab, var(--fg) 8%, transparent);
}
.tab .tx{ opacity:0; width:18px; height:18px; display:grid; place-items:center; border-radius:4px; flex:none; color: var(--muted); }
.tab:hover .tx, .tab.is-active .tx{ opacity:1; }
.tab .tx:hover{ background: var(--ink-press); color: var(--fg); }
.icon-btn{
  width:32px; height:32px; display:grid; place-items:center; border-radius: var(--radius-sm);
  color: var(--muted); flex:none;
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover{ background: var(--ink-hover); color: var(--fg); }
.icon-btn[aria-pressed="true"]{ background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
.strip-actions{ display:flex; align-items:center; gap:6px; flex:none; }
.pal-trigger{
  display:flex; align-items:center; gap:8px; height:28px; padding:0 6px 0 10px;
  border-radius: var(--radius-pill); border:1px solid var(--border);
  color: var(--muted); font-size:12px;
  transition: border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.pal-trigger:hover{ border-color: rgba(255,255,255,0.16); color: var(--fg-2); }
.pal-trigger .keys{ display:flex; gap:3px; }

/* ─── body grid ───────────────────────────────────────────────────── */
.body{ display:grid; grid-template-columns: var(--w-rail) minmax(0,1fr) var(--w-insp); min-height:0; }
.body.no-insp{ grid-template-columns: var(--w-rail) minmax(0,1fr) 0; }
.body.no-insp .insp{ display:none; }
.body.no-rail{ grid-template-columns: 0 minmax(0,1fr) var(--w-insp); }
.body.no-rail.no-insp{ grid-template-columns: 0 minmax(0,1fr) 0; }
.body.no-rail .rail{ display:none; }

/* ─── rail ─────────────────────────────────────────────────────────── */
.rail{ min-width:0; overflow-y:auto; overflow-x:hidden; padding: var(--space-3) var(--space-2) var(--space-6); }
.rail-sec{ margin-bottom: var(--space-2); }
.rail-cap{
  display:flex; align-items:center; gap:6px; width:100%; height:26px; padding:0 8px;
  font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted);
}
.rail-cap:hover{ color: var(--muted); }
.rail-cap .cv{ transition: transform var(--motion-base) var(--ease-standard); }
.rail-sec.is-closed .rail-cap .cv{ transform: rotate(-90deg); }
.rail-sec.is-closed .rail-body{ display:none; }
.rail-row{
  display:flex; align-items:center; gap:9px; width:100%; height:30px; padding:0 8px;
  border-radius: var(--radius-sm); color: var(--fg-2); font-size:13px; text-align:left;
  transition: background var(--motion-fast) var(--ease-standard);
}
.rail-row .ic{ color: var(--muted); flex:none; }
.rail-row .rl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-row .rb{ flex:none; font-family:var(--font-mono); font-size:11px; color: var(--meta); }
.rail-row:hover{ background: var(--ink-hover); }
.rail-row:hover .ic{ color: var(--fg-2); }
.rail-row.is-on{ background: var(--surface); color: var(--fg); box-shadow: inset 0 1px 0 0 color-mix(in oklab, var(--fg) 7%, transparent), 0 0 0 1px color-mix(in oklab, var(--fg) 7%, transparent); }
.rail-row.is-on .ic{ color: var(--fg); }
.rail-row .dot{ width:6px; height:6px; border-radius:999px; background: var(--success); flex:none; }
.cap{
  height:3px; border-radius:999px; margin:4px 8px 8px; background: color-mix(in oklab, var(--fg) 10%, transparent);
  overflow:hidden;
}
.cap > i{ display:block; height:100%; border-radius:999px; background: color-mix(in oklab, var(--fg) 42%, transparent); }
.rail-note{ padding:2px 8px 0; font-family:var(--font-mono); font-size:10.5px; color: var(--meta); }

/* ─── main column ──────────────────────────────────────────────────── */
.main{ display:grid; grid-template-rows: var(--h-tool) minmax(0,1fr) auto var(--h-status); min-width:0; min-height:0; }

.tool{ display:flex; align-items:center; gap:var(--space-2); padding: 0 var(--space-3); border-bottom:1px solid var(--border-soft); }
.nav-cluster{ display:flex; gap:2px; flex:none; }
.pathfield{
  display:flex; align-items:center; gap:2px; min-width:0; flex:1 1 auto; height:32px; padding:0 4px 0 10px; overflow:hidden;
  border-radius: var(--radius-sm); background: color-mix(in oklab, var(--bg) 62%, var(--surface));
  box-shadow: inset 0 0 0 1px var(--border);
  transition: box-shadow var(--motion-fast) var(--ease-standard);
}
.pathfield:hover{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
.pathfield:focus-within{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), var(--focus-ring); }
.crumb{
  display:flex; align-items:center; height:24px; padding:0 6px; border-radius:4px; flex:0 1 auto; min-width:0;
  color: var(--muted); font-size:12.5px; max-width:190px;
}
.crumb span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.crumb:hover{ background: var(--ink-hover); color: var(--fg); }
.crumb.is-last{ color: var(--fg); flex:none; }
.sep{ color: var(--meta); flex:none; }
.pathfield input{
  flex:1 1 auto; min-width:0; height:28px; background:none; border:0; outline:none;
  font-family: var(--font-mono); font-size:12.5px; color: var(--fg); padding:0 6px;
}
.pathfield .ghost{ flex:1 1 auto; min-width:24px; height:100%; cursor:text; }
.tool-right{ display:flex; align-items:center; gap:6px; flex:none; }
.seg{ display:flex; align-items:center; padding:2px; gap:2px; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--bg) 60%, var(--surface)); box-shadow: inset 0 0 0 1px var(--border); }
.seg button{ width:26px; height:24px; display:grid; place-items:center; border-radius:4px; color: var(--muted); }
.seg button:hover{ color: var(--fg); background: var(--ink-hover); }
.seg button[aria-pressed="true"]{ background: color-mix(in oklab, var(--fg) 12%, transparent); color: var(--fg); }
.git-chip{
  display:flex; align-items:center; gap:6px; height:26px; padding:0 9px; border-radius: var(--radius-pill);
  background: color-mix(in oklab, var(--success) 12%, transparent); color: var(--success);
  font-family: var(--font-mono); font-size:11.5px; flex:none;
}
.git-chip .bar{ color: color-mix(in oklab, var(--success) 60%, transparent); }
.searchmini{ display:flex; align-items:center; gap:6px; height:30px; padding:0 8px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border); background: color-mix(in oklab, var(--bg) 62%, var(--surface)); color: var(--muted); }
.searchmini input{ width:120px; background:none; border:0; outline:none; font-size:12.5px; color:var(--fg); }
.searchmini input::placeholder{ color: var(--meta); }

/* ─── stage / listing ──────────────────────────────────────────────── */
.stage{ overflow:auto; min-height:0; position:relative; }
.stage::-webkit-scrollbar, .rail::-webkit-scrollbar, .insp::-webkit-scrollbar{ width:10px; height:10px; }
.stage::-webkit-scrollbar-thumb, .rail::-webkit-scrollbar-thumb, .insp::-webkit-scrollbar-thumb{
  background: color-mix(in oklab, var(--fg) 12%, transparent); border:3px solid transparent; background-clip:content-box; border-radius:8px;
}
.stage::-webkit-scrollbar-thumb:hover{ background: color-mix(in oklab, var(--fg) 22%, transparent); background-clip:content-box; }

.lhead{
  position:sticky; top:0; z-index:3; display:grid; grid-template-columns: var(--cols); align-items:center;
  height:30px; padding:0 var(--space-3); gap: var(--space-3);
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--border);
  font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color: var(--muted);
}
.lhead button{ display:flex; align-items:center; gap:4px; height:100%; color:inherit; text-align:left; }
.lhead button:hover{ color: var(--fg-2); }
.lhead .r{ justify-content:flex-end; justify-self:end; }
.lhead .cv{ opacity:0; }
.lhead button[data-dir] .cv{ opacity:1; color: var(--fg-2); }
.lhead button[data-dir="desc"] .cv{ transform: rotate(180deg); }

.list{ padding: 4px var(--space-2) var(--space-8); }
.row{
  display:grid; grid-template-columns: var(--cols); align-items:center; gap: var(--space-3);
  height: var(--row-h); padding:0 var(--space-2); border-radius: var(--radius-sm);
  color: var(--fg-2); cursor: default; user-select:none;
  transition: background var(--motion-fast) var(--ease-standard);
}
.list.dense .row{ --row-h: 28px; }
.row + .row{ box-shadow: inset 0 -1px 0 0 var(--border-soft); }
.row:hover{ background: var(--ink-hover); }
.row.is-sel{ background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge); color: var(--fg); }
.row.is-focus{ box-shadow: inset 0 0 0 1px color-mix(in oklab, hsl(202 100% 67%) 60%, transparent); }
.row.is-sel.is-focus{ box-shadow: inset 0 0 0 1px var(--blue); }
.c-name{ display:flex; align-items:center; gap:10px; min-width:0; }
.c-name .glyph{ flex:none; color: var(--muted); display:grid; place-items:center; }
.row.is-sel .glyph{ color: var(--fg); }
.c-name .nm{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.row.is-hidden .nm{ opacity:0.55; }
.c-size, .c-mod{ justify-self:end; font-family:var(--font-mono); font-size:11.5px; color: var(--muted); }
.c-kind{ color: var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.is-sel .c-kind, .row.is-sel .c-size, .row.is-sel .c-mod{ color: var(--fg-2); }
.c-git{ justify-self:start; display:flex; gap:4px; }
.badge{
  display:inline-grid; place-items:center; min-width:18px; height:17px; padding:0 4px;
  border-radius:4px; font-family:var(--font-mono); font-size:10.5px; font-weight:500;
  background: color-mix(in oklab, var(--fg) 8%, transparent); color: var(--muted);
}
.badge.m{ background: color-mix(in oklab, var(--warn) 16%, transparent); color: var(--warn); }
.badge.a{ background: color-mix(in oklab, var(--success) 16%, transparent); color: var(--success); }
.badge.u{ background: color-mix(in oklab, var(--fg) 8%, transparent); color: var(--muted); }
.badge.ro{ background: color-mix(in oklab, var(--fg) 7%, transparent); color: var(--muted); }
mark{ background: color-mix(in oklab, var(--warn) 26%, transparent); color: var(--fg); border-radius:2px; padding:0 1px; }
.rename-input{
  width:100%; height:24px; padding:0 6px; border-radius:4px; border:0;
  background: color-mix(in oklab, var(--bg) 70%, var(--surface));
  box-shadow: var(--focus-ring), inset 0 0 0 1px rgba(255,255,255,0.2);
  font-size:13px; outline:none;
}

.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: var(--space-3); padding: var(--space-4) var(--space-3) var(--space-8); }
.card{
  display:flex; flex-direction:column; gap:10px; padding:14px 12px; border-radius: var(--radius-md);
  background: color-mix(in oklab, var(--bg) 55%, var(--surface));
  box-shadow: inset 0 0 0 1px var(--border);
  text-align:left; min-width:0;
  transition: background var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.card:hover{ background: color-mix(in oklab, var(--bg) 30%, var(--surface)); }
.card.is-sel{ background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge); }
.card .thumb{ height:56px; display:grid; place-items:center; color: var(--muted); border-radius: var(--radius-sm); background: color-mix(in oklab, var(--fg) 4%, transparent); }
.card.is-sel .thumb{ color: var(--fg); }
.card .cn{ font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .cm{ font-family:var(--font-mono); font-size:10.5px; color: var(--muted); }

.skel{ padding: var(--space-3); display:grid; gap:6px; }
.skel i{ display:block; height:26px; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--fg) 4%, transparent); }
.empty{ display:grid; place-items:center; padding: 64px var(--space-6); text-align:center; }
.empty .plate{ width:52px; height:52px; display:grid; place-items:center; border-radius: var(--radius-md); background: color-mix(in oklab, var(--fg) 5%, transparent); color: var(--muted); margin-bottom: var(--space-4); }
.empty h2{ margin:0 0 6px; font-size:15px; font-weight:600; letter-spacing:0; }
.empty p{ margin:0 0 var(--space-4); color: var(--muted); font-size:12.5px; max-width:34ch; line-height:1.6; }

/* ─── terminal drawer ──────────────────────────────────────────────── */
.term{ display:none; border-top:1px solid var(--border); background: color-mix(in oklab, var(--bg) 70%, var(--surface)); }
.term.on{ display:grid; grid-template-rows: 30px minmax(0,1fr); height: 188px; }
.term-head{ display:flex; align-items:center; gap:var(--space-2); padding:0 var(--space-3); border-bottom:1px solid var(--border-soft); }
.term-tab{ display:flex; align-items:center; gap:7px; height:22px; padding:0 8px; border-radius:4px; font-size:12px; background: color-mix(in oklab, var(--fg) 7%, transparent); color: var(--fg-2); }
.term-body{ overflow:auto; padding: 10px var(--space-4); font-family: var(--font-mono); font-size:12px; line-height:1.75; color: var(--fg-2); }
.term-body .p{ white-space:pre-wrap; }
.term-body .pp{ color: var(--blue); }
.term-body .pb{ color: var(--success); }
.term-body .pd{ color: var(--meta); }
.term-body .pf{ color: var(--warn); }
.caret{ display:inline-block; width:7px; height:13px; translate:0 2px; background: var(--fg-2); animation: blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }

/* ─── status bar ───────────────────────────────────────────────────── */
.status{ display:flex; align-items:center; gap:var(--space-3); padding:0 var(--space-3); border-top:1px solid var(--border-soft); font-size:11px; color: var(--muted); }
.status .num{ font-size:11px; }
.status .grow{ flex:1; }
.status .sep-v{ width:1px; height:12px; background: var(--border); flex:none; }
.disk-mini{ display:flex; align-items:center; gap:7px; }
.disk-mini .cap{ width:64px; margin:0; }
.status .link{ color: var(--muted); text-decoration:none; }
.status .link:hover{ color: var(--fg); text-decoration:underline; text-underline-offset:2px; }
.mode-pill{ display:inline-flex; align-items:center; gap:6px; height:19px; padding:0 7px; border-radius:999px; background: color-mix(in oklab, var(--fg) 6%, transparent); color: var(--muted); font-size:10.5px; }
.mode-pill:hover{ color: var(--fg-2); background: color-mix(in oklab, var(--fg) 10%, transparent); }
.mode-pill .dot{ width:6px; height:6px; border-radius:999px; background: var(--meta); }
.mode-pill.live .dot{ background: var(--success); }
.mode-pill.live{ color: var(--success); background: color-mix(in oklab, var(--success) 12%, transparent); }

/* ─── inspector ────────────────────────────────────────────────────── */
.insp{ min-width:0; overflow-y:auto; border-left:1px solid var(--border); padding: var(--space-4) var(--space-4) var(--space-8); background: color-mix(in oklab, var(--bg) 72%, var(--surface)); }
.insp-cap{ font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color: var(--meta); margin: 0 0 var(--space-3); }
.pv-head{ display:flex; align-items:flex-start; gap:10px; margin-bottom: var(--space-3); }
.pv-head .glyph{ flex:none; color: var(--fg-2); margin-top:2px; }
.pv-name{ font-size:14px; font-weight:600; letter-spacing:0; word-break:break-all; line-height:1.4; }
.pv-sub{ font-family:var(--font-mono); font-size:10.5px; color: var(--muted); margin-top:3px; }
.pv-body{
  border-radius: var(--radius-md); background: var(--bg); box-shadow: inset 0 0 0 1px var(--border);
  overflow:hidden; margin-bottom: var(--space-5);
}
.pv-code{ margin:0; padding:10px 12px; max-height:220px; overflow:auto; font-family: var(--font-mono); font-size:11px; line-height:1.7; color: var(--fg-2); white-space:pre; }
.pv-code .ln{ color: var(--meta); user-select:none; display:inline-block; width:20px; }
.pv-note{ padding:22px 14px; text-align:center; color: var(--meta); font-size:11.5px; line-height:1.6; }
.meta-list{ display:grid; gap:0; margin:0 0 var(--space-5); }
.meta-row{ display:grid; grid-template-columns: 74px minmax(0,1fr); gap:var(--space-3); padding:7px 0; border-bottom:1px solid var(--border-soft); font-size:11.5px; }
.meta-row dt{ color: var(--muted); }
.meta-row dd{ margin:0; color: var(--fg-2); word-break:break-all; }
.tagrow{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: var(--space-5); }
.tag{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--fg) 6%, transparent); color: var(--fg-2); font-size:11px; }
.tag .sw{ width:6px; height:6px; border-radius:999px; background: var(--muted); }
.tag.add{ color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); background:none; }
.tag.add:hover{ color: var(--fg); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16); }
.insp-actions{ display:grid; gap:6px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:32px; padding:0 13px; border-radius: var(--radius-sm); font-size:12.5px; font-weight:500; transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard); }
.btn-ghost{ color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--border); }
.btn-ghost:hover{ color: var(--fg); background: var(--ink-hover); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
.btn-primary{ background: color-mix(in oklab, var(--fg) 90%, transparent); color: color-mix(in oklab, var(--bg) 94%, var(--fg)); border-radius: var(--radius-pill); padding:0 16px; font-weight:600; }
.btn-primary:hover{ background: var(--fg); }
.btn-primary:active{ background: color-mix(in oklab, var(--fg) 76%, transparent); }
.btn-danger{ color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--danger) 35%, transparent); background: color-mix(in oklab, var(--danger) 10%, transparent); }
.btn-danger:hover{ color: color-mix(in oklab, var(--danger) 85%, white); background: color-mix(in oklab, var(--danger) 18%, transparent); }

/* ─── action island ────────────────────────────────────────────────── */
.island{
  position:fixed; left:50%; bottom: 44px; translate:-50% 0;
  display:none; align-items:center; gap:4px; padding:6px;
  border-radius: var(--radius-pill);
  background: color-mix(in oklab, var(--bg) 62%, transparent);
  backdrop-filter: blur(18px) saturate(140%);
  box-shadow: rgba(255,255,255,0.08) 0 1px 0 0 inset, rgba(0,0,0,0.5) 0 8px 28px,

}
.island.on{ display:flex; }
.island .cnt{ padding:0 10px 0 12px; font-size:12px; color: var(--fg-2); white-space:nowrap; }
.island .ib{ display:flex; align-items:center; gap:6px; height:30px; padding:0 11px; border-radius: var(--radius-pill); color: var(--fg-2); font-size:12px; }
.island .ib:hover{ background: var(--ink-press); color: var(--fg); }
.island .ib.danger:hover{ color: var(--danger); background: color-mix(in oklab, var(--danger) 14%, transparent); }
.island .dv{ width:1px; height:18px; background: var(--border); margin:0 2px; }

/* ─── command palette ──────────────────────────────────────────────── */
.palette{ position:fixed; inset:0; display:none; justify-items:center; align-items:start; z-index: 60; }
.palette.on{ display:grid; }
.palette .scrim{ position:absolute; inset:0; background: color-mix(in oklab, var(--bg) 66%, transparent); backdrop-filter: blur(3px); }
.pal{

              0 0 0 1px rgba(255,255,255,0.09);
  overflow:hidden;
}
.pal-head{ display:flex; align-items:center; gap:10px; padding: 14px 16px; border-bottom:1px solid var(--border); color: var(--muted); }
.pal-head input{ flex:1; background:none; border:0; outline:none; font-size: var(--text-lg); font-weight:500; letter-spacing:0; color: var(--fg); }
.pal-head input::placeholder{ color: var(--meta); }
.pal-list{ max-height: min(52vh, 420px); overflow:auto; padding:6px; }
.pal-cap{ padding:8px 10px 4px; font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted); }
.pal-item{ display:flex; align-items:center; gap:11px; width:100%; height:38px; padding:0 10px; border-radius: var(--radius-sm); color: var(--fg-2); text-align:left; }
.pal-item .ic{ color: var(--muted); flex:none; }
.pal-item .pl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.pal-item .pr{ font-family:var(--font-mono); font-size:10.5px; color: var(--meta); flex:none; }
.pal-item[aria-selected="true"]{ background: color-mix(in oklab, var(--fg) 8%, transparent); color: var(--fg); box-shadow: inset 2px 0 0 0 var(--blue); }

.pal-item:hover{ background: var(--ink-hover); }
.pal-foot{ display:flex; align-items:center; gap:14px; padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color: var(--muted); }

/* ─── context menu ─────────────────────────────────────────────────── */
.ctx{
  position:fixed; z-index:70; display:none; min-width:220px; padding:5px;
  border-radius: var(--radius-md); background: color-mix(in oklab, var(--surface) 94%, var(--bg));

              0 0 0 1px rgba(255,255,255,0.08);
}
.ctx.on{ display:block; }
.ctx button{ display:flex; align-items:center; gap:10px; width:100%; height:30px; padding:0 9px; border-radius: var(--radius-sm); color: var(--fg-2); font-size:12.5px; text-align:left; }
.ctx button .ic{ color: var(--muted); }
.ctx button .cl{ flex:1; }
.ctx button .ck{ font-family:var(--font-mono); font-size:10.5px; color: var(--meta); }
.ctx button:hover{ background: var(--ink-press); color: var(--fg); }
.ctx button.is-danger:hover{ background: color-mix(in oklab, var(--danger) 16%, transparent); color: var(--danger); }
.ctx hr{ border:0; border-top:1px solid var(--border); margin:5px 6px; }

/* ─── modal ────────────────────────────────────────────────────────── */
.modal{ position:fixed; inset:0; z-index:80; display:none; place-items:center; }
.modal.on{ display:grid; }
.modal .scrim{ position:absolute; inset:0; background: color-mix(in oklab, var(--bg) 70%, transparent); backdrop-filter: blur(3px); }
.sheet{
  position:relative; width:min(440px, calc(100vw - 32px)); padding: var(--space-5);
  border-radius: var(--radius-lg); background: color-mix(in oklab, var(--surface) 94%, var(--bg));
  box-shadow: rgba(255,255,255,0.09) 0 1px 0 0 inset, rgba(0,0,0,0.5) 0 24px 60px -12px,
              0 0 0 1px rgba(255,255,255,0.09);
}
.sheet h2{ margin:0 0 6px; font-size: var(--text-lg); font-weight:600; letter-spacing:-0.01em; }
.sheet .sub{ margin:0 0 var(--space-4); color: var(--muted); font-size:12.5px; line-height:1.6; }
.sheet .rows{ display:grid; gap:0; margin: 0 0 var(--space-4); }
.sheet .row-line{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; }
.sheet .row-line span:first-child{ color: var(--muted); }
.sheet input[type="text"]{ width:100%; height:32px; padding:0 10px; border-radius: var(--radius-sm); background: var(--bg); border:0; box-shadow: inset 0 0 0 1px var(--border); font-size:13px; outline:none; }
.sheet input[type="text"]:focus{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), var(--focus-ring); }
.sheet .foot{ display:flex; justify-content:flex-end; gap:8px; margin-top: var(--space-4); }
.switch{ position:relative; width:34px; height:20px; border-radius:999px; background: color-mix(in oklab, var(--fg) 14%, transparent); box-shadow: inset 0 0 0 1px var(--border); flex:none; }
.switch[aria-checked="true"]{ background: color-mix(in oklab, var(--success) 60%, transparent); }
.switch i{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px; background: var(--fg); transition: translate var(--motion-fast) var(--ease-standard); }
.switch[aria-checked="true"] i{ translate: 14px 0; background: var(--bg); }

/* ─── toasts ───────────────────────────────────────────────────────── */
.toasts{ position:fixed; right:18px; bottom:46px; z-index:90; display:grid; gap:8px; justify-items:end; }
.toast{
  display:flex; align-items:center; gap:12px; max-width:380px; padding:10px 12px 10px 14px;
  border-radius: var(--radius-md); background: color-mix(in oklab, var(--surface) 94%, var(--bg));

}
@keyframes rise{ from{ opacity:0; translate:0 6px; } }
.toast button{ color: var(--blue); font-weight:500; }

/* ─── responsive ───────────────────────────────────────────────────── */
@media (max-width: 1180px){

  .icon-btn{ width:40px; height:40px; }
  .rail-row{ height:40px; }
  .pal{ margin-top:6vh; }
  .island{ left:12px; right:12px; translate:0 0; justify-content:space-between; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

    if (/^[A-Za-z]:$/.test(cleaned)) return cleaned.toUpperCase();
    const parts = cleaned.split('\\');
    return parts[parts.length - 1] || 'dae';
  }
  function crumbsOf(p) {
    if (p === VIRTUAL_RECENTS) return [{ name: 'dae', path: '' }, { name: '最近使用', path: p }];
    if (p === VIRTUAL_TRASH) return [{ name: 'dae', path: '' }, { name: '回收站', path: p }];
    const parts = String(p).replace(/\//g, '\\').split('\\').filter(Boolean);
    const out = []; let acc = '';
    parts.forEach((part, i) => {
      acc = i === 0 ? part + '\\' : acc.replace(/\\$/, '') + '\\' + part;
      out.push({ name: part, path: acc });
    });
    return out;
  }
  const joinPath = (dir, name) => (/\\$/.test(dir) ? dir : dir + '\\') + name;

  /* ── data access ─────────────────────────────────────────────────── */
  async function load(path, opts) {
    const t = tab();
    const seq = ++t.tick;
    t.loading = true;
    renderStage();
    let data = null;
    if (state.mode === 'live') {
      try {
        if (path === VIRTUAL_RECENTS) {
          const recents = await invoke('list_recents');
          data = {
            crumbs: crumbsOf(path),
            entries: (recents || []).map((r) => ({ name: r.name, path: r.path, kind: r.kind, size: null, modifiedAt: r.accessedAt, hidden: false, readOnly: false })),
            git: null
          };
        } else {
          const view = await invoke('read_directory', { path: path, streamId: t.id + '-' + seq, watcherId: null });
          data = {
            crumbs: view.breadcrumbs && view.breadcrumbs.length ? view.breadcrumbs : crumbsOf(view.path || path),
            entries: (view.entries || []).map((e) => ({ name: e.name, path: e.path, kind: e.kind, size: e.size, modifiedAt: e.modifiedAt, hidden: !!e.hidden, readOnly: !!e.readOnly })),
            git: null
          };
          try {
            const g = await invoke('get_git_status', { path: path });
            if (g && g.entries) {
              const map = {};
              g.entries.forEach((e) => { map[e.name] = e.kind === 'added' ? 'a' : e.kind === 'untracked' ? 'u' : 'm'; });
              data.git = { branch: g.branch, ahead: 0, behind: 0, map: map };
            }
          } catch (e) { /* not a repository */ }
        }
      } catch (e) {
        state.mode = 'demo';
        toast('后端连接中断，已切回演示数据');
        data = demoRead(path);
      }
    } else {
      data = demoRead(path);
    }
    if (seq !== t.tick) return;
    t.loading = false;
    t.entries = data.entries;
    t.crumbs = data.crumbs;
    t.git = data.git;
    t.sel = new Set(); t.anchor = null; t.focus = -1;
    if (opts && opts.push) {
      t.history = t.history.slice(0, t.hIndex + 1).concat([path]);
      t.hIndex = t.history.length - 1;
    }
    t.path = path; t.title = baseName(path); t.query = '';
    renderAll();
    save();
  }
  function demoRead(path) {
    if (path === VIRTUAL_RECENTS) {
      const seen = [];
      ['K:\\code\\dae', 'K:\\code\\dae\\docs', 'K:\\code\\dae\\src', HOME + '\\文档', HOME + '\\下载'].forEach((dir) => {
        (DEMO[norm(dir)] || []).forEach((e) => {
          if (e.kind === 'file') seen.push({ name: e.name, path: joinPath(dir, e.name), kind: 'file', size: e.size, modifiedAt: e.modifiedAt, hidden: false, readOnly: false });
        });
      });
      seen.sort((a, b) => (b.modifiedAt || 0) - (a.modifiedAt || 0));
      return { crumbs: crumbsOf(path), entries: seen.slice(0, 14), git: null };
    }
    if (path === VIRTUAL_TRASH) {
      const items = DEMO[norm('C:\\$Recycle.Bin')].map((e) => Object.assign({}, e, { path: joinPath('C:\\$Recycle.Bin', e.name), trashed: true }));
      return { crumbs: crumbsOf(path), entries: items, git: null };
    }
    const key = norm(path);
    const list = DEMO[key];
    const entries = (list || []).map((e) => Object.assign({}, e, { path: joinPath(path, e.name) }));
    return { crumbs: crumbsOf(path), entries: entries, git: GIT[key] || null };
  }

  /* ── sorting ─────────────────────────────────────────────────────── */
  function visibleEntries() {
    const t = tab();
    let list = (t.entries || []).filter((e) => state.showHidden || !e.hidden);
    const q = (t.query || '').trim().toLowerCase();
    if (q) list = list.filter((e) => e.name.toLowerCase().includes(q));
    const k = t.sort.key, dir = t.sort.dir;
    list = list.slice().sort((a, b) => {
      const ad = a.kind === 'directory', bd = b.kind === 'directory';
      if (ad !== bd) return ad ? -1 : 1;
      let r = 0;
      if (k === 'name') r = a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true });
      else if (k === 'size') r = (a.size || 0) - (b.size || 0);
      else if (k === 'mod') r = (a.modifiedAt || 0) - (b.modifiedAt || 0);
      else if (k === 'kind') r = kindOf(a).localeCompare(kindOf(b), 'zh-Hans-CN');
      if (r === 0) r = a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true });
      return r * dir;
    });
    return list;
  }
  const hl = (name) => {
    const q = (tab().query || '').trim();
    if (!q) return esc(name);
    const i = name.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
  };
  const gitOf = (e) => { const g = tab().git; return g && g.map ? g.map[e.name] : null; };
  const selectedEntry = () => { const t = tab(); if (t.sel.size !== 1) return null; return (t.entries || []).find((e) => t.sel.has(e.path)) || null; };

  /* ── render: chrome ──────────────────────────────────────────────── */

        ic(t.path === VIRTUAL_TRASH ? 'trash' : t.path === VIRTUAL_RECENTS ? 'clock' : 'folder', 13) +
        '<span class="tl">' + esc(t.title) + '</span>' +
        '<span class="tx" data-close-tab="' + i + '" role="button" aria-label="关闭标签">' + ic('x', 11) + '</span>' +
      '</button>').join('') +
      '<button class="icon-btn" id="newTab" title="新建标签 (Ctrl+T)" aria-label="新建标签">' + ic('plus', 15) + '</button>';
  }

  function renderRail() {
    const rail = $('#rail');
    const t = tab();
    const places = state.mode === 'live' && state.places ? state.places : DEMO_PLACES;

    const disks = state.mode === 'live' && state.disks ? state.disks : DEMO_DISKS;
    const conns = state.mode === 'live' && state.connections ? state.connections : DEMO_CONNECTIONS;
    const sec = (id, label, body, extra) => {
      const closed = !!state.closedRail[id];
      return '<div class="rail-sec' + (closed ? ' is-closed' : '') + '">' +
        '<button class="rail-cap" data-sec="' + id + '" aria-expanded="' + !closed + '">' + ic('chevD', 11, 'cv') + '<span>' + label + '</span>' + (extra || '') + '</button>' +
        '<div class="rail-body">' + body + '</div></div>';
    };
    const row = (p, icon, label, opt) => {
      const o = opt || {};
      const on = norm(t.path) === norm(p) ? ' is-on' : '';
      return '<button class="rail-row' + on + '" data-nav="' + esc(p) + '" title="' + esc(p) + '">' +
        (o.dot ? '<span class="dot"></span>' : ic(icon, 15, 'ic')) +
        '<span class="rl">' + label + '</span>' +
        (o.badge ? '<span class="rb">' + esc(o.badge) + '</span>' : '') + '</button>';
    };
    let html = '';
    html += row(HOME, 'home', '主目录');
    html += row(VIRTUAL_RECENTS, 'clock', '最近使用');
    html += sec('favorites', '收藏', favs.map((f) => row(f.path, 'star', esc(f.name))).join('') || '<div class="rail-note">暂无收藏</div>');
    html += sec('places', '位置', places.map((p) => row(p.path, PLACE_ICON[p.kind] || 'folder', (PLACE_LABEL[p.kind] || p.kind))).join(''));
    html += sec('disks', '磁盘与卷',
      disks.map((d) => {
        const used = d.totalBytes ? 1 - d.availableBytes / d.totalBytes : 0;
        return row(d.mountPoint, 'disk', esc(d.name), { badge: String(d.mountPoint).replace(/\\$/, '') }) +
          '<div class="cap" role="img" aria-label="已用 ' + Math.round(used * 100) + '%"><i style="width:' + Math.round(used * 100) + '%"></i></div>';
      }).join(''));
    html += sec('spaces', '空间', spaces.map((s) => row(s.items && s.items[0] ? s.items[0].path : HOME, 'tag', esc(s.name))).join('') || '<div class="rail-note">暂无空间</div>');
    html += sec('network', '网络',
      conns.map((c) => row('net://' + c.id, c.protocol === 'smb' ? 'server' : 'cloud', esc(c.protocol.toUpperCase() + ' · ' + c.host), { dot: false })).join('') +
      row('cloud://onedrive', 'cloud', 'OneDrive'));
    html += '<div class="rail-sec"><div class="rail-body">' + row(VIRTUAL_TRASH, 'trash', '回收站') + '</div></div>';
    rail.innerHTML = html;
  }

  function renderToolbar() {

          '<span class="thumb">' + ic(glyphOf(e), e.kind === 'directory' ? 30 : 24) + '</span>' +

          '<span class="c-name"><span class="glyph">' + ic(glyphOf(e), 16) + '</span>' +

  /* ── selection ───────────────────────────────────────────────────── */
  function toggleAt(idx, additive, range) {
    const t = tab();
    const list = t.viewList || [];
    const e = list[idx];
    if (!e) return;
    if (range && t.anchor != null && list[t.anchor]) {
      const [a, b] = [Math.min(t.anchor, idx), Math.max(t.anchor, idx)];
      t.sel = new Set(list.slice(a, b + 1).map((x) => x.path));
    } else if (additive) {
      if (t.sel.has(e.path)) t.sel.delete(e.path); else t.sel.add(e.path);
      t.anchor = idx;
    } else {
      t.sel = new Set([e.path]); t.anchor = idx;
    }
    t.focus = idx;
    renderStage(); renderInspector(); renderStatus(); renderIsland();
  }

  function openEntry(e) {
    if (!e) return;

    toast('已交给系统默认应用打开 · ' + item.name);

    ];
    const cmds = [
      { label: '新建文件夹', run: () => createEntry('directory'), kbd: 'Ctrl+Shift+N', icon: 'folderplus' },

      { label: '在终端中打开当前位置', run: () => { state.showTerminal = true; renderTerminal(); }, kbd: 'Ctrl+`', icon: 'wsl' },
      { label: '切换信息面板', run: () => { state.showInspector = !state.showInspector; syncPanels(); }, icon: 'info' },
      { label: '偏好设置', run: () => openSettings(), kbd: 'Ctrl+,', icon: 'settings' },
      { label: '连接 dae 后端', run: () => openConnect(), icon: 'plug' }
    ];
    let out = [];
    const nav = navTargets.filter((n) => !q || n.label.toLowerCase().includes(q) || n.path.toLowerCase().includes(q));
    const cmd = cmds.filter((c) => !q || c.label.toLowerCase().includes(q));
    if (mode === 'path' || q) {
      const files = (t.entries || []).filter((e) => !q || e.name.toLowerCase().includes(q)).slice(0, 8);
      if (files.length) out.push({ cap: '此文件夹', items: files.map((e) => ({ label: e.name, icon: glyphOf(e), meta: e.kind === 'directory' ? '文件夹' : fmtSize(e.size), run: () => openEntry(e) })) });

    if (cmd.length) out.push({ cap: '命令', items: cmd.map((c) => ({ label: c.label, icon: c.icon, meta: c.kbd || '', run: c.run })) });
    return out;
  }

  function renderPalette() {

    if (pal.index >= flat.length) pal.index = Math.max(0, flat.length - 1);
    let n = 0;
    $('#palList').innerHTML = groups.map((g) =>
      '<div class="pal-cap">' + g.cap + '</div>' + g.items.map((it) => {
        const i = n++;
        return '<button class="pal-item" role="option" aria-selected="' + (i === pal.index) + '" data-pal="' + i + '">' + ic(it.icon, 15) +
          '<span class="pl">' + esc(it.label) + '</span><span class="pr">' + esc(it.meta || '') + '</span></button>';
      }).join('')).join('') || '<div class="pal-cap">没有匹配结果</div>';
  }

  /* ── actions ─────────────────────────────────────────────────────── */
  function scratchPath(dir, name) { return joinPath(dir, name); }
  function createEntry(kind) {
    const t = tab();
    const base = kind === 'directory' ? '新建文件夹' : '新建文件.txt';
    let name = base, i = 2;
    const dirKey = norm(t.path);
    const list = DEMO[dirKey];
    if (!list) { toast('此位置为只读或来自后端，无法在演示模式中写入'); return; }
    const has = (n) => t.entries.some((e) => e.name.toLowerCase() === n.toLowerCase());
    while (has(name)) { name = kind === 'directory' ? '新建文件夹 ' + i : '新建文件 ' + i + '.txt'; i++; }
    const item = kind === 'directory' ? D(name, '2026-02-12 12:00') : F(name, 0, '2026-02-12 12:00');
    list.unshift(item);
    item.path = scratchPath(t.path, name);
    load(t.path);
    setTimeout(() => { t.rename = { path: item.path }; renderStage(); }, 0);
  }
  function commitRename(value) {
    const t = tab();
    const r = t.rename;
    t.rename = null;
    if (!r) return;
    const next = String(value || '').trim();
    const entry = t.entries.find((e) => e.path === r.path);
    if (!next || !entry || next === entry.name) { renderStage(); return; }
    const dirKey = norm(t.path);
    const list = DEMO[dirKey];
    if (list) {
      const item = list.find((x) => x.name === entry.name);
      if (item) item.name = next;
    }
    toast('已重命名为 ' + next, null, null);
    load(t.path);
  }
  function trashSelection() {
    const t = tab();
    const picked = t.entries.filter((e) => t.sel.has(e.path));
    if (!picked.length) return;
    confirmDialog({
      title: '删除 ' + picked.length + ' 项？',
      sub: '这些项目会进入回收站，随时可以还原。',
      confirm: '移到回收站',
      danger: true,
      onConfirm: () => {
        const dirKey = norm(t.path);
        const list = DEMO[dirKey];
        let backup = null;
        if (list) {
          backup = list.slice();
          const names = new Set(picked.map((p) => p.name));
          DEMO[dirKey] = list.filter((x) => !names.has(x.name));
        }
        t.sel = new Set();
        load(t.path);
        toast('已删除 ' + picked.length + ' 项', '撤销', () => { if (list && backup) { DEMO[dirKey] = backup; } load(t.path); });
      }
    });
  }
  function dialog(html) {

  function closeDialog() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
  function confirmDialog(o) {

      '<div class="foot"><button class="btn btn-ghost" data-close="modal">取消</button>' +

  function openSettings() {

      '<div class="row-line"><span>显示隐藏项目</span><button class="switch" role="switch" aria-checked="' + state.showHidden + '" data-toggle="hidden"><i></i></button></div>' +
      '<div class="row-line"><span>紧凑行高</span><button class="switch" role="switch" aria-checked="' + state.dense + '" data-toggle="dense"><i></i></button></div>' +
      '<div class="row-line"><span>信息面板</span><button class="switch" role="switch" aria-checked="' + state.showInspector + '" data-toggle="insp"><i></i></button></div>' +
      '<div class="row-line"><span>后端地址</span><span class="num" style="color:var(--meta)">' + esc(state.base) + '</span></div>' +

  function openConnect() {
    dialog('<h2>连接 dae 后端</h2><p class="sub">启动 <code style="font-family:var(--font-mono)">bun run tauri dev</code> 后，dev-invoke 会在本机提供 IPC 桥接。填入地址即可读取真实目录。</p>' +
      '<input type="text" id="bridgeUrl" value="' + esc(state.base) + '" spellcheck="false" aria-label="后端地址" />' +
      '<div class="foot"><button class="btn btn-ghost" data-close="modal">取消</button><button class="btn btn-primary" id="bridgeGo">连接</button></div>');
    $('#bridgeGo').addEventListener('click', async () => {
      const url = ($('#bridgeUrl').value || '').trim();
      try {
        const home = await tryConnect(url);
        closeDialog();
        await load(home || HOME);
        toast('已连接后端 · ' + (state.meta && state.meta.os ? state.meta.os : url));
      } catch (e) {
        toast('无法连接 ' + url + ' · 请确认后端已启动且桥接在监听');
      }
    });
  }
  function toast(text, actionLabel, onAction) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span>' + esc(text) + '</span>' + (actionLabel ? '<button class="ta">' + esc(actionLabel) + '</button>' : '');
    box.appendChild(el);
    if (actionLabel && onAction) el.querySelector('.ta').addEventListener('click', () => { onAction(); el.remove(); });
    setTimeout(() => el.remove(), 4200);
  }
  function syncPanels() {
    $('#body').classList.toggle('no-insp', !state.showInspector);
    $('#body').classList.toggle('no-rail', !state.showRail);
    $('#inspBtn').setAttribute('aria-pressed', String(state.showInspector));
    $('#railBtn').setAttribute('aria-pressed', String(state.showRail));
    renderInspector();
  }
  function save() {
    try {
      localStorage.setItem(UI_KEY, JSON.stringify({
        active: state.active,
        tabs: state.tabs.map((t) => ({ path: t.path, view: t.view, sort: t.sort })),
        showInspector: state.showInspector, showTerminal: state.showTerminal, showRail: state.showRail,
        showHidden: state.showHidden, dense: state.dense, closedRail: state.closedRail
      }));
    } catch (e) { /* storage full or blocked */ }
  }
  function restore() {
    try {
      const raw = localStorage.getItem(UI_KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      state.showInspector = s.showInspector !== false;
      state.showTerminal = !!s.showTerminal;
      state.showRail = s.showRail !== false;
      state.showHidden = !!s.showHidden;
      state.dense = !!s.dense;
      state.closedRail = s.closedRail || {};
      if (Array.isArray(s.tabs)) {
        const tabs = s.tabs.filter((t) => t && typeof t.path === 'string' && t.path);
        if (tabs.length) {
          state.tabs = tabs.map((t) => { const nt = newTab(t.path, t.view); nt.sort = t.sort || nt.sort; return nt; });
          state.active = Math.min(s.active || 0, state.tabs.length - 1);
          return true;
        }
      }
    } catch (e) { /* corrupt state, start fresh */ }
    return false;
  }

  /* ── events ──────────────────────────────────────────────────────── */
  function bind() {
    document.addEventListener('click', (ev) => {
      const target = ev.target.closest('[data-close]');
      if (target) { if (target.dataset.close === 'palette') closePalette(); else closeDialog(); }
      if (!ev.target.closest('#ctx')) hideCtx();
    });

    $('#tabs').addEventListener('click', (ev) => {
      const close = ev.target.closest('[data-close-tab]');
      if (close) {
        ev.stopPropagation();
        const i = Number(close.dataset.closeTab);
        if (state.tabs.length === 1) return;
        state.tabs.splice(i, 1);
        state.active = Math.min(state.active, state.tabs.length - 1);
        renderAll(); save();
        return;
      }
      if (ev.target.closest('#newTab')) {
        state.tabs.push(newTab(HOME));
        state.active = state.tabs.length - 1;
        renderAll(); load(HOME);
        return;
      }
      const t = ev.target.closest('[data-tab]');
      if (t) {
        state.active = Number(t.dataset.tab);
        const cur = tab();
        renderAll(); save();
        if (!cur.entries.length) load(cur.path);
      }
    });

    $('#rail').addEventListener('click', (ev) => {
      const cap = ev.target.closest('.rail-cap');
      if (cap) {
        const id = cap.dataset.sec;
        state.closedRail[id] = !state.closedRail[id];
        renderRail(); save();
        return;
      }
      const row = ev.target.closest('[data-nav]');
      if (row) {
        const p = row.dataset.nav;
        if (p.indexOf('net://') === 0 || p.indexOf('cloud://') === 0) { toast('远程连接在原型中只显示为位置入口'); return; }
        load(p, { push: true });
      }
    });

    $('#tool').addEventListener('click', (ev) => {
      const nav = ev.target.closest('[data-nav]');
      if (nav) { const p = nav.dataset.nav; if (p) load(p, { push: true }); return; }
      const view = ev.target.closest('[data-view]');
      if (view) { tab().view = view.dataset.view; renderToolbar(); renderStage(); save(); return; }
      if (ev.target.closest('#goBack')) { const t = tab(); if (t.hIndex > 0) { t.hIndex--; load(t.history[t.hIndex]); } return; }
      if (ev.target.closest('#goFwd')) { const t = tab(); if (t.hIndex < t.history.length - 1) { t.hIndex++; load(t.history[t.hIndex]); } return; }
      if (ev.target.closest('#goUp')) { const c = tab().crumbs; if (c.length > 1) load(c[c.length - 2].path, { push: true }); return; }
      if (ev.target.closest('#moreBtn')) {
        const r = ev.target.closest('#moreBtn').getBoundingClientRect();
        showCtx(r.left - 180, r.bottom + 6, [
          { label: '新建文件夹', kbd: 'Ctrl+Shift+N', icon: 'folderplus', run: () => createEntry('directory') },
          { label: '全部选中', kbd: 'Ctrl+A', icon: 'check', run: () => { const t = tab(); t.sel = new Set((t.viewList || []).map((e) => e.path)); renderStage(); renderInspector(); renderStatus(); renderIsland(); } },
          { label: (state.showHidden ? '隐藏' : '显示') + '隐藏项目', icon: 'info', run: () => { state.showHidden = !state.showHidden; renderAll(); save(); } },
          { sep: true },
          { label: '刷新', kbd: 'F5', icon: 'refresh', run: () => load(tab().path) },
          { label: '连接后端', icon: 'plug', run: () => openConnect() }
        ]);
        return;
      }
      const ghost = ev.target.closest('#pathGhost');
      if (ghost) {
        const t = tab();
        const field = $('#pathfield');
        field.innerHTML = '<input id="pathInput" type="text" value="' + esc(t.path) + '" spellcheck="false" aria-label="输入路径" /><button class="icon-btn" style="width:24px;height:24px" data-action="path-go" aria-label="跳转">' + ic('right', 13) + '</button>';
        const input = $('#pathInput');
        input.focus(); input.select();
        const go = () => { const v = input.value.trim(); if (v) load(v.replace(/"/g, ''), { push: true }); };
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); if (e.key === 'Escape') renderToolbar(); });
        $('[data-action="path-go"]').addEventListener('click', go);
      }
    });

    $('#tool').addEventListener('input', (ev) => {
      if (ev.target.id === 'filter') { tab().query = ev.target.value; renderStage(); renderInspector(); renderStatus(); }
    });

    $('#stage').addEventListener('click', (ev) => {
      const sortBtn = ev.target.closest('[data-sort]');
      if (sortBtn) {
        const t = tab();
        if (t.sort.key === sortBtn.dataset.sort) t.sort.dir = -t.sort.dir;
        else t.sort = { key: sortBtn.dataset.sort, dir: 1 };
        renderToolbar(); renderStage(); save();
        return;
      }
      const action = ev.target.closest('[data-action]');
      if (action) return; // handled once, by the shell-level listener
      const row = ev.target.closest('[data-idx]');
      if (row) {
        const idx = Number(row.dataset.idx);
        toggleAt(idx, ev.ctrlKey || ev.metaKey, ev.shiftKey);
      }
    });
    $('#stage').addEventListener('dblclick', (ev) => {
      const row = ev.target.closest('[data-idx]');
      if (!row) return;
      const e = (tab().viewList || [])[Number(row.dataset.idx)];
      openEntry(e);
    });
    $('#stage').addEventListener('contextmenu', (ev) => {
      const row = ev.target.closest('[data-idx]');
      const t = tab();
      if (row) {
        const idx = Number(row.dataset.idx);
        const e = (t.viewList || [])[idx];
        if (!t.sel.has(e.path)) toggleAt(idx, false, false);
      }
      ev.preventDefault();
      const blanks = !row;
      const items = blanks ? [
        { label: '新建文件夹', kbd: 'Ctrl+Shift+N', icon: 'folderplus', run: () => createEntry('directory') },
        { label: '全部选中', kbd: 'Ctrl+A', icon: 'check', run: () => { t.sel = new Set((t.viewList || []).map((e) => e.path)); renderStage(); renderInspector(); renderStatus(); renderIsland(); } },
        { sep: true },
        { label: '刷新', kbd: 'F5', icon: 'refresh', run: () => load(t.path) },
        { label: '在终端中打开', icon: 'wsl', run: () => { state.showTerminal = true; renderTerminal(); } }
      ] : [
        { label: '打开', kbd: 'Enter', icon: 'ext', run: () => openEntry((t.viewList || [])[Number(row.dataset.idx)]) },
        { label: '打开方式…', icon: 'app', run: () => toast('打开方式将在真实后端中列出系统注册的应用') },
        { sep: true },
        { label: '复制', kbd: 'Ctrl+C', icon: 'copy', run: () => toast('已复制 ' + t.sel.size + ' 项到剪贴板') },
        { label: '剪切', kbd: 'Ctrl+X', icon: 'cut', run: () => toast('已剪切 ' + t.sel.size + ' 项') },
        { label: '重命名', kbd: 'F2', icon: 'pencil', run: () => { const e = (t.viewList || [])[Number(row.dataset.idx)]; t.rename = { path: e.path }; renderStage(); } },
        { sep: true },
        { label: '复制路径', icon: 'tag', run: () => toast('路径已复制') },
        { label: '属性', kbd: 'Alt+Enter', icon: 'info', run: propertiesDialog },
        { sep: true },
        { label: '移到回收站', icon: 'trash', danger: true, run: trashSelection }
      ];
      showCtx(ev.clientX, ev.clientY, items);
    });

    $('#app').addEventListener('click', (ev) => {
      const a = ev.target.closest('[data-action]');
      if (a) {
        const act = a.dataset.action;
        const t = tab();
        if (act === 'open') openEntry(selectedEntry() || (t.viewList || [])[t.focus]);
        if (act === 'rename') { const e = selectedEntry() || (t.viewList || [])[t.focus]; if (e) { t.rename = { path: e.path }; renderStage(); } }
        if (act === 'trash') trashSelection();
        if (act === 'copy') toast('已复制 ' + t.sel.size + ' 项到剪贴板');
        if (act === 'cut') toast('已剪切 ' + t.sel.size + ' 项');
        if (act === 'properties') propertiesDialog();
        if (act === 'clear-sel') { t.sel = new Set(); renderStage(); renderInspector(); renderStatus(); renderIsland(); }
        if (act === 'tag') toast('标签在真实后端中写入文件属性');
        if (act === 'reveal-terminal' || act === 'terminal-open') { state.showTerminal = true; renderTerminal(); }
        if (act === 'term-close') { state.showTerminal = false; renderTerminal(); }
        if (act === 'settings') openSettings();
        if (act === 'connect') openConnect();
        if (act === 'new-folder') createEntry('directory');
        if (act === 'clear-filter') { tab().query = ''; renderToolbar(); renderStage(); renderStatus(); }
        return;
      }
      const toggle = ev.target.closest('[data-toggle]');
      if (toggle) {
        const k = toggle.dataset.toggle;
        if (k === 'hidden') { state.showHidden = !state.showHidden; toggle.setAttribute('aria-checked', String(state.showHidden)); renderStage(); }
        if (k === 'dense') { state.dense = !state.dense; toggle.setAttribute('aria-checked', String(state.dense)); renderStage(); }
        if (k === 'insp') { state.showInspector = !state.showInspector; toggle.setAttribute('aria-checked', String(state.showInspector)); syncPanels(); }
        save();
      }
    });

    $('#modal').addEventListener('click', (ev) => {
      const tg = ev.target.closest('[data-toggle]');
      if (tg) {
        const k = tg.dataset.toggle;
        if (k === 'hidden') { state.showHidden = !state.showHidden; tg.setAttribute('aria-checked', String(state.showHidden)); renderStage(); }
        if (k === 'dense') { state.dense = !state.dense; tg.setAttribute('aria-checked', String(state.dense)); renderStage(); }
        if (k === 'insp') { state.showInspector = !state.showInspector; tg.setAttribute('aria-checked', String(state.showInspector)); syncPanels(); }
        save();
        return;
      }
      if (ev.target.closest('[data-action="connect"]')) { closeDialog(); openConnect(); }
    });

    $('#stage').addEventListener('keydown', (ev) => {
      if (ev.target.id !== 'renameInput') return;
      if (ev.key === 'Enter') { ev.preventDefault(); commitRename(ev.target.value); }
      if (ev.key === 'Escape') { ev.preventDefault(); tab().rename = null; renderStage(); }
    });
    $('#stage').addEventListener('focusout', (ev) => {
      if (ev.target.id === 'renameInput' && tab().rename) commitRename(ev.target.value);
    });

    $('#termBtn').addEventListener('click', () => { state.showTerminal = !state.showTerminal; renderTerminal(); save(); });
    $('#inspBtn').addEventListener('click', () => { state.showInspector = !state.showInspector; syncPanels(); save(); });
    $('#railBtn').addEventListener('click', () => { state.showRail = !state.showRail; syncPanels(); save(); });
    $('#palTrigger').addEventListener('click', () => openPalette('commands'));

    $('#palInput').addEventListener('input', (ev) => { state.pal.query = ev.target.value; state.pal.index = 0; renderPalette(); });
    $('#palList').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-pal]');
      if (!b) return;
      const item = state.pal.items[Number(b.dataset.pal)];
      if (item) { closePalette(); item.run(); }
    });

    document.addEventListener('keydown', (ev) => {
      const mod = ev.ctrlKey || ev.metaKey;
      if ($('#modal').classList.contains('on')) { if (ev.key === 'Escape') closeDialog(); return; }
      if (state.pal.open) {
        if (ev.key === 'Escape') { ev.preventDefault(); closePalette(); return; }
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          const n = state.pal.items.length;
          if (!n) return;
          state.pal.index = (state.pal.index + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n;
          renderPalette();
          const sel = $('.pal-item[aria-selected="true"]');
          if (sel && sel.parentElement) { const l = $('#palList'); l.scrollTop = sel.offsetTop - 80; }
          return;
        }
        if (ev.key === 'Enter') {
          ev.preventDefault();
          const item = state.pal.items[state.pal.index];
          if (item) { closePalette(); item.run(); }
          return;
        }
        return;
      }
      if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) {
        if (ev.key === 'Escape') { ev.target.blur(); if (ev.target.id === 'filter') { tab().query = ''; renderToolbar(); renderStage(); renderStatus(); } }
        return;
      }
      if (mod && ev.key.toLowerCase() === 'k') { ev.preventDefault(); openPalette('commands'); return; }
      if (mod && ev.key.toLowerCase() === 'p') { ev.preventDefault(); openPalette('path'); return; }
      if (mod && ev.key === ',') { ev.preventDefault(); openSettings(); return; }
      if (mod && ev.key === '`') { ev.preventDefault(); state.showTerminal = !state.showTerminal; renderTerminal(); save(); return; }
      if (mod && ev.key.toLowerCase() === 't') { ev.preventDefault(); state.tabs.push(newTab(tab().path)); state.active = state.tabs.length - 1; renderAll(); load(tab().path); return; }
      if (mod && ev.key.toLowerCase() === 'a') { ev.preventDefault(); const t = tab(); t.sel = new Set((t.viewList || []).map((e) => e.path)); renderStage(); renderInspector(); renderStatus(); renderIsland(); return; }
      if (ev.key === 'F5') { ev.preventDefault(); load(tab().path); return; }
      if (ev.key === 'F2') { ev.preventDefault(); const t = tab(); const e = selectedEntry() || (t.viewList || [])[t.focus]; if (e) { t.rename = { path: e.path }; renderStage(); } return; }
      if (ev.key === 'Enter') { ev.preventDefault(); const t = tab(); const e = selectedEntry() || (t.viewList || [])[t.focus]; if (e) openEntry(e); return; }
      if (ev.key === 'Delete') { ev.preventDefault(); trashSelection(); return; }
      if (ev.key === 'Escape') { const t = tab(); if (t.sel.size) { t.sel = new Set(); renderStage(); renderInspector(); renderStatus(); renderIsland(); } return; }
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const t = tab();
        const n = (t.viewList || []).length;
        if (!n) return;
        const cur = t.focus < 0 ? (ev.key === 'ArrowDown' ? -1 : n) : t.focus;
        const next = Math.max(0, Math.min(n - 1, cur + (ev.key === 'ArrowDown' ? 1 : -1)));
        toggleAt(next, ev.ctrlKey || ev.metaKey, ev.shiftKey);
        const row = $('.row[data-idx="' + next + '"], .card[data-idx="' + next + '"]');
        const stage = $('#stage');
        if (row && stage) {
          const top = row.offsetTop, bottom = top + row.offsetHeight;
          if (top < stage.scrollTop + 32) stage.scrollTop = top - 32;
          else if (bottom > stage.scrollTop + stage.clientHeight) stage.scrollTop = bottom - stage.clientHeight + 8;
        }
      }
      if (ev.altKey && ev.key === 'ArrowLeft') { const t = tab(); if (t.hIndex > 0) { t.hIndex--; load(t.history[t.hIndex]); } }
      if (ev.altKey && ev.key === 'ArrowRight') { const t = tab(); if (t.hIndex < t.history.length - 1) { t.hIndex++; load(t.history[t.hIndex]); } }
      if (ev.altKey && ev.key === 'ArrowUp') { const c = tab().crumbs; if (c.length > 1) load(c[c.length - 2].path, { push: true }); }
    });

    window.addEventListener('resize', () => hideCtx());
    document.addEventListener('scroll', hideCtx, true);
  }

  function showCtx(x, y, items) {
    const ctx = $('#ctx');
    ctx.innerHTML = items.map((it, i) => it.sep ? '<hr />' : '<button role="menuitem" data-ci="' + i + '"' + (it.danger ? ' class="is-danger"' : '') + '>' + ic(it.icon || 'file', 14) + '<span class="cl">' + esc(it.label) + '</span>' + (it.kbd ? '<span class="ck">' + esc(it.kbd) + '</span>' : '') + '</button>').join('');
    ctx.classList.add('on');
    const rect = ctx.getBoundingClientRect();
    const left = Math.min(x, window.innerWidth - rect.width - 8);
    const top = Math.min(y, window.innerHeight - rect.height - 8);
    ctx.style.left = Math.max(8, left) + 'px';
    ctx.style.top = Math.max(8, top) + 'px';
    ctx.onclick = (ev) => {
      const b = ev.target.closest('[data-ci]');
      if (!b) return;
      const item = items[Number(b.dataset.ci)];
      hideCtx();
      if (item && item.run) item.run();
    };
  }
  function hideCtx() { $('#ctx').classList.remove('on'); }

  /* ── boot ────────────────────────────────────────────────────────── */
  function boot() {
    const restored = restore();
    if (!restored) {
      state.tabs = [newTab(HOME), newTab('K:\\code\\dae'), newTab('K:\\code\\dae\\docs')];
      state.tabs[1].view = 'list';
      state.tabs[2].view = 'list';
      state.active = 1;
    }
    bind();
    syncPanels();
    renderAll();
    load(tab().path || HOME);
    state.tabs.forEach((t, i) => { if (i !== state.active && !t.entries.length) preload(t); });
    // Silent bridge probe: the prototype is useful without a backend, but real
    // data is one started `bun run tauri dev` away.
    if (localStorage.getItem(BRIDGE_KEY)) {
      fetch(state.base + '/metadata').then((r) => r.json()).then(async () => {
        const home = await tryConnect(state.base);
        toast('已连接 dae 后端 · 正在读取真实目录');
        load(home || HOME);
      }).catch(() => { /* demo data */ });
    }
  }
  function preload(t) {
    if (!t.path) return;
    if (state.mode !== 'live') { const d = demoRead(t.path); t.entries = d.entries; t.crumbs = d.crumbs; t.git = d.git; t.loading = false; return; }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
