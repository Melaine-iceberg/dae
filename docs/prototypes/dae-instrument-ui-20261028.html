<style>
#dae-root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","SF Pro Text","PingFang SC","Microsoft YaHei UI","Noto Sans CJK SC",sans-serif;
  --mono:"SF Mono","Cascadia Mono",Consolas,"JetBrains Mono","DejaVu Sans Mono",monospace;
  --canvas:light-dark(#fbfbf9,#151619);
  --canvas-alt:light-dark(#f4f4f1,#1b1c20);
  --chrome:light-dark(#efefec,#101114);
  --raised:light-dark(#ffffff,#202125);
  --field:light-dark(#e9e9e5,#17181b);
  --ink:light-dark(#161719,#ecedef);
  --ink-muted:light-dark(#5c6066,#9ba0a8);
  --ink-faint:light-dark(#646970,#8b9098);
  --hairline:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.085));
  --hairline-strong:light-dark(rgba(0,0,0,.145),rgba(255,255,255,.145));
  --hover:light-dark(rgba(0,0,0,.045),rgba(255,255,255,.05));
  --fill:light-dark(rgba(0,0,0,.07),rgba(255,255,255,.08));
  --row-rule:light-dark(rgba(0,0,0,.035),rgba(255,255,255,.045));
  --signal:light-dark(#b45309,#f0a24a);
  --signal-soft:light-dark(rgba(180,83,9,.10),rgba(240,162,74,.10));
  --signal-soft-2:light-dark(rgba(180,83,9,.18),rgba(240,162,74,.16));
  --signal-ink:light-dark(#ffffff,#1b1306);
  --danger:light-dark(#b42318,#f0918a);
  --danger-solid:light-dark(#c62c26,#c6403a);
  --warn:light-dark(#9a6700,#e0a340);
  --success:light-dark(#2f7d32,#8fd18f);
  --link:light-dark(#0969da,#6cb6ff);
  --scrim:light-dark(rgba(24,24,22,.10),rgba(0,0,0,.38));
  --window-shadow:0 18px 48px light-dark(rgba(24,24,22,.16),rgba(0,0,0,.52));
  --overlay-shadow:0 14px 36px light-dark(rgba(24,24,22,.18),rgba(0,0,0,.55));
  --radius-xs:2px;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;
  --row-h:32px;--head-h:32px;
  --preview-w:300px;--sidebar-w:216px;
  color-scheme:light dark;
  color:var(--ink);
  background:transparent;
  font-family:var(--sans);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#dae-root[data-theme="light"]{color-scheme:light}
#dae-root[data-theme="dark"]{color-scheme:dark}
#dae-root[data-density="compact"]{--row-h:28px;--head-h:28px}
#dae-root[data-density="spacious"]{--row-h:40px;--head-h:36px}
#dae-root[data-accent="teal"]{--signal:light-dark(#1f7a72,#6bbcb6);--signal-soft:light-dark(rgba(31,122,114,.10),rgba(107,188,182,.10));--signal-soft-2:light-dark(rgba(31,122,114,.18),rgba(107,188,182,.16));--signal-ink:light-dark(#ffffff,#071512)}
#dae-root[data-accent="blue"]{--signal:light-dark(#1f63cc,#55c5ff);--signal-soft:light-dark(rgba(31,99,204,.10),rgba(85,197,255,.10));--signal-soft-2:light-dark(rgba(31,99,204,.18),rgba(85,197,255,.16));--signal-ink:light-dark(#ffffff,#07121c)}
#dae-root[data-motion="off"] *,#dae-root[data-motion="off"] *::before,#dae-root[data-motion="off"] *::after{transition:none!important;animation:none!important}
#dae-root *{box-sizing:border-box}
#dae-root button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
#dae-root button:focus-visible,#dae-root [tabindex]:focus-visible{outline:1px solid var(--signal);outline-offset:-2px}
#dae-root ::selection{background:var(--signal-soft-2)}
#dae-root .sprite{position:absolute;width:0;height:0;overflow:hidden}
#dae-root .ic{width:16px;height:16px;flex:none;display:block}
#dae-root .ic12{width:12px;height:12px}
#dae-root .ic14{width:14px;height:14px}
#dae-root .ic28{width:28px;height:28px}
#dae-root .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#dae-root .tnum{font-variant-numeric:tabular-nums}
#dae-root .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#dae-root .workspace{padding:16px 16px 0}
#dae-root .app-window{
  position:relative;width:100%;max-width:1320px;margin:0 auto;height:720px;
  background:var(--canvas);border:1px solid var(--hairline-strong);border-radius:10px;
  overflow:hidden;display:grid;grid-template-rows:44px 44px minmax(0,1fr) 28px;
  box-shadow:var(--window-shadow);
}
#dae-root .titlebar{display:flex;align-items:center;min-width:0;background:var(--chrome);border-bottom:1px solid var(--hairline);padding-left:10px;gap:2px;position:relative}
#dae-root[data-platform="mac"] .titlebar{padding-left:78px}
#dae-root .app-mark{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none;margin-right:4px}
#dae-root .app-mark img{width:17px;height:17px;border-radius:3px;display:block}
#dae-root[data-platform="mac"] .app-mark{display:none}
#dae-root .tabs{display:flex;align-items:flex-start;height:44px;gap:2px;min-width:0;flex:0 1 auto;overflow:hidden}
#dae-root .tab{
  position:relative;display:flex;align-items:center;gap:7px;height:32px;margin-top:6px;
  padding:0 8px 0 10px;min-width:118px;max-width:210px;flex:0 1 210px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  color:var(--ink-muted);transition:background .09s ease-out,color .09s ease-out;
}
#dae-root .tab:hover{background:var(--hover);color:var(--ink)}
#dae-root .tab.active{background:var(--fill);color:var(--ink)}
#dae-root .tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-6px;height:2px;background:var(--signal);border-radius:1px}
#dae-root .tab .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
#dae-root .tab .glyph{color:var(--ink-faint)}
#dae-root .tab.active .glyph{color:var(--ink-muted)}
#dae-root .tab .close{display:none;width:16px;height:16px;margin-left:auto;border-radius:3px;align-items:center;justify-content:center;flex:none;color:var(--ink-faint)}
#dae-root .tab:hover .close,#dae-root .tab.active .close{display:flex}
#dae-root .tab .close:hover{background:var(--fill);color:var(--ink)}
#dae-root .newtab{width:26px;height:26px;margin-top:9px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);flex:none}
#dae-root .newtab:hover{background:var(--hover);color:var(--ink)}
#dae-root .title-spacer{flex:1;min-width:8px;height:44px}
#dae-root .wincontrols{display:flex;height:44px;flex:none;margin-left:auto}
#dae-root .winbtn{width:46px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}
#dae-root .winbtn:hover{background:var(--hover);color:var(--ink)}
#dae-root .winbtn.close:hover{background:#c42b1c;color:#fff}
#dae-root[data-platform="linux"] .winbtn{width:40px}
#dae-root .traffic{display:none}
#dae-root[data-platform="mac"] .wincontrols{display:none}
#dae-root[data-platform="mac"] .traffic{display:flex;position:absolute;left:14px;top:16px;gap:8px;align-items:center}
#dae-root .light{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.14)}
#dae-root .light.red{background:#ff5f57}#dae-root .light.yellow{background:#febc2e}#dae-root .light.green{background:#28c840}
#dae-root .navbar{display:flex;align-items:center;gap:4px;padding:0 8px;min-width:0;background:var(--chrome);border-bottom:1px solid var(--hairline)}
#dae-root .navbtn{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-muted);transition:background .09s ease-out,color .09s ease-out}
#dae-root .navbtn:hover{background:var(--hover);color:var(--ink)}
#dae-root .navbtn[disabled]{opacity:.32}
#dae-root .navbtn[disabled]:hover{background:none;color:var(--ink-muted)}
#dae-root .navsep{width:1px;height:16px;background:var(--hairline);margin:0 4px;flex:none}
#dae-root .navtext{height:24px;padding:0 9px;border:1px solid var(--hairline);border-radius:var(--radius-xs);font-size:11.5px;color:var(--ink-muted);flex:none;transition:background .09s ease-out,color .09s ease-out}
#dae-root .navtext:hover{background:var(--hover);color:var(--ink)}
#dae-root .navtext.danger:hover{border-color:var(--danger);color:var(--danger);background:none}
#dae-root .crumbs{display:flex;align-items:center;min-width:0;flex:1;height:28px;padding:0 2px;border-radius:var(--radius-sm);overflow:hidden;cursor:text}
#dae-root .crumb{display:flex;align-items:center;gap:4px;height:24px;padding:0 5px;border-radius:3px;color:var(--ink-muted);font-size:12.5px;white-space:nowrap;flex:none}
#dae-root .crumb:hover{background:var(--hover);color:var(--ink)}
#dae-root .crumb.current{color:var(--ink);font-weight:500}
#dae-root .crumb-sep{color:var(--ink-faint);flex:none;margin:0 1px}
#dae-root .pathedit{display:flex;align-items:center;height:28px;flex:1;min-width:0;background:var(--field);border:1px solid var(--signal);border-radius:var(--radius-sm);padding:0 8px}
#dae-root .pathedit input{width:100%;border:0;outline:0;background:none;color:var(--ink);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
#dae-root .nav-right{display:flex;align-items:center;gap:4px;flex:none}
#dae-root .searchfield{display:flex;align-items:center;gap:6px;height:28px;width:210px;padding:0 8px;background:var(--field);border:1px solid var(--hairline-strong);border-radius:var(--radius-sm)}
#dae-root .searchfield:focus-within{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal-soft-2)}
#dae-root .searchfield input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:12.5px}
#dae-root .searchfield input::placeholder{color:var(--ink-faint)}
#dae-root .searchclear{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);flex:none}
#dae-root .searchclear:hover{background:var(--fill);color:var(--ink)}
#dae-root .filterbar{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-bottom:1px solid var(--hairline);background:var(--canvas);flex:none;overflow:hidden}

#dae-root .chip{height:22px;padding:0 7px;border:1px solid var(--hairline);border-radius:var(--radius-xs);display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-muted);flex:none}
#dae-root .chip:hover{background:var(--hover);color:var(--ink)}
#dae-root .chip.on{background:var(--fill);border-color:var(--hairline-strong);color:var(--ink)}
#dae-root .chip select{border:0;background:none;color:inherit;font:inherit;outline:0;cursor:default;max-width:92px}
#dae-root .filter-count{margin-left:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
</style>
<style>
#dae-root .main{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) 6px var(--preview-w);min-height:0;background:var(--canvas)}

#dae-root .col{display:flex;align-items:center;gap:4px;height:100%;min-width:0;font-size:11px;font-weight:500;letter-spacing:.05em;color:var(--ink-faint);white-space:nowrap}

};
const sortHead=(key,label,extra='')=>{
  const t=tab(),on=t.sort.key===key;
  const aria=on?(t.sort.dir===1?'ascending':'descending'):'none';
  return `<button class="col ${extra} ${on?'active':''}" data-action="sort" data-key="${key}" aria-sort="${aria}">${label}${on?`<span class="caret ${t.sort.dir===1?'asc':''}"></span>`:''}</button>`;
};
const rowHTML=(it,i)=>{
  const t=tab(),sel=t.selection.includes(it.name),focus=t.focusIndex===i&&state.focuskb;
  const ren=state.rename&&state.rename.name===it.name;
  const folder=it.kind==='folder';
  const drop=folder?`data-drop-path="${esc(childPath(t.path,it.name))}"`:'';
  return `<div class="row ${sel?'sel':''} ${focus?'focuskb':''}" id="row-${i}" role="option" aria-selected="${sel}" data-index="${i}" data-name="${esc(it.name)}" data-kind="${it.kind}" ${drop} draggable="true" title="${esc(it.name)}">
    <span class="namecell"><span class="ficon">${ic(fileIcon(it),'ic16')}</span>
      ${ren?`<input class="rename" id="rename-input" value="${esc(it.name)}" aria-label="重命名" spellcheck="false">`:`<span class="fname">${esc(it.name)}</span>`}
      ${it.git?`<span class="gitmark ${it.git.toLowerCase()}" title="Git 状态 ${it.git}">${it.git}</span>`:''}
    </span>
    <span class="c-type">${esc(it.type)}</span>
    <span class="c-size">${folder?'—':bytes(it.size)}</span>
    <span class="c-mod">${esc(t.path==='trash:'?it.trashed:it.modified)}</span>
  </div>`;
};
const tileHTML=(it,i)=>{
  const t=tab(),sel=t.selection.includes(it.name),focus=t.focusIndex===i&&state.focuskb;
  const drop=it.kind==='folder'?`data-drop-path="${esc(childPath(t.path,it.name))}"`:'';
  let thumb;
  if(it.image==='goose')thumb=`<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-goose"/></svg>`;
  else if(it.image==='specimen')thumb=`<svg viewBox="0 0 160 100" aria-hidden="true"><use href="#i-specimen"/></svg>`;
  else thumb=ic(fileIcon(it),'');
  return `<div class="tile ${sel?'sel':''} ${focus?'focuskb':''}" id="tile-${i}" role="option" aria-selected="${sel}" data-index="${i}" data-name="${esc(it.name)}" data-kind="${it.kind}" ${drop} draggable="true" title="${esc(it.name)}">
    <span class="thumb ${it.image?'has-image':''}">${thumb}</span><span class="tname">${esc(it.name)}</span>
  </div>`;
};
const renderList=items=>{
  const t=tab(),p=t.path;
  let h=`<div class="list-head">
    ${sortHead('name','名称','c-name')}
    ${sortHead('type','类型','c-type')}
    ${sortHead('size','大小','c-size r')}
    ${sortHead('modified',p==='trash:'?'删除时间':'修改时间','c-mod r')}
  </div>`;
  if(!items.length){h+=emptyHTML();}
  else{
    h+=`<div class="rows" role="listbox" aria-label="文件" aria-multiselectable="true" tabindex="0" aria-activedescendant="row-${t.focusIndex}">${items.map(rowHTML).join('')}</div>`;
  }
  listingEl.innerHTML=h;
};
const renderGrid=items=>{
  if(!items.length){listingEl.innerHTML=emptyHTML();return;}
  const t=tab();
  listingEl.innerHTML=`<div class="grid" role="listbox" aria-label="文件" aria-multiselectable="true" tabindex="0" aria-activedescendant="tile-${t.focusIndex}">${items.map(tileHTML).join('')}</div>`;
};
const renderColumns=()=>{
  const t=tab(),cur=t.path,par=parentPath(cur);
  const curItems=visibleItems();
  if(!curItems.length){listingEl.innerHTML=emptyHTML();return;}
  const sels=selectedItems();
  const selFolder=sels.length?sels.find(it=>it.kind==='folder'):(curItems.find(it=>it.kind==='folder'&&it.name===t.columnSel)||curItems.find(it=>it.kind==='folder'));
  const selName=selFolder?selFolder.name:null;
  const childBase=selName?childPath(cur,selName):null;
  const childItems=childBase?itemsAt(childBase):[];
  let h=`<div class="cols">`;
  if(par){
    const parItems=itemsAt(par).filter(it=>it.kind==='folder');
    h+=`<div class="mcol"><div class="mcol-head">${ic('folder','ic14')}${esc(baseName(par))}</div><div class="mcol-rows" role="listbox" aria-label="${esc(baseName(par))}">
      ${parItems.map(it=>`<div class="mcol-row ${it.name===baseName(cur)?'sel':''}" role="option" aria-selected="${it.name===baseName(cur)}" data-col="parent" data-name="${esc(it.name)}" data-action="column-nav" data-path="${esc(childPath(par,it.name))}"><span class="ficon">${ic('folder','ic14')}</span><span class="fname">${esc(it.name)}</span>${ic('chev-r','ic12')}</div>`).join('')}
    </div></div>`;
  }
  h+=`<div class="mcol"><div class="mcol-head">${ic('folder','ic14')}${esc(baseName(cur))}</div><div class="mcol-rows" role="listbox" aria-label="${esc(baseName(cur))}" aria-multiselectable="true">
    ${curItems.map(it=>`<div class="mcol-row ${t.selection.includes(it.name)?'sel':''}" role="option" aria-selected="${t.selection.includes(it.name)}" data-col="current" data-action="column-row" data-name="${esc(it.name)}" data-kind="${it.kind}" data-path="${esc(childPath(cur,it.name))}">
      <span class="ficon">${ic(fileIcon(it),'ic14')}</span><span class="fname">${esc(it.name)}</span>${it.kind==='folder'?ic('chev-r','ic12'):''}
    </div>`).join('')}
  </div></div>`;
  if(childBase){
    h+=`<div class="mcol"><div class="mcol-head">${ic('folder','ic14')}${esc(baseName(childBase))}</div><div class="mcol-rows" role="listbox" aria-label="${esc(baseName(childBase))}">
      ${childItems.length?childItems.map(it=>`<div class="mcol-row" role="option" aria-selected="false" data-col="child" data-action="column-child" data-name="${esc(it.name)}" data-kind="${it.kind}" data-base="${esc(childBase)}" data-path="${esc(childPath(childBase,it.name))}">
        <span class="ficon">${ic(fileIcon(it),'ic14')}</span><span class="fname">${esc(it.name)}</span>${it.kind==='folder'?ic('chev-r','ic12'):''}
      </div>`).join(''):`<div class="mcol-empty">空文件夹</div>`}
    </div></div>`;
  }
  h+=`</div>`;
  listingEl.innerHTML=h;
};
const renderListing=()=>{
  const t=tab(),items=visibleItems();
  const hadFocus=!!(document.activeElement&&document.activeElement.closest('.rows,.grid'));
  if(t.view==='grid')renderGrid(items);
  else if(t.view==='columns')renderColumns();
  else renderList(items);
  if(state.rename){
    const el=$('#rename-input');
    if(el){
      el.focus();
      const v=el.value,dot=v.lastIndexOf('.');
      const end=dot>0?dot:v.length;
      el.setSelectionRange(0,end);
    }
  }else if(hadFocus||state._refocusList){
    const box=listingEl.querySelector('.rows,.grid');
    if(box)box.focus({preventScroll:true});
  }
  state._refocusList=false;
};
</script>

<script>
const pvRow=(k,v)=>`<div class="pv-row"><span class="pv-key">${esc(k)}</span><span class="pv-val" title="${esc(v)}">${esc(v)}</span></div>`;
const pvAction=(label,action)=>`<button class="pv-action" data-action="${action}">${ic('info','ic14')}<span>${label}</span>${ic('chev-r','ic12')}</button>`;
const renderPreview=()=>{
  if(!state.previewOpen){prevEl.innerHTML='';return;}
  const t=tab(),sels=selectedItems();
  let body='';
  if(!sels.length){
    body=`<div class="pv-empty">未选择文件</div><div class="pv-hint">${t.path==='trash:'?'选中项目查看原位置':'单击文件查看详情'}</div>`;
  }else if(sels.length>1){
    const counts={};sels.forEach(it=>{const k=it.kind==='folder'?'文件夹':it.type;counts[k]=(counts[k]||0)+1;});
    body=`<div class="pv-big">${sels.length} 项</div><div class="pv-sub">共 ${bytes(selectedSize())}</div>
      <div class="pv-meta">${Object.entries(counts).slice(0,4).map(([k,v])=>pvRow(k,v+' 项')).join('')}</div>
      <div class="pv-types">${sels.slice(0,4).map(it=>`<span>${esc(it.name)}</span>`).join('')}${sels.length>4?`<span>…</span>`:''}</div>`;
  }else{
    const it=sels[0];
    const isFolder=it.kind==='folder';
    const cp=isFolder?childPath(t.path,it.name):'';
    const count=isFolder?itemsAt(cp).length:0;
    let thumb='';
    if(it.image==='goose')thumb=`<div class="pv-thumb"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-goose"/></svg></div>`;
    else if(it.image==='specimen')thumb=`<div class="pv-thumb"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#i-specimen"/></svg></div>`;
    else if(isFolder)thumb=`<div class="pv-thumb">${ic('folder')}</div>`;
    else if(PREVIEW_TEXT[it.name]){
      const lines=PREVIEW_TEXT[it.name].split('\n').slice(0,9);
      thumb=`<div class="pv-pre">${lines.map((l,i)=>`<div class="pv-line"><span class="ln">${i+1}</span><span class="code">${esc(l.length>40?l.slice(0,39)+'…':l)}</span></div>`).join('')}</div>`;
    }else thumb=`<div class="pv-thumb">${ic(fileIcon(it))}</div>`;
    const loc=t.path;
    const subPath=t.path==='trash:'?(it.origin||it.name):childPath(t.path,it.name);
    let rows=`${pvRow(isFolder?'项目':'大小',isFolder?count+' 项':bytes(it.size))}${pvRow('类型',it.type)}${pvRow(isFolder?'修改':'修改',it.modified)}${pvRow('位置',displayPath(loc))}`;
    if(t.path==='trash:')rows+=pvRow('原位置',it.origin)+pvRow('删除时间',it.trashed);
    if(isFolder){
      const kids=itemsAt(cp).slice(0,4);
      if(kids.length)rows=`<div class="pv-previewlist">${kids.map(k=>`<div class="pv-previewitem"><span class="ficon">${ic(fileIcon(k),'ic12')}</span>${esc(k.name)}</div>`).join('')}</div>`+rows;
    }
    body=`${thumb}<div class="pv-name">${esc(it.name)}</div><div class="pv-sub">${esc(displayPath(subPath))}</div>
      <div class="pv-meta">${rows}</div>${pvAction('全部属性','properties')}`;
    if(!isFolder&&!it.image&&!PREVIEW_TEXT[it.name])body+=`<div class="pv-hint">此类型暂无内联预览，双击使用默认应用打开。</div>`;
  }
  prevEl.innerHTML=`<div class="pv-head"><span class="pv-label">预览</span><button class="pv-close" data-action="preview-close" aria-label="关闭预览">${ic('x','ic14')}</button></div><div class="pv-body">${body}</div>`;
};
const renderStatus=()=>{
  const t=tab(),items=visibleItems(),sels=selectedItems();
  let left=`<span>${items.length} 项</span>`;
  if(sels.length)left+=`<span class="status-sep"></span><span>已选 ${sels.length} 项${selectedSize()?' · '+bytes(selectedSize()):''}</span>`;
  if(state.search.open)left+=`<span class="status-sep optional"></span><span class="optional">搜索 “${esc(state.search.query||'…')}”</span>`;
  if(t.path==='trash:')left+=`<span class="status-sep"></span><span>${state.trash.length} 项在${trashName()}</span>`;
  if(t.path.startsWith('space:'))left+=`<span class="status-sep optional"></span><span class="optional">空间</span>`;
  const transfer=`<button class="transferbtn" data-action="transfer-toggle" aria-expanded="${state.transferOpen}" title="传输队列"><span>2 项传输</span><span class="transfer-track"><span class="transfer-fill" style="width:68%"></span></span><span>68%</span></button>`;
  let right='';
  if(t.path.startsWith('~/Projects/dae'))right+=`<span class="gitstatus">${ic('branch','ic12')}main</span>`;
  right+=`<button class="toggle preview-toggle ${state.previewOpen?'on':''}" data-action="preview-toggle" aria-pressed="${state.previewOpen}" title="显示/隐藏预览">${ic('panel','ic14')}<span>预览</span></button>`;
  right+=`<button class="toggle ${state.terminalOpen?'on':''}" data-action="terminal-toggle" aria-pressed="${state.terminalOpen}" title="显示/隐藏终端">${ic('terminal','ic14')}<span>终端</span></button>`;
  statusEl.innerHTML=`<div class="status-left">${left}</div><div class="status-center">${transfer}</div><div class="status-right">${right}</div>`;
};
const renderTerminal=()=>{
  termEl.hidden=!state.terminalOpen;
  if(!state.terminalOpen){termEl.innerHTML='';return;}
  const p=displayPath(tab().path);
  const shell=state.platform==='win'?'PowerShell':state.platform==='mac'?'zsh':'bash';
  const prompt=state.platform==='win'
    ? `<span class="term-prompt">PS</span> <span class="term-dim">${esc(p)}</span><span class="term-cmd">&gt; git status --short</span>`
    : `<span class="term-prompt">dae</span> <span class="term-dim">${esc(p)}</span> <span class="term-cmd">${state.platform==='mac'?'%':'$'} git status --short</span>`;
  const promptIdle=state.platform==='win'
    ? `<span class="term-prompt">PS</span> <span class="term-dim">${esc(p)}</span><span class="term-cmd">&gt;</span> <span class="caret-blink"></span>`
    : `<span class="term-prompt">dae</span> <span class="term-dim">${esc(p)}</span> <span class="term-cmd">${state.platform==='mac'?'%':'$'}</span> <span class="caret-blink"></span>`;
  termEl.innerHTML=`<div class="term-head"><span class="term-title">${ic('terminal','ic12')} 终端 · ${shell}</span><button class="term-close" data-action="terminal-close" aria-label="关闭终端">${ic('x','ic12')}</button></div>
    <div class="term-body" aria-label="终端（只读预览）">
      <div class="term-line">${prompt}</div>
      <div class="term-line"> M crates/</div>
      <div class="term-line">?? docs/</div>
      <div class="term-line">${promptIdle}</div>
    </div>`;
};
const renderMeta=()=>{
  const seg=(key,cur,items)=>`<span class="mseg">${items.map(([v,l])=>`<button class="${cur===v?'on':''}" data-action="meta" data-key="${key}" data-value="${v}">${l}</button>`).join('')}</span>`;
  metaEl.innerHTML=`<span class="meta-title">原型控制</span>
    <span class="mgroup"><span class="mgroup-label">主题</span>${seg('theme',state.theme,[['auto','跟随'],['light','浅'],['dark','深']])}</span>
    <span class="mgroup"><span class="mgroup-label">平台</span>${seg('platform',state.platform,[['win','Windows'],['mac','macOS'],['linux','Linux']])}</span>
    <span class="mgroup"><span class="mgroup-label">密度</span>${seg('density',state.density,[['compact','紧凑'],['default','默认'],['spacious','宽松']])}</span>
    <span class="mgroup"><span class="mgroup-label">强调</span>${seg('accent',state.accent,[['amber','信号橙'],['teal','青'],['blue','蓝']])}</span>
    <span class="mgroup"><span class="mgroup-label">动效</span>${seg('motion',state.motion,[['on','完整'],['off','减少']])}</span>
    <span class="mhint">点击选择 · 右键菜单 · ${chord('Ctrl+K')} 命令面板 · 拖到侧栏移动</span>
    <button class="mreset" data-action="meta-reset">重置</button>`;
};
</script>

<script>
const menuItem=(label,action,opt={})=>{
  const {icon,c='',checked,disabled=false,danger=false}=opt;
  const lead=checked!==undefined?`<span class="mcheck">${checked?ic('check','ic14'):''}</span>`:`<span class="mic">${ic(icon||'file','ic14')}</span>`;
  return `<button class="menu-item ${danger?'danger':''}" role="menuitem" data-action="menu-run" data-value="${action}" ${disabled?'aria-disabled="true"':''}>${lead}<span class="mlabel">${label}</span>${c?`<span class="mchord">${chord(c)}</span>`:''}</button>`;
};
const menuSep=()=>`<div class="menu-sep"></div>`;
const menuHTML=()=>{
  const t=tab(),sels=selectedItems(),m=state.menu;
  if(!m)return '';
  let items='';
  if(m.type==='view'){
    items+=menuItem('列表视图','view-list',{icon:'list',c:'Ctrl+1',checked:t.view==='list'});
    items+=menuItem('网格视图','view-grid',{icon:'grid',c:'Ctrl+2',checked:t.view==='grid'});
    items+=menuItem('分栏视图','view-columns',{icon:'cols',c:'Ctrl+3',checked:t.view==='columns'});
    items+=menuSep();
    items+=menuItem('显示预览','preview-toggle',{icon:'panel',checked:state.previewOpen});
    items+=menuItem('显示终端','terminal-toggle',{icon:'terminal',checked:state.terminalOpen});
  }else if(m.type==='more'){
    items+=menuItem('刷新','refresh',{icon:'refresh',c:'F5'});
    items+=menuItem('显示隐藏文件','hidden-toggle',{icon:'eye',c:isMac()?'Ctrl+Shift+.':'Ctrl+H',checked:state.hiddenFiles});
    items+=menuSep();
    items+=menuItem('按名称排序','sort-name',{checked:t.sort.key==='name'});
    items+=menuItem('按大小排序','sort-size',{checked:t.sort.key==='size'});
    items+=menuItem('按类型排序','sort-type',{checked:t.sort.key==='type'});
    items+=menuItem('按修改时间排序','sort-modified',{checked:t.sort.key==='modified'});
    items+=menuSep();
    items+=menuItem('在终端中打开','terminal-open',{icon:'terminal'});
    items+=menuItem('设置','settings',{icon:'gear'});
  }else if(m.type==='row'){
    const it=findItem(m.name);
    if(!it)return '';
    const isFolder=it.kind==='folder';
    items+=menuItem('打开','open',{icon:isFolder?'folder':'external',c:isMac()?'Ctrl+Down':'Enter'});
    items+=menuItem('在新标签页中打开','open-tab',{icon:'plus'});
    if(isFolder)items+=menuItem('在终端中打开','terminal-open',{icon:'terminal'});
    items+=menuSep();
    items+=menuItem('复制','copy',{icon:'copy',c:'Ctrl+C'});
    items+=menuItem('剪切','cut',{icon:'cut',c:'Ctrl+X'});
    items+=menuItem('重命名','rename',{icon:'pencil',c:isMac()?'Enter':'F2'});
    items+=menuSep();
    if(t.path==='trash:'){
      items+=menuItem('还原','restore',{icon:'undo'});
      items+=menuItem('永久删除','delete-forever',{icon:'trash',danger:true});
    }else{
      items+=menuItem(trashVerb(),'trash',{icon:'trash',c:isMac()?'Ctrl+Delete':'Delete',danger:true});
    }
    items+=menuItem('属性','properties',{icon:'info',c:'Alt+Enter'});
  }else if(m.type==='empty'){
    items+=menuItem('新建文件夹','new-folder',{icon:'folder',c:'Ctrl+Shift+N'});
    items+=menuItem('新建文件','new-file',{icon:'file'});
    items+=menuSep();
    items+=menuItem('粘贴','paste',{icon:'paste',c:'Ctrl+V',disabled:!state.clipboard});
    items+=menuItem('全选','select-all',{icon:'check',c:'Ctrl+A'});
    items+=menuSep();
    items+=menuItem('刷新','refresh',{icon:'refresh',c:'F5'});
    items+=menuItem('显示隐藏文件','hidden-toggle',{icon:'eye',c:isMac()?'Ctrl+Shift+.':'Ctrl+H',checked:state.hiddenFiles});
  }
  return items;
};
const openMenu=(type,anchor,ev,name=null)=>{
  const wr=win.getBoundingClientRect();
  let x,y;
  if(ev){x=ev.clientX-wr.left;y=ev.clientY-wr.top;}
  else{x=anchor.left-wr.left;y=anchor.bottom-wr.top+4;}
  state.menu={type,x,y,name:name||(ev&&ev.target.closest('[data-name]')?ev.target.closest('[data-name]').dataset.name:null)};
  state.palette=null;state.dialog=null;state.transferOpen=false;
  renderOverlays();
  const el=$('#dae-menu');
  if(el){
    const maxX=win.clientWidth-el.offsetWidth-8,maxY=win.clientHeight-el.offsetHeight-8;
    el.style.left=Math.max(8,Math.min(x,maxX))+'px';
    el.style.top=Math.max(8,Math.min(y,maxY))+'px';
    el.querySelector('.menu-item:not([aria-disabled="true"])')?.focus();
  }
};
const PALETTE=[
  {group:'导航',icon:'arrow-l',label:'后退',c:'Alt+Left',action:'back'},
  {group:'导航',icon:'arrow-up',label:'上一级',c:'Alt+Up',action:'up'},
  {group:'导航',icon:'search',label:'搜索名称',c:'Ctrl+F',action:'search-open'},
  {group:'文件',icon:'folder',label:'新建文件夹',c:'Ctrl+Shift+N',action:'new-folder'},
  {group:'文件',icon:'pencil',label:'重命名',c:'F2',action:'rename'},
  {group:'文件',icon:'trash',label:'移到回收站',c:'Delete',action:'trash'},
  {group:'文件',icon:'copy',label:'复制',c:'Ctrl+C',action:'copy'},
  {group:'文件',icon:'paste',label:'粘贴',c:'Ctrl+V',action:'paste'},
  {group:'视图',icon:'list',label:'列表视图',c:'Ctrl+1',action:'view-list'},
  {group:'视图',icon:'grid',label:'网格视图',c:'Ctrl+2',action:'view-grid'},

const normalizePath=input=>{

  if(s===hp)return '~';

    const d=s[0].toUpperCase(),rest=s.slice(3).replace(/^\/+/,'').replace(/\/+$/,'');
    if(d==='C'||d==='D')return rest?`vol:${d}/${rest}`:`vol:${d}`;
  }
  if(s==='~')return '~';
  if(s.startsWith('~/'))return s.replace(/\/+$/,'');

};

const selectAt=(idx,opt={})=>{

  if(!names.length)return;
  if(target==='trash:'){trashNames(names);return;}
  if(target===t.path)return;
  if(names.some(n=>target===childPath(t.path,n)||target.startsWith(childPath(t.path,n)+'/'))){showToast('不能移动到自身','info');return;}
  beginUndo();
  const src=itemsAt(t.path);
  if(!(target in FS))FS[target]=[];
  const dst=FS[target];
  names.forEach(n=>{
    const i=src.findIndex(it=>it.name===n);if(i<0)return;
    const it=src.splice(i,1)[0];
    let name=it.name;
    if(dst.some(x=>x.name===name)){const dot=name.lastIndexOf('.');const base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';name=base+' 副本'+ext;let k=2;while(dst.some(x=>x.name===name))name=base+' 副本 '+k+++ext;}
    dst.push({...it,name});
    if(it.kind==='folder'){
      const oldP=childPath(t.path,it.name),newP=childPath(target,name);
      if(FS[oldP]){FS[newP]=FS[oldP];delete FS[oldP];}else FS[newP]=[];
    }
  });
  t.selection=[];t.focusIndex=0;
  state.menu=null;renderAll();showToast(`已移动到「${baseName(target)}」`,'folder','撤销');
};
const openProperties=name=>{
  const it=findItem(name||tab().selection[0]);if(!it)return;
  openDialog({type:'properties',item:it});
};
const openDialog=d=>{state.dialog=d;state.menu=null;state.palette=null;state.transferOpen=false;renderOverlays();};
const closeOverlays=()=>{state.menu=null;state.palette=null;state.dialog=null;state.transferOpen=false;renderOverlays();};
const openPalette=()=>{state.palette={query:'',index:0};state.menu=null;state.dialog=null;state.transferOpen=false;renderOverlays();};
const openSearch=()=>{state.search.open=true;state.search.query='';state._focus='search';state.menu=null;state.palette=null;state.dialog=null;renderAll();};
const closeSearch=()=>{state.search.open=false;state.search.query='';renderAll();};
const startPathEdit=()=>{state.pathEdit=true;state._focus='path';state.menu=null;renderNavbar();};
const commitPathEdit=()=>{
  const el=$('#path-input');if(!el){state.pathEdit=null;renderNavbar();return;}
  const p=normalizePath(el.value);
  if(p&&(p in FS||p==='trash:'||p.startsWith('space:'))){state.pathEdit=null;navigate(p);}
  else{showToast('路径不存在','info');el.focus();}
};
const togglePreview=()=>{state.previewOpen=!state.previewOpen;renderAll();};
const toggleTerminal=()=>{state.terminalOpen=!state.terminalOpen;renderAll();};
const toggleHidden=()=>{state.hiddenFiles=!state.hiddenFiles;state.menu=null;renderAll();showToast(state.hiddenFiles?'已显示隐藏文件':'已隐藏隐藏文件','eye');};
const runAction=(action,ctx={})=>{
  const t=tab();
  if(action==='back')goBack();
  else if(action==='forward')goForward();
  else if(action==='up')goUp();
  else if(action==='search-open')openSearch();
  else if(action==='new-folder')newFolder();
  else if(action==='new-file')newFile();
  else if(action==='rename')startRename(ctx.name||t.selection[0]);
  else if(action==='trash')trashNames(ctx.name?[ctx.name]:[...t.selection]);
  else if(action==='restore')restoreNames(ctx.name?[ctx.name]:[...t.selection]);
  else if(action==='delete-forever')openDialog({type:'confirm-delete',names:ctx.name?[ctx.name]:[...t.selection]});
  else if(action==='copy')copySelected('copy');
  else if(action==='cut')copySelected('cut');
  else if(action==='paste')pasteClipboard();
  else if(action==='select-all'){t.selection=visibleItems().map(i=>i.name);t.anchorName=t.selection[0]||null;t.focusIndex=0;renderListing();renderPreview();renderStatus();}
  else if(action==='view-list')setView('list');
  else if(action==='view-grid')setView('grid');
  else if(action==='view-columns')setView('columns');
  else if(action==='preview-toggle')togglePreview();
  else if(action==='terminal-toggle'||action==='terminal-open'){state.terminalOpen=true;renderAll();}
  else if(action==='sort-name')setSort('name',1);
  else if(action==='sort-size')setSort('size',1);
  else if(action==='sort-type')setSort('type',1);
  else if(action==='sort-modified')setSort('modified',-1);
  else if(action==='hidden-toggle')toggleHidden();
  else if(action==='refresh'){state.menu=null;renderAll();showToast('已刷新','refresh');}
  else if(action==='settings'){state.menu=null;renderOverlays();showToast('设置面板由 ShellWindow 承载，未在此原型展开','gear');}
  else if(action==='connect'){openDialog({type:'connect'});}
  else if(action==='connect-submit'){state.dialog=null;renderOverlays();showToast('已连接服务器（原型）','check');}
  else if(action==='open')openItem(ctx.name||t.selection[0]);
  else if(action==='open-tab')openInNewTab(ctx.name||t.selection[0]);
  else if(action==='properties')openProperties(ctx.name||t.selection[0]);
  else if(action==='clear-search'){state.search.query='';renderAll();}
};
</script>

#dae-root .rows:focus-visible,#dae-root .grid:focus-visible{outline:1px solid var(--signal);outline-offset:-1px}

  #dae-root .tab:not(.active){display:none}

<script>
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.getAttribute('aria-disabled')==='true')return;
  const a=el.dataset.action;
  switch(a){
    case 'tab': switchTab(Number(el.dataset.id)); break;
    case 'tab-close': e.stopPropagation(); closeTab(Number(el.dataset.id)); break;
    case 'tab-new': newTab(tab().path); break;
    case 'win': showToast('窗口控制由宿主系统接管','info'); break;
    case 'back': goBack(); break;
    case 'forward': goForward(); break;
    case 'up': goUp(); break;
    case 'crumb': navigate(el.dataset.path); break;
    case 'pathedit': startPathEdit(); break;
    case 'search-open': openSearch(); break;
    case 'search-close': closeSearch(); break;
    case 'search-case': state.search.case=!state.search.case; ensureSelectionVisible(); renderFilterbar();renderListing();renderPreview();renderStatus(); break;
    case 'view-menu': openMenu('view',el.getBoundingClientRect()); break;
    case 'more-menu': openMenu('more',el.getBoundingClientRect()); break;
    case 'nav': navigate(el.dataset.path); break;
    case 'connect': openDialog({type:'connect'}); break;
    case 'empty-trash': if(state.trash.length)openDialog({type:'confirm-delete',names:state.trash.map(t=>t.name),emptyTrash:true}); break;
    case 'sort': setSort(el.dataset.key); break;
    case 'preview-toggle': togglePreview(); break;
    case 'preview-close': state.previewOpen=false; renderAll(); break;
    case 'terminal-toggle': toggleTerminal(); break;
    case 'terminal-close': state.terminalOpen=false; renderAll(); break;
    case 'transfer-toggle': state.transferOpen=!state.transferOpen;state.menu=null;state.palette=null;state.dialog=null;renderOverlays(); break;
    case 'transfer-close': state.transferOpen=false; renderOverlays(); break;
    case 'properties': openProperties(); break;
    case 'toast-undo': undoLast(); break;
    case 'toast-close': state.toast=null; renderToast(); break;
    case 'menu-run': { const name=state.menu?.name; closeOverlays(); runAction(el.dataset.value,{name}); break; }
    case 'palette-run': { const arr=paletteFiltered(),item=arr[Number(el.dataset.index)]; closeOverlays(); if(item)runAction(item.action); break; }
    case 'close-dialog': closeOverlays(); break;
    case 'dialog-scrim': if(!e.target.closest('.dialog'))closeOverlays(); break;
    case 'palette-scrim': if(!e.target.closest('.palette'))closeOverlays(); break;
    case 'close-overlays': closeOverlays(); break;
    case 'delete-forever-confirm': deleteForever(state.dialog?.names||[],!!state.dialog?.emptyTrash); break;
    case 'connect-submit': runAction('connect-submit'); break;
    case 'column-row': { const idx=visibleItems().findIndex(i=>i.name===el.dataset.name);if(idx>=0){state.focuskb=false;selectAt(idx);} break; }
    case 'column-nav': navigate(el.dataset.path); break;
    case 'column-child': {
      const kind=el.dataset.kind,path=el.dataset.path,base=el.dataset.base,name=el.dataset.name;
      if(kind==='folder')navigate(path);
      else{navigate(base);const i=visibleItems().findIndex(x=>x.name===name);if(i>=0)selectAt(i);}
      break;
    }
    case 'new-folder': case 'paste': case 'clear-search': runAction(a); break;
    case 'meta': { const k=el.dataset.key,v=el.dataset.value; state[k]=v; renderAll(); break; }
    case 'meta-reset': {
      state.platform='win';state.theme='auto';state.density='default';state.accent='amber';state.motion='on';
      state.hiddenFiles=false;state.previewOpen=true;state.terminalOpen=false;state.previewW=300;
      root.style.setProperty('--preview-w','300px');renderAll();break;
    }
    default: break;
  }
});
listingEl.addEventListener('click',e=>{
  if(e.target.closest('input,button'))return;
  if(e.target.closest('.mcol-row'))return;
  const row=e.target.closest('.row,.tile');
  if(row){
    const idx=Number(row.dataset.index);if(Number.isNaN(idx))return;
    state.focuskb=false;
    selectAt(idx,{toggle:e.metaKey||e.ctrlKey,range:e.shiftKey});
    return;
  }
  if(e.target.closest('.rows,.grid')){
    tab().selection=[];tab().anchorName=null;
    renderListing();renderPreview();renderStatus();
  }
});
listingEl.addEventListener('dblclick',e=>{
  if(e.target.closest('input,button'))return;
  const mr=e.target.closest('.mcol-row');
  if(mr){
    const col=mr.dataset.col;
    if(col==='parent')navigate(mr.dataset.path);
    else if(col==='current')openItem(mr.dataset.name);
    else{
      const kind=mr.dataset.kind,path=mr.dataset.path,base=mr.dataset.base,name=mr.dataset.name;
      if(kind==='folder')navigate(path);
      else{navigate(base);const i=visibleItems().findIndex(x=>x.name===name);if(i>=0){selectAt(i);openItem(name);}}
    }
    return;
  }
  const row=e.target.closest('.row,.tile');
  if(row)openItem(row.dataset.name);
});
listingEl.addEventListener('contextmenu',e=>{
  const row=e.target.closest('.row,.tile,.mcol-row');
  e.preventDefault();
  if(!row){openMenu('empty',null,e);return;}
  if(row.dataset.col==='parent'||row.dataset.col==='child')return;
  const name=row.dataset.name;
  if(!tab().selection.includes(name)){
    const idx=visibleItems().findIndex(i=>i.name===name);
    if(idx>=0){state.focuskb=false;selectAt(idx);}
  }
  openMenu('row',null,e);
});
root.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search-input'){
    state.search.query=t.value;ensureSelectionVisible();
    renderFilterbar();renderListing();renderPreview();renderStatus();
  }else if(t.id==='palette-input'){
    state.palette.query=t.value;state.palette.index=0;
    renderPaletteList();
  }
});
root.addEventListener('change',e=>{
  if(e.target.matches('select[data-action="search-type"]')){
    state.search.type=e.target.value;ensureSelectionVisible();
    renderFilterbar();renderListing();renderStatus();
  }
});
root.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.id==='rename-input')setTimeout(()=>{if(state.rename)commitRename();},0);
  else if(t.id==='path-input')setTimeout(()=>{if(state.pathEdit){state.pathEdit=null;renderNavbar();}},0);
});
const paletteMove=d=>{
  const arr=paletteFiltered();if(!arr.length)return;
  state.palette.index=(state.palette.index+d+arr.length)%arr.length;
  renderPaletteList();
  const el=$('#palette-input');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
};
const paletteRun=()=>{const arr=paletteFiltered(),item=arr[state.palette.index];if(!item)return;closeOverlays();runAction(item.action);};
const menuMove=where=>{
  const items=[...ovEl.querySelectorAll('.menu-item:not([aria-disabled="true"])')];if(!items.length)return;
  let i=items.indexOf(document.activeElement),n;
  if(where==='home')n=0;else if(where==='end')n=items.length-1;
  else n=i<0?(where>0?0:items.length-1):(i+where+items.length)%items.length;
  items[n].focus();
};
const gridCols=()=>{const g=listingEl.querySelector('.grid');if(!g)return 4;return Math.max(1,Math.floor((g.clientWidth-32+10)/126));};
document.addEventListener('keydown',e=>{
  const t=e.target,key=e.key,lower=key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(state.palette){
    if(key==='Escape'){e.preventDefault();closeOverlays();return;}
    if(key==='ArrowDown'){e.preventDefault();paletteMove(1);return;}
    if(key==='ArrowUp'){e.preventDefault();paletteMove(-1);return;}
    if(key==='Enter'){e.preventDefault();paletteRun();return;}
    if(t.id!=='palette-input'&&key.length===1){const el=$('#palette-input');if(el)el.focus();}
    return;
  }
  if(state.menu){
    if(key==='Escape'){e.preventDefault();closeOverlays();return;}
    if(key==='ArrowDown'){e.preventDefault();menuMove(1);return;}
    if(key==='ArrowUp'){e.preventDefault();menuMove(-1);return;}
    if(key==='Home'){e.preventDefault();menuMove('home');return;}
    if(key==='End'){e.preventDefault();menuMove('end');return;}
    if(key==='Tab'){closeOverlays();return;}
    return;
  }
  if(state.dialog){
    if(key==='Escape'){e.preventDefault();closeOverlays();return;}
    if((t.id==='conn-host'||t.id==='conn-user')&&key==='Enter'){e.preventDefault();runAction('connect-submit');}
    return;
  }
  if(t.id==='search-input'){
    if(key==='Escape'){
      e.preventDefault();
      if(state.search.query){state.search.query='';t.value='';renderFilterbar();renderListing();renderPreview();renderStatus();}
      else closeSearch();
      return;
    }
    if(key==='Enter'||key==='ArrowDown'){
      e.preventDefault();const items=visibleItems();
      if(items.length){state.focuskb=true;selectAt(0);listingEl.querySelector('.rows,.grid')?.focus();}
      return;
    }
    return;
  }
  if(t.id==='path-input'){
    if(key==='Enter'){e.preventDefault();commitPathEdit();}
    else if(key==='Escape'){e.preventDefault();state.pathEdit=null;renderNavbar();}
    return;
  }
  if(t.id==='rename-input'){
    if(key==='Enter'){e.preventDefault();commitRename();}
    else if(key==='Escape'){e.preventDefault();cancelRename();}
    return;
  }
  if(t.matches('input,textarea,select')||t.isContentEditable)return;

  if(key==='Escape'){
    if(state.search.open){closeSearch();return;}
    if(tab().selection.length){tab().selection=[];renderListing();renderPreview();renderStatus();}
    return;
  }
  if(mod&&e.shiftKey&&lower==='n'){e.preventDefault();newFolder();return;}
  if(mod&&e.shiftKey&&lower==='p'){e.preventDefault();openPalette();return;}
  if(isMac()&&mod&&e.shiftKey&&(key==='.'||e.code==='Period')){e.preventDefault();toggleHidden();return;}
  if(mod&&!e.shiftKey){
    if(lower==='a'){e.preventDefault();runAction('select-all');return;}
    if(lower==='c'){e.preventDefault();copySelected('copy');return;}
    if(lower==='x'){e.preventDefault();copySelected('cut');return;}
    if(lower==='v'){e.preventDefault();pasteClipboard();return;}
    if(lower==='z'){e.preventDefault();undoLast();return;}
    if(lower==='f'){e.preventDefault();openSearch();return;}
    if(lower==='k'){e.preventDefault();openPalette();return;}
    if(lower==='l'){e.preventDefault();startPathEdit();return;}
    if(lower==='h'&&!isMac()){e.preventDefault();toggleHidden();return;}
    if(lower==='t'){e.preventDefault();newTab(tab().path);return;}
    if(lower==='w'){e.preventDefault();closeTab(tab().id);return;}
    if(lower==='1'){e.preventDefault();setView('list');return;}
    if(lower==='2'){e.preventDefault();setView('grid');return;}
    if(lower==='3'){e.preventDefault();setView('columns');return;}
    if(e.code==='Backquote'||key==='`'){e.preventDefault();toggleTerminal();return;}
    if(isMac()&&key==='['){e.preventDefault();goBack();return;}
    if(isMac()&&key===']'){e.preventDefault();goForward();return;}
    if(isMac()&&key==='ArrowUp'){e.preventDefault();goUp();return;}
    if(isMac()&&key==='Backspace'){e.preventDefault();trashNames([...tab().selection]);return;}
  }
  if(e.altKey&&key==='ArrowLeft'){e.preventDefault();goBack();return;}
  if(e.altKey&&key==='ArrowRight'){e.preventDefault();goForward();return;}
  if(e.altKey&&key==='ArrowUp'){e.preventDefault();goUp();return;}
  if(key==='Delete'){e.preventDefault();trashNames([...tab().selection]);return;}
  if(key==='Backspace'){if(!isMac()){e.preventDefault();goUp();}return;}
  if(key==='F2'){e.preventDefault();if(tab().selection[0])startRename(tab().selection[0]);return;}
  if(key==='F5'){e.preventDefault();renderAll();showToast('已刷新','refresh');return;}
  if(e.altKey&&key==='Enter'){e.preventDefault();if(tab().selection[0])openProperties(tab().selection[0]);return;}
  if(key==='Enter'){
    e.preventDefault();
    if(isMac()){
      const n=tab().selection[0]||(visibleItems()[tab().focusIndex]||{}).name;
      if(n)startRename(n);
      return;
    }
    const it=selectedItems()[0]||visibleItems()[tab().focusIndex];
    if(it)openItem(it.name);return;
  }
  if(isMac()&&mod&&key==='ArrowDown'){
    e.preventDefault();
    const it=selectedItems()[0]||visibleItems()[tab().focusIndex];
    if(it)openItem(it.name);return;
  }
  if(key===' '){e.preventDefault();togglePreview();return;}
  if((e.shiftKey&&key==='F10')||key==='ContextMenu'){
    e.preventDefault();
    const row=listingEl.querySelector(`.row[data-index="${tab().focusIndex}"],.tile[data-index="${tab().focusIndex}"]`);
    if(row)openMenu('row',row.getBoundingClientRect(),null,row.dataset.name);
    else openMenu('empty',null,e);
    return;
  }
  if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(key)){
    e.preventDefault();state.focuskb=true;
    const items=visibleItems();if(!items.length)return;
    if(key==='Home'){selectAt(0,{range:e.shiftKey});return;}
    if(key==='End'){selectAt(items.length-1,{range:e.shiftKey});return;}
    if(key==='PageUp'){focusStep(-10,{range:e.shiftKey});return;}
    if(key==='PageDown'){focusStep(10,{range:e.shiftKey});return;}
    const grid=tab().view==='grid';
    if(grid){
      if(key==='ArrowLeft')focusStep(-1,{range:e.shiftKey});
      else if(key==='ArrowRight')focusStep(1,{range:e.shiftKey});
      else if(key==='ArrowUp')focusStep(-gridCols(),{range:e.shiftKey});
      else focusStep(gridCols(),{range:e.shiftKey});
    }else{
      if(key==='ArrowUp')focusStep(-1,{range:e.shiftKey});
      else if(key==='ArrowDown')focusStep(1,{range:e.shiftKey});
      else if(key==='ArrowRight'){const it=selectedItems()[0];if(it&&it.kind==='folder')openItem(it.name);}
      else if(key==='ArrowLeft')goUp();
    }
    return;
  }
  if(key.length===1&&!mod&&!e.altKey){
    const now=Date.now();
    if(now-state.typeahead.at>800)state.typeahead.buf='';
    state.typeahead.buf+=lower;state.typeahead.at=now;
    const idx=visibleItems().findIndex(i=>i.name.toLowerCase().startsWith(state.typeahead.buf));
    if(idx>=0){e.preventDefault();state.focuskb=true;selectAt(idx);}
  }
});


</script>
<script>
listingEl.addEventListener('dragstart',e=>{
  if(e.target.closest('input,button'))return;
  const el=e.target.closest('.row,.tile');if(!el)return;
  const name=el.dataset.name,t=tab();
  state.drag={names:t.selection.includes(name)?[...t.selection]:[name],from:t.path};
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',state.drag.names.join('\n'));
  el.classList.add('drop-ghost');
});
listingEl.addEventListener('dragend',()=>{
  state.drag=null;
  document.querySelectorAll('.drop-ghost,.drop-target').forEach(el=>el.classList.remove('drop-ghost','drop-target'));
});
root.addEventListener('dragover',e=>{
  const target=e.target.closest('[data-drop-path]');
  if(!target||!state.drag)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drop-target').forEach(el=>{if(el!==target)el.classList.remove('drop-target');});
  target.classList.add('drop-target');
});
root.addEventListener('dragleave',e=>{
  const target=e.target.closest('[data-drop-path]');
  if(target&&!target.contains(e.relatedTarget))target.classList.remove('drop-target');
});
root.addEventListener('drop',e=>{
  const target=e.target.closest('[data-drop-path]');
  if(!target||!state.drag)return;
  e.preventDefault();
  const names=state.drag.names,to=target.dataset.dropPath;
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
  state.drag=null;
  if(to)moveNamesTo(names,to);
});
let resize=null;
gripEl.tabIndex=0;
gripEl.addEventListener('pointerdown',e=>{
  if(!state.previewOpen)return;
  resize={x:e.clientX,w:state.previewW};
  try{gripEl.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
gripEl.addEventListener('pointermove',e=>{
  if(!resize)return;
  const w=Math.max(260,Math.min(420,resize.w-(e.clientX-resize.x)));
  state.previewW=w;root.style.setProperty('--preview-w',w+'px');
});
gripEl.addEventListener('pointerup',e=>{
  resize=null;try{gripEl.releasePointerCapture(e.pointerId);}catch(_){}
});
gripEl.addEventListener('dblclick',()=>{state.previewW=300;root.style.setProperty('--preview-w','300px');});
gripEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();e.stopPropagation();
  const w=Math.max(260,Math.min(420,state.previewW+(e.key==='ArrowLeft'?16:-16)));
  state.previewW=w;root.style.setProperty('--preview-w',w+'px');
});
state.tabs.forEach(t=>{const i=itemsAt(t.path).findIndex(x=>t.selection.includes(x.name));t.focusIndex=Math.max(0,i);});
root.style.setProperty('--preview-w',state.previewW+'px');
renderAll();
</script>
