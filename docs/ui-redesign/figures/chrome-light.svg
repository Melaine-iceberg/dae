<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect x="0" y="0" width="1000" height="420" fill="#dfe1e5" /><text x="40" y="56" font-family="'Inter'" font-size="22" font-weight="600" fill="#1c1e23">外壳：两行 + 一条状态线</text><text x="40" y="80" font-family="'Inter'" font-size="13" font-weight="400" fill="#505358">标签页住进标题行；路径条是第二行唯一的输入；文件动作只随选中出现。</text><rect x="40" y="120" width="920" height="38" fill="#f7f7f9" rx="8" /><text x="56" y="144" font-family="'Inter'" font-size="12" font-weight="400" fill="#6b6d72">标签 · 窗口控制 · 拖动区</text><line x1="40" y1="158" x2="960" y2="158" stroke="#e5e6e9" stroke-width="1" shape-rendering="crispEdges"/><line x1="40" y1="112" x2="40" y2="166" stroke="#007a7b" stroke-width="1" shape-rendering="crispEdges"/><line x1="960" y1="112" x2="960" y2="166" stroke="#007a7b" stroke-width="1" shape-rendering="crispEdges"/><text x="48" y="106" font-family="'JetBrains Mono'" font-size="11" font-weight="400" fill="#007a7b">38</text><rect x="40" y="158" width="920" height="44" fill="#fdfdfd" /><text x="56" y="185" font-family="'Inter'" font-size="15" font-weight="400" fill="#505358">← → ↑</text><text x="160" y="185" font-family="'Inter'" font-size="12.5" font-weight="400" fill="#1c1e23">路径 / 地址栏 / 搜索（同一个控件）</text><text x="700" y="185" font-family="'Inter'" font-size="12" font-weight="400" fill="#505358" text-anchor="end">搜索 · 视图 · 新建 · 更多</text><line x1="40" y1="202" x2="960" y2="202" stroke="#e5e6e9" stroke-width="1" shape-rendering="crispEdges"/><line x1="40" y1="150" x2="40" y2="210" stroke="#007a7b" stroke-width="1" shape-rendering="crispEdges"/><line x1="960" y1="150" x2="960" y2="210" stroke="#007a7b" stroke-width="1" shape-rendering="crispEdges"/><text x="48" y="224" font-family="'JetBrains Mono'" font-size="11" font-weight="400" fill="#007a7b">44</text><rect x="40" y="202" width="920" height="28" fill="#f7f7f9" rx="8" /><text x="56" y="221" font-family="'Inter'" font-size="11.5" font-weight="400" fill="#505358