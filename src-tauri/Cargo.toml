[package]
name = "dae"
version = "0.1.0"
description = "Aesthetic file manager"
authors = ["melaine"]
edition = "2024"
default-run = "dae"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-devtools = "2.1.0"
tauri-plugin-dev-invoke = "0.2.0"
tauri-plugin-snap-layout = "1.0.9"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
thiserror = "2.0.20"
notify = "8.2.0"
ignore = "0.4"
rayon = "1.12.0"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
smb2 = "0.18.1"
keyring = "4.1.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
