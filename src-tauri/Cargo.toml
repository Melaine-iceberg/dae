[package]
name = "dae"
version = "0.3.0"
description = "Aesthetic file manager"
authors = ["melaine"]
edition = "2024"
default-run = "dae"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Regenerates `src/bindings.ts` for `beforeBuildCommand`; debug builds export the
# same bindings from `lib.rs::run`. `tauri build` compiles the crate with
# `cargo build --bins`, which would otherwise turn this helper into a second,
# shipped release binary, so it stays behind a feature that is off by default.
[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["export-bindings"]

[features]
# Enables the dev-only `export_bindings` helper above:
# `cargo run --features export-bindings --bin export_bindings`.
export-bindings = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# SSH transport for the SFTP backend. `ring` (instead of the default
# aws-lc-rs) keeps the build free of CMake/NASM requirements on Windows.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.0"
# `macos-private-api` is the feature that makes a `transparent` window
# compile on macOS at all (`WebviewWindowBuilder::transparent` is
# `cfg`-gated on it), and `window_material` needs transparent windows to show
# Mica / sidebar vibrancy through the chrome. It has to sit here rather than in
# the macOS target table below because `tauri-build` compares this one line
# against the `macOSPrivateApi` flag in `tauri.conf.json` on every host. On
# Windows and Linux it only forwards to wry features that gate macOS code, so
# it costs nothing there — what it does cost is Mac App Store eligibility,
# which is a decision to make later rather than a surprise.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serializes the user settings panel (shortcuts, terminal, default file
# manager) to a human-editable `settings.toml` in the app config dir.
toml = "1.1.5"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-devtools = "2.1.0"
tauri-plugin-dev-invoke = "0.3"
tauri-plugin-snap-layout = "1.0.9"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# Ships the log targets. The release build sets `windows_subsystem = "windows"`
# (nothing reads stderr) and `panic = "abort"` (no unwind), so without a file
# target a failure on a user's machine leaves no trace at all — see
# `install_panic_logger` in `lib.rs`.
tauri-plugin-log = "2"
# The facade the call sites write through. Declared directly because `log` is
# not re-exported: the plugin depends on it, but only direct dependencies are
# nameable, and a build without this line fails on every `log::error!` below.
log = "0.4"
# Rejects duplicate launches (the second instance forwards its CLI args, e.g.
# `dae://` URLs, to the running one) and registers the `dae://` protocol so
# browsers and other apps can open directories in this app.
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
# Pulls signed update bundles from the GitHub Release feed. Its endpoint and
# public key live in `tauri.release.conf.json`, which only CI merges in, so dev
# builds neither fetch nor verify updates.
tauri-plugin-updater = "2"
# Parses `dae://` URLs and percent-decodes the directory they carry.
url = "2"
percent-encoding = "2"
# Scans the installed packages' `AppxManifest.xml` files for the right-click
# commands they declare (see `shell_commands.rs`). Already pulled in by Tauri's
# own dependency tree, so the scan costs no extra compile time.
quick-xml = "0.42"
thiserror = "2.0.20"
notify = "8.2.0"
ignore = "0.4"
# Drops the `\\?\` prefix `canonicalize` returns on Windows, without letting a
# path change meaning: a verbatim base makes every child path built on it
# allocate a whole extra base path (see `types::canonical_path`).
dunce = "1.0.5"
rayon = "1.12.0"
# Global allocator; installed in `main.rs` (bin target only, so the mobile
# staticlib/cdylib build stays on the system allocator — mobile is untested).
# The Windows process heap charges ~36 ns per small allocation and listing a
# large directory allocates per entry: a 35,821-entry directory went
# 48.3 -> 32.6 ms (-31%), multi-threaded string churn -38%. The screen the UI
# actually waits on (first 512 entries) only gains 0.17 ms.
mimalloc = { version = "0.1", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# Moves entries to the system trash (recycle bin) and can restore them again,
# which backs the undoable delete flow in `file_system::commands`.
trash = "5"
smb2 = "0.21.0"
keyring = "4.1.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "bmp",
  "tiff",
  "ico",
] }
base64 = "0.23.1"
# aes-crypto enables decrypting WinZip-AES zips; ZipCrypto decryption is built in.
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.22.2"
# ripgrep's core search crates: regex line matching + binary-aware file searching.
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
git2 = "0.21.0"
# Spawns the cross-platform PTY (ConPTY on Windows, openpty on Unix) that
# backs the integrated terminal panel.
portable-pty = "0.9"
# Starts a native drag-out (OLE DoDragDrop on Windows) so files can be
# dragged from the window into Explorer, chat apps, or browsers.
# The [patch] below swaps in a vendored copy that adds `DragMode::Link`
# (DROPEFFECT_LINK) so Alt-drag can create shortcuts, like Explorer.
drag = "2.1.1"
# OAuth2 + REST for the cloud storage backends. rustls with `ring` (instead
# of aws-lc-rs or native TLS) keeps the build free of CMake/NASM/OpenSSL
# requirements, matching the `russh` choice above. `rustls-no-provider` leaves
# provider selection to us — the code installs `ring` via
# `install_default()` before building a client — and verifies certificates
# through the platform trust store rather than bundled webpki roots, which
# 0.13 dropped.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  # 0.13 made the urlencoded-serialised builders optional; `.form()` and
  # `.query()` are how every cloud request in `file_system::cloud` is built.
  "form",
  "query",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
async-trait = "0.1"
sha2 = "0.11.0"
# MD5 + SHA-1 alongside `sha2` back the properties dialog's checksum tab
# (download verification); all three share the `digest` trait, so one read
# updates every algorithm. `md-5` is RustCrypto's crate (lib name `md5`).
md-5 = "0.11.0"
sha1 = "0.11.0"
rand = "0.10.2"
# Maps file paths to freedesktop MIME types. The Linux "Open With" picker uses
# it to match applications declared in `.desktop` files, and the shell-command
# section uses it to match KDE service menus the same way.
#
# Declared for every platform rather than behind `cfg(target_os = "linux")` on
# purpose: `shell_commands/linux.rs` is compiled under `cfg(test)` too, so the
# Linux backend at least type-checks — and its host-independent tests run — on a
# Windows machine, which is where it is written. The crate is pure Rust and was
# already in the dependency tree.
mime_guess = "2"
# Reads the Linux accent from the freedesktop settings portal
# (system_accent/linux.rs). Target-gated to Linux: the Windows and macOS
# backends read their own settings and do not want a D-Bus stack behind them.
# zbus is already in the dependency tree through Tauri's Linux integration, so
# this adds no compile time there.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[patch.crates-io]
drag = { path = "vendor/drag" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  # `Package::Current` — the package-identity probe behind
  # `get_package_family_name` in lib.rs (winapp CLI's Tauri guide).
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  # `shell_commands.rs` builds `IShellItemArray`s from ID lists, activates the
  # packaged `IExplorerCommand` servers behind Windows 11's right-click menu and
  # pumps the STA message queue while it waits on them.
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  # `system_files::get_key_modifiers` reads the held Ctrl/Shift/Alt/Win keys
  # (`GetAsyncKeyState`) so a native drag-and-drop can honor them — the webview
  # receives no DOM keyboard events while another application drags.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_Security",
] }

# Resolves account names for the properties dialog (getpwnam_r/getgrnam_r),
# which must honor NSS so domain-joined machines work.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# CoreFoundation bindings for the macOS "Open With" picker: LaunchServices
# application enumeration and default-handler registration.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
# The context menu's macOS side: `NSPerformService` hands a selection to an
# application's declared service, through an `NSPasteboard` of file URLs, and
# `UTType` decides which services apply to a file. `NSApplication` is not
# optional — it is the feature that gates `NSPerformService` itself.
#
# Already in the dependency tree (tao, arboard and tray-icon all bind AppKit),
# so declaring them here adds no build time. `objc2` reaches the rest of the
# crates' `Retained` and `ProtocolObject`, which is why it is named directly.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSPasteboard",
  # `file_icons::macos` reads the Finder's icon: `iconForFile:` hands back an
  # `NSImage`, whose `representations` are downcast to `NSBitmapImageRep` for a
  # lossless TIFF that the `image` crate then re-encodes as PNG. Each of those
  # three steps is behind its own feature.
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  # `NSArray::iter` — how `file_icons::macos` walks an icon's representations —
  # is behind this feature, and `NSArray` alone does not turn it on. Same reason
  # `NSData` is named below.
  "NSEnumerator",
  "NSLocale",
  "NSString",
  "NSURL",
  # Named directly for `NSData::to_vec()`. The AppKit features above turn it on
  # transitively, but a transitive feature does not make a type nameable here —
  # same reason `log` is declared above despite the plugin depending on it.
  "NSData",
] }
objc2-uniform-type-identifiers = "0.3"
# Reads the Finder put-back records (ptbN/ptbL) from ~/.Trash/.DS_Store so
# the trash view can list and restore entries on macOS, where the `trash`
# crate only supports `delete`. See file_system/macos_trash.rs.
trash-core = { version = "0.3", default-features = false, features = ["macos"] }

# The in-memory mock credential store for the cloud account tests, keeping
# them away from the real OS keychain.
[dev-dependencies]
keyring-core = "1"

# rustc 1.98 surfaces MSVC link.exe's informational stdout ("正在创建库 …" /
# "正在创建对象 …") as `linker_messages` warnings on every link step. Nothing
# failed — the linker is only reporting what it wrote — so this is pure noise
# that buries real warnings.
#
# Silenced through `[lints]` rather than `rustflags` in `.cargo/config.toml`:
# rustflags feed into the fingerprint of every crate, so a cosmetic fix there
# would force a full rebuild of all dependencies.
[lints.rust]
linker_messages = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
