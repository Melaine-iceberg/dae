[package]
name = "dae"
version = "0.1.0"
description = "Aesthetic file manager"
authors = ["melaine"]
edition = "2024"
default-run = "dae"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# SSH transport for the SFTP backend. `ring` (instead of the default
# aws-lc-rs) keeps the build free of CMake/NASM requirements on Windows.
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
russh-sftp = "2.4"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-devtools = "2.1.0"
tauri-plugin-dev-invoke = "0.3"
tauri-plugin-snap-layout = "1.0.9"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
thiserror = "2.0.20"
notify = "8.2.0"
ignore = "0.4"
rayon = "1.12.0"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# Moves entries to the system trash (recycle bin) and can restore them again,
# which backs the undoable delete flow in `file_system::commands`.
trash = "5"
smb2 = "0.18.1"
keyring = "4.1.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
base64 = "0.22"
# aes-crypto enables decrypting WinZip-AES zips; ZipCrypto decryption is built in.
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.21"
# ripgrep's core search crates: regex line matching + binary-aware file searching.
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
git2 = "0.21.0"
# Spawns the cross-platform PTY (ConPTY on Windows, openpty on Unix) that
# backs the integrated terminal panel.
portable-pty = "0.9"
# Starts a native drag-out (OLE DoDragDrop on Windows) so files can be
# dragged from the window into Explorer, chat apps, or browsers.
# The [patch] below swaps in a vendored copy that adds `DragMode::Link`
# (DROPEFFECT_LINK) so Alt-drag can create shortcuts, like Explorer.
drag = "2.1.1"
# OAuth2 + REST for the cloud storage backends. rustls with `ring` (instead
# of aws-lc-rs or native TLS) keeps the build free of CMake/NASM/OpenSSL
# requirements, matching the `russh` choice above.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "json",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
async-trait = "0.1"
sha2 = "0.10"
# MD5 + SHA-1 alongside `sha2` back the properties dialog's checksum tab
# (download verification); all three share the `digest` trait, so one read
# updates every algorithm. `md-5` is RustCrypto's crate (lib name `md5`).
md-5 = "0.10"
sha1 = "0.10"
rand = "0.9"

[patch.crates-io]
drag = { path = "vendor/drag" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }

# Resolves account names for the properties dialog (getpwnam_r/getgrnam_r),
# which must honor NSS so domain-joined machines work.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# CoreFoundation bindings for the macOS "Open With" picker: LaunchServices
# application enumeration and default-handler registration.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

# Maps file paths to freedesktop MIME types so the Linux "Open With" picker
# can match applications declared in `.desktop` files.
[target.'cfg(target_os = "linux")'.dependencies]
mime_guess = "2"

# The in-memory mock credential store for the cloud account tests, keeping
# them away from the real OS keychain.
[dev-dependencies]
keyring-core = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
