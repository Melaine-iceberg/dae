appId: com.melaine.dae
productName: dae
copyright: Copyright © 2026 melaine

directories:
  output: dist-electron

# The installer registers `dae://` so links such as `dae://open?path=...` reach
# the running instance (the main process buffers and forwards them).
protocols:
  - name: dae
    schemes:
      - dae

# The renderer is a self-contained Vite bundle; main/preload/core use Node
# built-ins plus the .node addon. No runtime node_modules are needed.
files:
  - dist/**/*
  - electron/**/*
  - native/dae_core_native.node
  - package.json
  - "!node_modules/**/*"

# The addon cannot be loaded from inside an asar, and the core entry runs in a
# utility process, which needs a real path on disk too.
asarUnpack:
  - native/**/*
  - electron/core/**/*

npmRebuild: false

# Use the Electron distribution already downloaded by node_modules/electron
# instead of letting electron-builder fetch it from GitHub again.
electronDist: node_modules/electron/dist

win:
  target:
    - dir
