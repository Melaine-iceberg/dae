[package]
name = "dae-core-native"
version = "0.0.0"
edition = "2024"
description = "N-API core process for the dae Electron shell"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "dae_core_native"

[dependencies]
base64 = "0.23.1"
dae-core = { path = "../src-tauri/crates/dae-core" }
dirs = "6"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
# MD5 + SHA-1 alongside `sha2` back the properties dialog's checksum tab;
# all three share the `digest` trait, so one read updates every algorithm.
md-5 = "0.11.0"
napi = { version = "2", default-features = false, features = ["async", "napi8", "serde-json", "tokio_rt"] }
napi-derive = "2"
notify = "8.2.0"
portable-pty = "0.9"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
sysinfo = { version = "0.39.2", default-features = false, features = ["disk"] }
tokio = { version = "1", features = ["sync", "rt", "time", "net"] }
toml = "1.1.5"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSColorSpace", "NSEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"

# This crate shares its manifest directory with `src-tauri/crates/dae-core`, so
# it owns its own lockfile/target instead of joining the shell's build.
[workspace]
